version: v1.0
name: Update Semaphore configuration
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204
blocks:
  - name: C1AutomationTest
    task:
      jobs:
        - name: C1AutomationTest
          commands:
            - echo "Starting prologue commands"
            - checkout
            - sudo apt-get update
            - sudo apt-get remove -y google-chrome-stable
            - sudo apt-get install -y wget unzip
            - echo "Downloading and installing Google Chrome"
            - 'wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb'
            - sudo dpkg -i google-chrome-stable_current_amd64.deb
            - sudo apt-get install -f -y
            - echo "Downloading and setting up ChromeDriver"
            - 'wget https://chromedriver.storage.googleapis.com/114.0.5735.90/chromedriver_linux64.zip'
            - unzip chromedriver_linux64.zip
            - sudo mv chromedriver /usr/local/bin/chromedriver
            - chromedriver --version
            - google-chrome --version
            - echo "Installing Node.js and npm"
            - sudo apt-get install -y nodejs npm
            - echo "Prologue commands completed"
            - echo "Starting C1LoginTest job"
            - cd /home/semaphore/QATestAutomation/testAutomation_v1.0
            - echo "Setting Node.js version"
            - sem-version node 20
            - echo "Restoring npm cache"
            - cache restore
            - echo "Installing npm dependencies"
            - npm install
            # ADR-025: test data, env.json and capabilities.json carry {{env.NAME}} tokens instead of
            # passwords. The values arrive as ONE secret (C1_ENV_BUNDLE = the whole untracked .env) and
            # are written back to .env so CI resolves credentials through the same core/utils/envConfig.js
            # path as a local run. The scan gates the run before any browser is launched.
            - |
              echo "Materialising credentials from the C1_ENV_BUNDLE secret (ADR-025)"
              if [ -z "$C1_ENV_BUNDLE" ]; then
                echo "C1_ENV_BUNDLE secret is not set - every env token in the test data would resolve"
                echo "to nothing and each suite would fail at login with a misleading auth error."
                exit 1
              fi
              printf '%s\n' "$C1_ENV_BUNDLE" > .env
              npm run secrets:scan
            - echo "Storing npm cache"
            - cache store
            - echo "Running test script"
            - export BROWSER_CAPABILITY="lambdatest-chrome-1920"
            - $TEST_COMMAND --testEnv=$TEST_ENV
            - |
              RESULT=$?
              echo "Test result: $RESULT"

              if [ "$RESULT" -eq 0 ]; then
                STATUS="passed"
              else
                STATUS="failed"
              fi

              echo "STATUS set to: $STATUS"
            - echo "Verifying directory structure"
            - echo "Listing files in the root directory"
            - ls -la || echo "No files found in root directory"
            - echo "Changing directory to /home/semaphore/QATestAutomation/testAutomation_v1.0/output/reports"
            - 'cd /home/semaphore/QATestAutomation/testAutomation_v1.0/output/reports || { echo "Directory not found"; exit 1; }'
            - echo "Listing files in output/reports directory"
            - 'ls -la || { echo "No reports directory found"; exit 1; }'
            - echo "Changing directory to TestReports"
            - 'cd TestReports || { echo "No TestReports directory found"; exit 1; }'
            - echo "Listing files in TestReports directory"
            - 'ls -la || { echo "No files found in TestReports directory"; exit 1; }'
            - |
              echo "Verifying Timeline report files"

              TIMELINE_REPORT=$(find /home/semaphore/QATestAutomation/testAutomation_v1.0/output/reports/TestReports -type f -name "*.html")

              if [ -z "$TIMELINE_REPORT" ]; then
                echo "No HTML report files found"
                exit 1
              else
                echo "Timeline report found: $TIMELINE_REPORT"
              fi
            - |
              echo "Verifying log file location"

              LOG_FILE="/home/semaphore/QATestAutomation/testAutomation_v1.0/output/reports/TestReports/wdio-0-0-timeline-reporter.log"

              if [ ! -f "$LOG_FILE" ]; then
                echo "Timeline log file not found at expected location: $LOG_FILE"
                exit 1
              else
                echo "Timeline log file found: $LOG_FILE"
              fi
            - echo "Waiting for log file to be completely written"
            - echo "Waiting for log file to be completely written"
            - sleep 10
            - echo "Setting environment variables for mailer.js"
            - export emailId="randomdump1702@gmail.com"
            - export SEMAPHORE_JOB_ID="$SEMAPHORE_JOB_ID"
            - echo "$SEMAPHORE_JOB_ID"
            - export SEMAPHORE_WORKFLOW_NUMBER="$SEMAPHORE_WORKFLOW_NUMBER"
            - echo "$SEMAPHORE_WORKFLOW_NUMBER"
            - 'export mailingList="ashish.kushwaha@comprotechnologies.com,vimal.mishra@comprotechnologies.com"'
            - |
              if [[ "$BROWSER_CAPABILITY" == lambdatest-* ]]; then
                echo "LambdaTest execution detected: $BROWSER_CAPABILITY"

                cd /home/semaphore/QATestAutomation/testAutomation_v1.0/core/utils/lambdatest
                export LT_SHARE_URL=$(node shareableLink.js)

                if [ -n "$LT_SHARE_URL" ]; then
                  echo "LambdaTest Share URL generated: $LT_SHARE_URL"
                else
                  echo "LambdaTest Share URL not generated"
                fi
              else
                echo "Local execution detected"
                export LT_SHARE_URL=""
              fi
            - echo "Running mailer.js with parameters and logging additional details"
            - 'cd /home/semaphore/QATestAutomation/testAutomation_v1.0/core/utils || { echo "Directory not found"; exit 1; }'
            - |
              node mailer.js --appType="ExperienceApp" --testEnv="$TEST_ENV" --projectName="$SEMAPHORE_PROJECT_NAME" --branchName="$SEMAPHORE_GIT_BRANCH" --buildNumber="$SEMAPHORE_WORKFLOW_NUMBER" --jobID="$SEMAPHORE_JOB_ID" --mailingList="$mailingList" --jobResult="$STATUS" --emailId="$emailId" --emailPwd="$emailPwd" --triggerSource="Semaphore" > /home/semaphore/mailer.log 2>&1
            - echo "mailer.js script execution completed with exit code $?"
            - 'echo "Mailer.js log:"'
            - cat /home/semaphore/mailer.log
      secrets:
        - name: Cred
        - name: LambdaTest
        - name: loginFeatureTest
        # ADR-025 — holds every credential variable the {{env.*}} tokens resolve against, as the
        # contents of the untracked .env. One secret, so rotating a password is not a YAML change.
        - name: C1_ENV_BUNDLE
      env_vars:
        - name: TEST_ENV
          value: production
