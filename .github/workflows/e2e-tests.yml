name: C1 E2E Automation

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Trigger this workflow automatically whenever code is pushed to the main branch.
  push:
    branches:
      - main
      
  # Manual trigger — pick npm script from the Actions UI
  workflow_dispatch:
    inputs:
      npm_script:
        description: 'npm script to run (e.g. loginFeatureTest_LT, eBookFeatureTest_LT, loginFeatureTest_thor)'
        required: true
        default: 'loginFeatureTest_LT'
        type: string

  # Nightly scheduled run — 9:30 PM IST (4:00 PM UTC)
  schedule:
    - cron: '0 16 * * *'

# ── Top-level env (used by both manual and scheduled runs) ────────────────────
env:
  NODE_VERSION: '24'
  WORKING_DIR: testAutomation_v1.0
  # Default script for the nightly schedule (workflow_dispatch input overrides it)
  DEFAULT_NPM_SCRIPT: loginFeatureTest_LT

jobs:
  e2e-test:
    name: 'E2E — ${{ github.event.inputs.npm_script || ''loginFeatureTest_LT'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + npm cache ───────────────────────────────────────────────
      #    cache: 'npm' uses package-lock.json as the cache key.
      #    On cache hit the next step (npm ci) still runs but is near-instant.
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 3. Install dependencies ──────────────────────────────────────────────
      #    npm ci is preferred over npm install in CI — it is faster, reproducible,
      #    and fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm install        # was: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Install nodemailer
        run: npm install nodemailer
        working-directory: ${{ env.WORKING_DIR }}  

      # ── 3b. Secrets + credential scan (ADR-025) ──────────────────────────────
      #    Test data, env.json and capabilities.json carry env-tokens ({{env.NAME}}) instead of
      #    passwords. Those values live in an untracked .env locally, and reach CI as ONE repository
      #    secret: C1_ENV_BUNDLE holds the whole .env file. Writing it back to .env here means CI and
      #    a local run resolve credentials through the identical code path (core/utils/envConfig.js),
      #    and a rotated password stays a one-secret change instead of a workflow edit.
      #    Placed BEFORE the Playwright browser download so a leaked credential fails in seconds,
      #    and the scan itself is what the pre-commit hook and Semaphore run too.
      - name: Materialise secrets and scan tracked files (ADR-025)
        run: |
          if [ -z "$C1_ENV_BUNDLE" ]; then
            echo "::error::C1_ENV_BUNDLE secret is not set. Without it every env-token in the test"
            echo "::error::data resolves to nothing and each suite fails at login with a misleading"
            echo "::error::auth error instead of a configuration error. Create the secret first."
            exit 1
          fi
          printf '%s\n' "$C1_ENV_BUNDLE" > .env   # untracked: .env is in .gitignore
          npm run secrets:scan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          C1_ENV_BUNDLE: ${{ secrets.C1_ENV_BUNDLE }}

      # Install Playwright browser binaries and system libraries for local execution profiles (e.g. desktop-chrome-1920)
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.WORKING_DIR }}  

      # ── 4. Detect Environment and App Type ───────────────────────────────────
      #    Auto-detects --testEnv and --appType from the selected npm script in
      #    package.json at runtime.
      - name: Detect Environment and App Type
        id: detect_env
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            const scriptName = process.env.SCRIPT;
            const scriptCmd = (pkg.scripts && pkg.scripts[scriptName]) || "";

            const envMatch = scriptCmd.match(/--testEnv[=\s]+([^\s]+)/);
            const appMatch = scriptCmd.match(/--appType[=\s]+([^\s]+)/);

            const testEnv = envMatch ? envMatch[1] : "production";
            const appType = appMatch ? appMatch[1] : "ExperienceApp";

            console.log("▶ Script Name:       " + scriptName);
            console.log("▶ Script Definition: " + (scriptCmd || "(custom)"));
            console.log("▶ Resolved TEST_ENV: " + testEnv);
            console.log("▶ Resolved APP_TYPE: " + appType);

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `TEST_ENV=${testEnv}\nAPP_TYPE=${appType}\n`);
            }
            if (process.env.GITHUB_ENV) {
              fs.appendFileSync(process.env.GITHUB_ENV, `TEST_ENV=${testEnv}\nAPP_TYPE=${appType}\n`);
            }
          '
        working-directory: ${{ env.WORKING_DIR }}
        env:
          SCRIPT: ${{ github.event.inputs.npm_script || env.DEFAULT_NPM_SCRIPT }}

      # ── 5. Run E2E tests ─────────────────────────────────────────────────────
      #    continue-on-error: true — test failures must NOT stop the workflow here.
      #    We still need to run the email step. The job is failed explicitly in
      #    Step 9 after the email is sent.
      - name: Run E2E tests
        id: run_tests
        continue-on-error: true
        run: |
          SCRIPT="${{ github.event.inputs.npm_script || env.DEFAULT_NPM_SCRIPT }}"
          echo "▶ Running: npm run $SCRIPT (Environment: ${{ steps.detect_env.outputs.TEST_ENV }}, App: ${{ steps.detect_env.outputs.APP_TYPE }})"
          if npm run "$SCRIPT"; then
            echo "TEST_RESULT=passed" >> $GITHUB_OUTPUT
          else
            echo "TEST_RESULT=failed" >> $GITHUB_OUTPUT
          fi
        working-directory: ${{ env.WORKING_DIR }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          PWHEADLESS: '1'
          TEST_ENV: ${{ steps.detect_env.outputs.TEST_ENV }}
          APP_TYPE: ${{ steps.detect_env.outputs.APP_TYPE }}

      # ── 6. Generate LambdaTest shareable link ────────────────────────────────
      #    shareableLink.js returns the LambdaTest session URL for the last build.
      #    The URL is written to both GITHUB_OUTPUT (for Step 7) and GITHUB_ENV
      #    (so mailer.js can read it as process.env.LT_SHARE_URL).
      - name: Generate LambdaTest shareable link
        id: lt_link
        if: always()
        run: |
          URL=$(node core/utils/lambdatest/shareableLink.js || echo "")
          echo "LT_SHARE_URL=$URL" >> $GITHUB_OUTPUT
          echo "LT_SHARE_URL=$URL" >> $GITHUB_ENV
          if [ -n "$URL" ]; then
            echo "✅ LambdaTest share URL: $URL"
          else
            echo "⚠️  LambdaTest share URL not generated (local run or API error)"
          fi
        working-directory: ${{ env.WORKING_DIR }}
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

      # ── 7. Send email via mailer.js ──────────────────────────────────────────
      #    Passes GitHub Actions equivalents for the Semaphore variables that
      #    mailer.js expects (projectName, branchName, buildNumber, jobID).
      #    --triggerSource triggers the dynamic CI URL logic added in Phase 3.
      #    --testEnv and --appType are resolved at runtime from Step 4 (detect_env).
      - name: Send email report
        if: always()
        run: |
          node mailer.js \
            --appType="${{ steps.detect_env.outputs.APP_TYPE || env.APP_TYPE || 'ExperienceApp' }}" \
            --testEnv="${{ steps.detect_env.outputs.TEST_ENV || env.TEST_ENV || 'production' }}" \
            --projectName="${{ github.repository }}" \
            --branchName="${{ github.ref_name }}" \
            --buildNumber="${{ github.run_number }}" \
            --jobID="${{ github.run_id }}" \
            --mailingList="ashish.kushwaha@comprotechnologies.com,harish.kumar@comprotechnologies.com,vimal.mishra@comprotechnologies.com" \
            --jobResult="${{ steps.run_tests.outputs.TEST_RESULT }}" \
            --emailId="${{ secrets.EMAIL_ID }}" \
            --emailPwd="${{ secrets.EMAIL_PWD }}" \
            --triggerSource="GitHub Actions"
        # mailer.js resolves output/reports + env.json via `../../` (cwd must be core/utils,
        # as on Semaphore) — run it from there, NOT the repo working dir, or it ENOENTs at load.
        working-directory: ${{ env.WORKING_DIR }}/core/utils
        env:
          LT_SHARE_URL: ${{ steps.lt_link.outputs.LT_SHARE_URL }}
          TEST_ENV: ${{ steps.detect_env.outputs.TEST_ENV }}
          APP_TYPE: ${{ steps.detect_env.outputs.APP_TYPE }}

      # ── 8. Upload Mochawesome report as downloadable artifact ─────────────────
      #    The entire output/reports/ tree is uploaded (includes mochawesome HTML +
      #    JSON with inline base64 screenshots). Retained for 14 days.
      #    if-no-files-found: warn — don't fail the step if the test crashed before
      #    writing the report (the email already captured the failure).
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-${{ github.run_number }}
          path: ${{ env.WORKING_DIR }}/output/reports/
          retention-days: 14
          if-no-files-found: warn

      # ── 9. Enforce final job status ──────────────────────────────────────────
      #    Because Step 5 used continue-on-error, the job would show green even
      #    on test failures. This step enforces the correct red ✗ on GitHub.
      - name: Fail job if tests failed
        if: steps.run_tests.outputs.TEST_RESULT == 'failed'
        run: |
          echo "❌ Tests failed — marking job as failed."
          exit 1
