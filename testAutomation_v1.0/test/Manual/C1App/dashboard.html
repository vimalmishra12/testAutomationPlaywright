 with LITERAL square brackets in the text, e.g. \"[mn] [acPZ-EQTo]\" (raw markup: <button class=\"dropdown-item work-break class-list\">[mn] [acPZ-EQTo]</button>). CONFIRMED AS-DESIGNED [user, 2026-08-26] — this is the intended display format, NOT leftover template markup. Recorded for reference so it is not re-flagged as a defect; expected results may assert it verbatim; (b) only 5 classes were VISIBLE although the school shows 106, while 2330 class options sit pre-rendered and hidden behind the dialog — so it is NOT that only 5 exist. [ASSUMED] the visible list is paged/lazily loaded, or filtered (e.g. to the admin's own classes), or intended to be reached via the \"Search classes\" box rather than scrolled. DECISION [user, 2026-08-26]: reason UNKNOWN and not chased — scrolling and searching the list were avoided because the next click in that dialog adds material to a real class on the shared school, irreversibly. ⚠️ NEVER ASSERT A CLASS COUNT in this dialog, and do not treat \"only 5 shown\" as a defect. Assert the dialog's structure instead: heading, Search classes input, a non-empty class list, and Add to Class disabled until a selection is made. AUTOMATION TRAP: 2330 pre-rendered class options, ALL sharing the single qid \"t-prd-umb-dd-1\" and all hidden until the dialog opens — a presence check is a guaranteed false green (admin-shared.md §B2).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"37","id":"TST_UMBP_TC_6","title":"Verify a component covered by an active school licence shows its licence status with start and expiry dates","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Edge","priority":"Medium","preconditions":"Product materials view open for a product with at least one school-licensed component.","steps":"1. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. Locate the components \"Practice Extra (ankur)\", \"Student Resource Bank\" and \"Downloadable Asset\".\n3. Read the status line and the date line on each.","testData":"Product testumbrellabundle","expected":"1. Each such component shows the status text VERBATIM \"School licence active\".\n2. Below it a date line reads \"Started: <Mon D, YYYY> Expires: <Mon D, YYYY>\" — e.g. \"Started: Jul 5, 2024 Expires: Jul 4, 2029\".\n3. No \"Activate\" control is offered for a component already covered by an active licence.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Copy captured live 2026-08-24. NOTE the different date wording used elsewhere: components on the R55 product show a bare \"Expires\" + date on its own line with no \"Started:\", and School licence TILES use \"Expires <date>\" with no colon (TST_LIBR_TC_24). Three date formats across one feature — worth raising as a consistency issue.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"38","id":"TST_UMBP_TC_7","title":"Verify an unactivated component offers Activate and an expired component offers Re-activate","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Edge","priority":"Medium","preconditions":"Product materials view open for a product containing both an unactivated and an expired component.","steps":"1. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. Locate the component \"Test1\" / \"multiumbrellatest1\".\n3. Locate the components \"Test Generator\" / \"Test Generator - updated\" and \"Presentation Plus\".\n4. Record the control and status text shown on each. DO NOT click any activation control.","testData":"Product testumbrellabundle","expected":"1. The unactivated component \"Test1\" shows an \"Activate\" control and no licence dates.\n2. The expired components show \"Re-activate\" together with the status \"Expired\" and the expiry date — e.g. \"Test Generator | Test Generator - updated | Re-activate | Expired | Jul 12, 2022\" and \"Presentation Plus | Presentation Plus | Re-activate | Expired | Jul 5, 2022\".\n3. \"Activate\" and \"Re-activate\" are visually distinct states, not the same label.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. DELIBERATELY READ-ONLY. Activation changes the school's entitlement for every teacher and student and cannot be undone on the shared school FCN-CHZ-PDA (admin-shared.md §A5), so this case asserts the CONTROLS and STATUS TEXT only. Exercising activation needs a dedicated school and is out of scope for this batch.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"39","id":"TST_UMBP_TC_8","title":"Verify the activation summary reports how many of the product's components are activated","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Edge","priority":"Low","preconditions":"Product materials view open for an umbrella product that reports an activation summary.","steps":"1. Open \"See materials\" for \"R55 Multi Component Umbrella\".\n2. Read the summary line shown near \"Activate materials\".\n3. Count the components on the page that show an activated state.","testData":"Product r55multicomponent — summary read \"3 out of 4 components activated\" at capture","expected":"1. A summary line reads \"<N> out of <M> components activated\" — e.g. \"3 out of 4 components activated\".\n2. The numbers are consistent with the component states shown on the tiles below.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. INCONSISTENCY FOUND 2026-08-24, REVIEWED 2026-08-26: the summary is present on \"R55 Multi Component Umbrella\" but ABSENT on \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\" — and not because everything there is active: that product has 15 components, several showing Activate or Re-activate (Test1 → Activate; Test Generator → Re-activate/Expired Jul 12 2022; Presentation Plus → Re-activate/Expired Jul 5 2022). So there is plenty to count, yet no line. The RULE governing when the line appears is [ASSUMED] — candidates are product type, component type, or a genuine defect; it cannot be told apart from outside the app. DECISION [user, 2026-08-26]: rule UNKNOWN and not chased for now. This case therefore asserts the summary ONLY on r55multicomponent, where it is verified. ⚠️ DO NOT write an assertion that the line is always present, and do not treat its absence on another product as a defect until the rule is known — that would be a false failure. If the rule is later established, widen this case then.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"40","id":"TST_UMBP_TC_9","title":"Verify the component list renders correctly for products with differing component counts","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Edge","priority":"Low","preconditions":"Library tab open; two umbrella products of different sizes available.","steps":"1. Open \"See materials\" for \"R55 Multi Component Umbrella\" and count the component tiles.\n2. Return to the Library tab (re-select the school — see TST_UMBP_TC_10).\n3. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\" and count the component tiles.\n4. Compare each page's tile count with the components the product actually holds.","testData":"r55multicomponent — 12 components at capture · testumbrellabundle — 15 components at capture","expected":"1. Each product renders exactly as many component tiles as it holds — 12 and 15 respectively at capture.\n2. Neither list is truncated, and there is no \"Load more\" control on this page — all components render at once.\n3. Duplicate component TYPES within one product (e.g. two \"Presentation Plus\" entries on testumbrellabundle) each get their own tile.","actual":"-","status":"Not Automated","remarks":"Counts are data-dependent — assert \"tiles = components the product holds\", not 12 or 15. [ASSUMED] — SINGLE-COMPONENT RENDERING NOT VERIFIED. No product with exactly one component was located at design time: the library holds 970 products and the list does not expose component counts, so finding one means opening products individually. DECISION [user, 2026-08-26]: accepted as a known, LOW-RISK gap — do not spend design time hunting for one. The tester or Phase 1 automator CONFIRMS IT WHEN A SINGLE-COMPONENT PRODUCT IS ENCOUNTERED, and updates this case then. The risk if the assumption is wrong: an app that special-cases \"only one\" (e.g. skipping the list and opening the item directly, or using a different layout) would fail this case — which is exactly what the check would catch.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["umbrellaProduct.test.js","adminSchoolLibrary.json"]},{"sNo":"41","id":"TST_UMBP_TC_10","title":"Verify Back on the product materials view returns the admin to the Library tab","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Negative","priority":"High","preconditions":"Product materials view open, reached from the Library tab of school FCN-CHZ-PDA.","steps":"1. From the Library tab, click \"See materials\" on any product.\n2. Confirm the product materials view has loaded.\n3. Click \"Back\" at the top of the page.\n4. Wait for navigation to settle and read the URL and the page heading.","testData":"Products used to reproduce: sj11042501 · r55multicomponent","expected":"EXPECTED: the admin returns to the Library tab of the same school — /admin/admin/org_perf_testschool_1/library — with the school context intact.\n\nACTUAL (Thor, 2026-08-24) — DEFECT: \"Back\" requests \"/admin/admin//library\" — the org slug is MISSING and the path contains a doubled slash. That route does not resolve, and the app redirects to /admin/admin/dashboard (\"My school accounts\"). The school context is LOST and the admin must re-select the school and re-open the Library tab to continue.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. HIGH IMPACT — it breaks the browse loop: every product an admin inspects costs two extra clicks to get back. Reproduced twice on 2026-08-24, once via a scripted click and once via a real user click, on two different products. AUTOMATION NOTE: a suite that opens a product MUST re-navigate via the school card afterwards; it cannot rely on Back (admin-shared.md §A1 — deep-linking the class route fails without school context).","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","umbrellaProduct.test.js"]},{"sNo":"42","id":"TST_LIBR_TC_33","title":"Verify every sortable Library column orders the product list in both directions","req":"#1 - Verify Sort feature","type":"Positive","priority":"Medium","preconditions":"On the Library tab of a school holding multiple products.","steps":"1. Identify every sort control the Library tab offers and record them. 2. For each control other than Title, apply it and read the resulting order. 3. Apply it a second time and confirm the order reverses.","testData":"A school with enough products to make ordering observable.","expected":"Each sortable column orders the list correctly and reverses on a second click. [ASSUMED] - and the premise itself is unconfirmed.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_LIB_001, which says \"each sortable column header (e.g., Title, Date added)\". All eight of our sort cases (TST_LIBR_TC_2-TC_9) are Title-only. GROUND BEFORE WRITING FURTHER: this document's product reference records only a \"Sort by Title\" control, so \"Date added\" may not exist on this screen at all. On the next live pass, enumerate the actual sort controls - if Title is the only one, close this case as not applicable and feed the correction back to the other team rather than leaving a phantom gap. Read-only.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]}],"allCases":[{"sNo":"1","id":"TST_LIBR_TC_1","title":"Verify the Library tab renders its heading, count, search bar, sort control and School licence section when opened from the left nav","req":"— Library tab load (added, not in source)","type":"Positive","priority":"High","preconditions":"Logged in as school-admin (testt1@mailsac.com) on Thor; school FCN-CHZ-PDA \"3 July Test School 1\" already opened from My school accounts (school context MUST be set by clicking the school card).","steps":"1. From the school page, note the count shown on the left-nav LIBRARY tab.\n2. Click the LIBRARY tab.\n3. Wait for the product list to render.\n4. Observe the page heading, the search bar, the Sort by control and the School licence section.","testData":"School key FCN-CHZ-PDA · left-nav Library count at time of capture: 970","expected":"1. URL becomes /admin/admin/org_perf_testschool_1/library and the browser tab reads \"Library | Cambridge One\".\n2. The h2 heading reads \"Library (N)\" where N EQUALS the count on the left-nav LIBRARY tab.\n3. A search box with placeholder \"Search by title\" and an enabled \"Search\" button are present.\n4. A \"Sort by:\" label with a \"Title\" control is present.\n5. The \"School licence\" section is present above the product list, with the description \"Here are the materials that students can access when added to a class and all teachers can access in their library\".\n6. Every product row shows the product title and a \"See materials\" link.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Count is environment- and time-specific — assert heading count EQUALS left-nav count, never an absolute number (admin-shared.md §A5). List render measured at ~5.1 s for 970 products on Thor 2026-08-24; budget generously.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"2","id":"TST_LIBR_TC_2","title":"Verify the product list is sorted by title in ascending order when the Library tab first loads","req":"#1 — Verify Sort feature","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA with a populated product list.","steps":"1. Open the Library tab.\n2. Read the titles of the first and last products in the list, and capture the full ordered list of titles.","testData":"None — read-only","expected":"1. The list is sorted A→Z by title, compared case-insensitively.\n2. At capture the first three were \"(Do Not Edit) sj11042501\", \"(DO NOT USE) nonmqa_umbrella_do_not_use\", \"3 Level TOC Compass Umbrella\" and the last was \"yaminitestproduct1\".\n3. The \"Sort by: Title\" control is displayed and marked active.","actual":"-","status":"Not Automated","remarks":"Named titles are Thor/FCN-CHZ-PDA specific — the durable assertion is \"list equals itself sorted case-insensitively ascending\", not the literal titles.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"3","id":"TST_LIBR_TC_3","title":"Verify the product list reverses to descending order when the Sort by Title control is clicked once","req":"#1 — Verify Sort feature","type":"Positive","priority":"High","preconditions":"Library tab open, list in its default A→Z order.","steps":"1. Capture the ordered list of product titles.\n2. Click the \"Title\" control next to \"Sort by:\".\n3. Capture the ordered list of titles again.","testData":"None — read-only","expected":"1. The list re-renders in Z→A order — it is the exact reverse of the list captured in step 1.\n2. The product COUNT is unchanged (no products are added or dropped by sorting).\n3. At capture the first three became \"yaminitestproduct1\", \"Y Test Product\", \"vm_automation_testing_108\".","actual":"-","status":"Not Automated","remarks":"Sorting is client-side and immediate — no page reload.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"4","id":"TST_LIBR_TC_4","title":"Verify the product list returns to ascending order when the Sort by Title control is clicked a second time","req":"#1 — Verify Sort feature","type":"Positive","priority":"Medium","preconditions":"Library tab open, list already toggled to Z→A by one click on \"Title\".","steps":"1. Click the \"Title\" control a second time.\n2. Capture the ordered list of titles.","testData":"None — read-only","expected":"1. The list returns to A→Z, identical to the default order seen on load.\n2. The product count is unchanged.","actual":"-","status":"Not Automated","remarks":"Confirms the control is a two-state toggle, not a one-way sort.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"5","id":"TST_LIBR_TC_5","title":"Verify sorting compares titles case-insensitively rather than by character code point","req":"#1 — Verify Sort feature","type":"Edge","priority":"Medium","preconditions":"Library tab open with products whose titles differ only by leading-letter case (e.g. \"Y Test Product\" and \"yaminitestproduct1\", \"Visible prior to activation other comps\" and \"vm_automation_book101\").","steps":"1. Open the Library tab in its default A→Z order.\n2. Locate the titles \"Visible prior to activation other comps\", \"vm_automation_book101\", \"Y Test Product\" and \"yaminitestproduct1\".\n3. Note their relative positions.","testData":"None — read-only","expected":"1. Order is \"Visible prior to activation other comps\" → \"vm_automation_book101\" → … → \"Y Test Product\" → \"yaminitestproduct1\".\n2. Uppercase and lowercase initials are interleaved, proving a CASE-INSENSITIVE comparison. A code-point comparison would place every uppercase title before every lowercase one, and \"Y Test Product\" before \"vm_automation_book101\".","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. IMPORTANT CONTRAST: the Classes tab sorts by CODE POINT (admin-shared.md §A4). The Library tab does NOT. Do not reuse the Classes-tab collation expectation here. Verified live 2026-08-24.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"6","id":"TST_LIBR_TC_6","title":"Verify the chosen sort direction is not retained when the Library tab is reloaded","req":"#1 — Verify Sort feature","type":"Edge","priority":"Medium","preconditions":"Library tab open and toggled to Z→A.","steps":"1. Click \"Title\" to put the list in Z→A order and confirm the first title.\n2. Reload the Library page (F5) and wait for the list to render.\n3. Read the first title again.","testData":"None — read-only","expected":"1. After reload the list is back in the default A→Z order — the descending choice is NOT persisted.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Matches the Classes tab, where sorting also does not persist while filter and search do (admin-shared.md §A4). Verified live 2026-08-24.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"7","id":"TST_LIBR_TC_7","title":"Verify the sort control remains available and reorders the results when a search is active","req":"#1 — Verify Sort feature","type":"Edge","priority":"Medium","preconditions":"Library tab open.","steps":"1. Type \"vm_automation\" into \"Search by title\" and click Search.\n2. Wait for the narrowed result list.\n3. Confirm the \"Sort by: Title\" control is still displayed.\n4. Click \"Title\" and capture the result order.","testData":"Search term: vm_automation (22 results at capture)","expected":"1. The sort control is still displayed while search results are shown.\n2. Clicking it reverses the order of the SEARCH RESULTS only.\n3. The result count is unchanged by sorting, and the \"Showing search results for vm_automation.\" banner remains.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Result count is data-dependent — assert that the count is unchanged by sorting, not 22. NOTE: sorting reorders the whole result set alphabetically, which overrides the relevance ranking of TST_LIBR_TC_21. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"8","id":"TST_LIBR_TC_8","title":"Verify the sort control is not rendered when a search returns no results","req":"#1 — Verify Sort feature","type":"Edge","priority":"Low","preconditions":"Library tab open.","steps":"1. Search for a term that matches no product (e.g. zzqqxx9999).\n2. Inspect the area where \"Sort by: Title\" normally appears.","testData":"Search term: zzqqxx9999","expected":"1. The no-results message is shown.\n2. The \"Sort by:\" label and \"Title\" control are NOT present in the page — there is nothing to sort.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Genuinely removed from the DOM in this state (verified 2026-08-24), so a presence check is truthful here — unlike most admin dialogs (admin-shared.md §B2).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"9","id":"TST_LIBR_TC_9","title":"Verify the sort control indicates the current sort direction to the user","req":"#1 — Verify Sort feature","type":"Negative","priority":"Medium","preconditions":"Library tab open in the default A→Z order.","steps":"1. Observe the \"Sort by: Title\" control and record its label, any icon, and its styling.\n2. Click \"Title\" to switch to Z→A.\n3. Observe the control again and compare.","testData":"None — read-only","expected":"EXPECTED: the control communicates the active direction — e.g. an ascending/descending arrow, a changed label, or an aria-sort value — so a user can tell A→Z from Z→A without reading the list.\n\nACTUAL (Thor, re-verified 2026-08-26): the control is byte-for-byte IDENTICAL in both states. Captured before and after a single click:\n  <a qid=\"aLibrary-3\" href=\"javascript:void(0);\" class=\"list-info ml-2 sort-by-title-btn active\">Title</a>\n  · label \"Title\" unchanged · class unchanged (note \"active\" is present in BOTH states — it means \"this is the sort in use\", not a direction) · ZERO child elements, so there is no icon to rotate · aria-sort, aria-label and title all ABSENT.\nThe list itself did flip (first item \"(Do Not Edit) sj11042501\" → \"yaminitestproduct1\"), so sorting works — only the indicator is missing.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. STATUS: acknowledged as a VALID concern by the user 2026-08-26 — RECORDED AS A REMARK FOR NOW, deliberately NOT raised as a defect ticket yet. Revisit before the batch is signed off. Two separable halves: (a) the missing visual arrow may be a deliberate design choice; (b) the missing aria-sort is an ACCESSIBILITY gap — a screen-reader user has no way at all to learn the sort direction — and stands on its own regardless of (a). Evidence re-captured live 2026-08-26 by comparing the full outerHTML before and after a click; they are identical. AUTOMATION NOTE: assert list ORDER, never the control's class or text — the control genuinely cannot distinguish the two states.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"10","id":"TST_LIBR_TC_10","title":"Verify the searched product is returned as the first result when its full exact title is searched","req":"#4 — Verify search by title","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA; the automation-owned product vm_automation_book101 present in the library.","steps":"1. Type the full title \"vm_automation_book101\" into \"Search by title\".\n2. Click Search.\n3. Wait for the list to settle and read the results in order.","testData":"Search term: vm_automation_book101 (10 results at capture, 2026-08-26)","expected":"1. \"vm_automation_book101\" is returned as the FIRST result.\n2. The heading changes to \"Library\" followed by \"Showing search results for vm_automation_book101.\" and a \"Clear\" link.\n3. Further close-match products are listed after it — an exact-title search still returns a fuzzy tail (see TST_LIBR_TC_21). Do NOT expect exactly one result.\n4. Every result row still shows its title and a \"See materials\" link.","actual":"-","status":"Not Automated","remarks":"Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26] Assert RANK 1, not the result count — the tail length is data-dependent (10 at capture). Search settles ~1.0 s.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"11","id":"TST_LIBR_TC_11","title":"Verify all products whose title contains the term are returned first when a partial title is searched","req":"#4 — Verify search by title","type":"Positive","priority":"High","preconditions":"Library tab open with a populated list containing the automation-owned products vm_automation_book101 and vm_automation_testing_108.","steps":"1. Note the total product count in the heading.\n2. Type the partial term \"vm_automation\" into \"Search by title\".\n3. Click Search.\n4. Read the returned titles IN ORDER.","testData":"Search term: vm_automation (22 results at capture; 2 contain the term)","expected":"1. The list narrows — fewer products than the unfiltered total.\n2. BOTH products whose title contains \"vm_automation\" are returned: \"vm_automation_book101\" and \"vm_automation_testing_108\".\n3. They occupy the FIRST positions in the result list — every substring match ranks above every non-substring match.\n4. The banner reads \"Showing search results for vm_automation.\" with a \"Clear\" link.","actual":"-","status":"Not Automated","remarks":"Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26] The durable assertion is: all substring matches are present AND occupy the leading positions. Verified live 2026-08-26 across three terms. Do not assert the total count — the fuzzy tail is data-dependent.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"12","id":"TST_LIBR_TC_12","title":"Verify search results are the same regardless of the case of the search term","req":"#4 — Verify search by title","type":"Positive","priority":"Medium","preconditions":"Library tab open.","steps":"1. Search for \"vm_automation\" (lower case) and capture the returned titles in order.\n2. Clear the search.\n3. Search for \"VM_AUTOMATION\" (upper case) and capture the returned titles in order.\n4. Compare the two result sets.","testData":"Search terms: vm_automation · VM_AUTOMATION (22 results each at capture)","expected":"1. Both searches return the SAME products in the SAME order — matching is case-insensitive.\n2. The banner echoes the term exactly as typed, preserving the case the user entered.","actual":"-","status":"Not Automated","remarks":"Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26] Verified live 2026-08-26 — both terms returned an identical 22-title list.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"13","id":"TST_LIBR_TC_13","title":"Verify the full product list is restored when Clear is clicked on an active search","req":"#4 — Verify search by title","type":"Positive","priority":"High","preconditions":"Library tab open with an active search showing narrowed results.","steps":"1. Note the unfiltered heading count, e.g. \"Library (970)\".\n2. Search for \"vm_automation\".\n3. Click the \"Clear\" link in the heading.\n4. Wait for the list to settle.","testData":"Search term: vm_automation","expected":"1. The full product list is restored — the count returns to the pre-search total.\n2. The heading returns to \"Library (N)\"; the \"Showing search results for …\" banner and the \"Clear\" link are gone.\n3. The \"Search by title\" box is emptied.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. AUTOMATION NOTE: the Clear link carries qid \"aClass-99\" — a Classes-tab qid reused on the Library tab. It is NOT a Library qid; do not assume the aLibrary-* family covers it.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"14","id":"TST_LIBR_TC_14","title":"Verify the list is not filtered until the Search button is clicked","req":"#4 — Verify search by title","type":"Edge","priority":"High","preconditions":"Library tab open with the full product list shown.","steps":"1. Note the number of products shown.\n2. Type \"vm_automation\" into \"Search by title\" but do NOT click Search.\n3. Wait ~3 seconds and count the products again.\n4. Now click Search and count again.","testData":"Search term: vm_automation","expected":"1. After typing only, the list is UNCHANGED — the full product list is still shown and no search banner appears.\n2. Only after Search is clicked does the list narrow and the banner appear.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Search is submit-driven, not live — the same as the Classes tab (admin-shared.md §A4). Verified live 2026-08-24 (970 rows still present after typing).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"15","id":"TST_LIBR_TC_15","title":"Verify the full product list is restored when Search is clicked with an empty search box","req":"#4 — Verify search by title","type":"Edge","priority":"Medium","preconditions":"Library tab open with an active search narrowing the list.","steps":"1. Search for \"vm_automation\" so the list is narrowed.\n2. Delete all text from the \"Search by title\" box.\n3. Click Search.","testData":"Search term: (empty)","expected":"1. The full product list is restored and the heading returns to \"Library (N)\".\n2. NO \"Showing search results for\" banner is displayed — an empty term is treated as \"no search\", not as a search for an empty string.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 — 970 rows restored, banner absent.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"16","id":"TST_LIBR_TC_16","title":"Verify an active search term is not retained when the Library tab is reloaded","req":"#4 — Verify search by title","type":"Edge","priority":"Medium","preconditions":"Library tab open with an active search.","steps":"1. Search for \"vm_automation\" and confirm the list is narrowed.\n2. Reload the Library page (F5).\n3. Wait for the list to render and inspect the heading and the search box.","testData":"Search term: vm_automation","expected":"1. After reload the FULL product list is shown, the heading reads \"Library (N)\", the search box is empty and no banner is present — the search term is NOT persisted.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. IMPORTANT CONTRAST: the Classes tab search DOES persist server-side across reload and login (admin-shared.md §A4). The Library tab does NOT. Verified live 2026-08-24.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"17","id":"TST_LIBR_TC_17","title":"Verify the School licence section is not filtered when a search is applied to the product list","req":"#4 — Verify search by title","type":"Edge","priority":"Medium","preconditions":"Library tab open on a school that holds at least one school licence.","steps":"1. Note the number of tiles in the \"School licence\" section.\n2. Search for a term that matches none of the licensed product titles (e.g. \"vm_automation\").\n3. Inspect the \"School licence\" section again.","testData":"Search term: vm_automation","expected":"1. The product list below narrows to the search results.\n2. The \"School licence\" section is UNCHANGED — the same tiles, in the same order, with the same heading and description. Search applies only to the product list.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 (all 3 licence tiles remained while the list narrowed) and re-confirmed with vm_automation 2026-08-26. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"18","id":"TST_LIBR_TC_18","title":"Verify the number of matching products is shown to the user while a search is active","req":"#4 — Verify search by title","type":"Edge","priority":"Low","preconditions":"Library tab open.","steps":"1. Note that the unfiltered heading shows a count, e.g. \"Library (970)\".\n2. Search for \"vm_automation\".\n3. Read the heading.","testData":"Search term: vm_automation (22 results at capture)","expected":"EXPECTED: the heading reports how many products matched, e.g. \"Library (22)\".\n\nACTUAL (Thor, 2026-08-26): the \"(N)\" count is REMOVED as soon as a search is active. The heading reads \"Library\" followed only by \"Showing search results for vm_automation.\" and \"Clear\". The user cannot tell how many products matched without counting the rows.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. STATUS: acknowledged as a valid gap by the user 2026-08-26 — RECORDED AS A REMARK FOR NOW, deliberately NOT raised as a defect ticket. Revisit before sign-off alongside TST_LIBR_TC_9. Weaker than TC_9: there is no accessibility dimension here, it is purely a convenience gap — the results are on screen, only the tally is missing. AUTOMATION NOTE: do NOT assert a heading count while a search is active — there is none. Assert the banner text (\"Showing search results for <term>.\") instead, and count the rendered rows if a number is needed.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"19","id":"TST_LIBR_TC_19","title":"Verify a multi-word search term broadens the results by matching either word","req":"#4 — Verify search by title","type":"Edge","priority":"Medium","preconditions":"Library tab open.","steps":"1. Search for the single term \"vm_automation\" and note the number of results.\n2. Clear the search.\n3. Search for the two-word term \"vm_automation testing\" and note the number of results.\n4. Inspect the order of the titles returned by the two-word search.","testData":"Search terms: vm_automation (22 at capture) · \"vm_automation testing\" (29 at capture)","expected":"1. The two-word search returns MORE results than the single term, not fewer — the words are combined as OR, not as an exact phrase.\n2. Results include products matching only the second word (e.g. \"migration_testing_qa01\"), which the single-term search did not return.\n3. The closest match still ranks first — \"vm_automation_testing_108\" is result 1.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. CONFIRMED INTENDED BEHAVIOUR by the product team [2026-08-26] — this is not a defect. Documented here so nobody re-raises it, and so no automation asserts that adding a word narrows the search. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"20","id":"TST_LIBR_TC_20","title":"Verify the no-results message is shown and echoes the term when a search matches no product","req":"#4 — Verify search by title","type":"Negative","priority":"High","preconditions":"Library tab open with a populated list.","steps":"1. Type a term that cannot match any product, e.g. \"zzqqxx9999\".\n2. Click Search.\n3. Read the heading and the message shown in place of the product list.","testData":"Search term: zzqqxx9999","expected":"1. No product rows are rendered.\n2. The message reads VERBATIM: \"This school has no learning materials that match your search zzqqxx9999. Please check the spelling or try a different search term\" — the searched term is echoed back.\n3. The heading reads \"Library\" + \"Showing search results for zzqqxx9999.\" + \"Clear\".\n4. The \"School licence\" section is still displayed (see TST_LIBR_TC_17).","actual":"-","status":"Not Automated","remarks":"Copy captured live 2026-08-24 — assert it verbatim, comparing through a whitespace squash on both sides (admin-shared.md §A6). Note the message has no closing full stop.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"21","id":"TST_LIBR_TC_21","title":"Verify close-match products are returned after the exact title matches when searching by title","req":"#4 — Verify search by title","type":"Edge","priority":"Medium","preconditions":"Library tab open with a populated list containing the automation-owned vm_automation_* products.","steps":"1. Search for \"vm_automation\".\n2. Read every returned title IN ORDER.\n3. Identify which titles contain the term and which do not.\n4. Check where the boundary between the two falls.","testData":"Search term: vm_automation (22 results at capture — 2 contain the term, 20 are close matches)","expected":"1. The results contain BOTH exact substring matches and close matches whose titles do NOT contain the term — e.g. \"automation thor product(Do not touch)\", \"cqaautomationbundle1\", \"Bulk Activation - Test Umbrella 1\", \"Visible prior to activation other comps\".\n2. Every substring match ranks ABOVE every close match — the leading results are the true title matches, and the close matches follow.\n3. The search never returns zero results while a substring match exists.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. CONFIRMED INTENDED BEHAVIOUR by the product team [2026-08-26] — the search is deliberately fuzzy, so a rough or mistyped term still finds something. Originally written as a defect; RECLASSIFIED from Negative to Edge. AUTOMATION: never assert that every result contains the term — that fails against the live product. Assert the RANKING instead (substring matches first), which held across every term tried on 2026-08-26. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"22","id":"TST_LIBR_TC_22","title":"Verify a whitespace-only search term is treated as an empty search rather than as a searchable term","req":"#4 — Verify search by title","type":"Negative","priority":"Low","preconditions":"Library tab open with the full list shown.","steps":"1. Type three spaces into \"Search by title\".\n2. Click Search.\n3. Read the heading and the result list.","testData":"Search term: \"   \" (three spaces)","expected":"EXPECTED: the term is trimmed and treated as empty, so the full product list is retained (consistent with TST_LIBR_TC_15).\n\nACTUAL (Thor, 2026-08-24) — DEFECT: the term is NOT trimmed. Zero products are returned and the banner renders the raw spaces — \"Showing search results for   .\" — leaving a visible gap before the full stop and giving the user no readable indication of what was searched.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Low user impact but a clear input-handling gap. The same trimming question applies to leading/trailing spaces around a real term — not yet tested, worth adding once the trimming behaviour is decided.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"23","id":"TST_LIBR_TC_23","title":"Verify the School licence section lists one tile per school licence held by the school","req":"#3 — Verify School licence appear in school licence section","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA, which holds 3 school licences at capture.","steps":"1. Open the Library tab.\n2. Locate the \"School licence\" section above the product list.\n3. Read its heading, description and the tiles it contains.","testData":"School key FCN-CHZ-PDA · 3 licences at capture: \"R55 Multi Component Umbrella\", \"presentation_plus_test_umb_product_2_june_1\", \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\"","expected":"1. The section heading reads VERBATIM \"School licence\".\n2. The description reads VERBATIM \"Here are the materials that students can access when added to a class and all teachers can access in their library\".\n3. One tile is rendered per school licence, each showing the licensed product's title.\n4. The section appears ABOVE the product list, between the search bar and the \"Sort by:\" control.","actual":"-","status":"Not Automated","remarks":"Licence set is environment- and time-specific. Prefer asserting \"tile count equals the number of licences returned by the page\" plus the verbatim heading/description, rather than the three product names.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","a d sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. The icon carries alt=\"\" so its meaning is not exposed to screen-reader users — an accessibility observation worth raising separately. Verified live 2026-08-24.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"27","id":"TST_LIBR_TC_27","title":"Verify products held under a school licence also appear in the main Library product list","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Medium","preconditions":"Library tab open with the School licence section populated.","steps":"1. Record the title of each School licence tile.\n2. For each recorded title, search for it (or scan the full list) in the product list below.","testData":"3 licence titles at capture","expected":"1. EVERY school-licence product title is ALSO present as a row in the main product list.\n2. The School licence section is an additional highlight of those products, not a separate inventory — so the products are not double-counted or omitted from \"Library (N)\".","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 — all 3 licence titles found among the 970 list rows. ⚠️ IMPORTANT CONTEXT ADDED 2026-08-26: the main product list is CATALOGUE-WIDE, not licence-driven. Perf Test School 4 · key ACJ-DXL-JKR · org slug org_perf_testschool_4 holds ZERO licences and still lists the SAME 970 products as FCN-CHZ-PDA, which holds 3 (see TST_LIBR_TC_30). So a licensed product appearing in the list proves nothing about licensing — the list would contain it either way. Do not read this case as evidence that the list is derived from licences.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"28","id":"TST_LIBR_TC_28","title":"Verify a placeholder is rendered on a School licence tile when the product has no cover image","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Low","preconditions":"Library tab open on a school holding a licence for a product with no cover image (at capture: \"R55 Multi Component Umbrella\").","steps":"1. Locate the School licence tile for \"R55 Multi Component Umbrella\".\n2. Compare its image area with a tile whose product does have a cover image.","testData":"No-image licence at capture: R55 Multi Component Umbrella","expected":"1. The tile renders an empty placeholder block (element with class \"no-image-container\") in place of the cover image.\n2. No broken-image icon and no alt-text fallback string is shown.\n3. The tile's title and date line stay correctly aligned — the layout does not collapse.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. The same placeholder is used on rows in the main product list. Verified in the DOM live 2026-08-24; the visual alignment claim is [ASSUMED] — confirm by eye or by a visual snapshot during automation.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"29","id":"TST_LIBR_TC_29","title":"Verify a very long product title wraps inside its School licence tile without overflowing","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Low","preconditions":"Library tab open on a school holding a licence for a product with a long, unbroken title (at capture: \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\", 55 characters).","steps":"1. Locate the School licence tile for the long-titled product.\n2. At desktop width (~1046 px viewport), observe how the title renders inside the tile.\n3. Narrow the browser to ~400 px and observe it again.\n4. Check whether the title stays inside its tile, and whether the page gains a horizontal scrollbar.","testData":"Long title: testumbrellabundlevery_longname_tocheck_wrapping_oftext (55 chars)","expected":"1. The title WRAPS onto multiple lines inside the tile — measured 3 lines at ~1046 px and 2 lines at 400 px (line height 24 px).\n2. The title never overflows its tile: at both widths the title's right edge stays inside the tile's right edge, and the text does not overflow its own box (scrollWidth == clientWidth).\n3. The title container carries class \"card-title word-wrap\" with computed word-break: break-word, which is what produces the wrapping.\n4. The date line stays below the title and remains readable.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. VERIFIED LIVE 2026-08-26 (previously [ASSUMED] — the word-wrap class had been read from the DOM but the rendering was never measured). Measurements: desktop viewport 1046 px → tile 327 px, title 229 px, 3 lines; narrow viewport 400 px → tile 351 px, title 261 px, 2 lines; overflowsTileRight false and textOverflowsOwnBox false at BOTH widths. ⚠️ SCOPE: this case covers the SCHOOL LICENCE TILE only. The main product-list rows behave DIFFERENTLY and do overflow at narrow widths — see TST_LIBR_TC_31. Do not generalise this result to the list. ⚠️ TITLE CHURN: this product was RENAMED on the shared school between 2026-08-24 and 2026-08-26 (was \"testumbrellabundleverylongnametocheckwrappingoftext\", now \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\"). Treat the literal title as <LONG_TITLE_PRODUCT> and re-read it at run time rather than hard-coding it.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"30","id":"TST_LIBR_TC_30","title":"Verify the School licence section is not rendered at all when the school holds no school licence","req":"#3 — Verify School licence appear in school licence section","type":"Negative","priority":"Medium","preconditions":"Logged in as school-admin on Thor; a school that holds ZERO school licences — use Perf Test School 4 · key ACJ-DXL-JKR · org slug org_perf_testschool_4.","steps":"1. From My school accounts, open the school BY KEY ACJ-DXL-JKR (\"Perf Test School 4\").\n2. Click the LIBRARY tab and wait for the product list to render.\n3. Look at the area between the search bar and the \"Sort by:\" control, where the School licence section sits on a licensed school.\n4. Search the page for the text \"School licence\".\n5. Confirm the rest of the tab still works — heading count, search box, sort control, product rows.","testData":"School key ACJ-DXL-JKR (\"Perf Test School 4\", org_perf_testschool_4) — 0 school licences, 970 products at capture","expected":"1. The School licence section is ABSENT ENTIRELY — no container, no tiles, and NO empty-state message replaces it. The product list begins immediately after the \"Sort by: Title\" control.\n2. The text \"School licence\" does not appear anywhere on the page, nor does the description \"Here are the materials that students can access…\".\n3. The rest of the tab is unaffected: the heading still reads \"Library (N)\", the search box, the Search button, the \"Sort by: Title\" control and the product rows all render normally.\n4. The product list is NOT empty — the school still lists the full catalogue (970 products at capture), the same count as a school WITH licences. Holding no licence does not reduce the Library list.","actual":"-","status":"Not Automated","remarks":" _nov_1","expected":"EXPECTED: long titles in the product list wrap within the available width — the same behaviour the School licence tile already shows (TST_LIBR_TC_29) — and the page never scrolls horizontally.\n\nACTUAL (Thor, 2026-08-26) — DEFECT: the list rows do NOT wrap and push past the page edge. At a 385 px document width the page scrollWidth was 607 px, and 22 elements extended beyond the right edge. The row title \"blue_umb_auto_update_test_15_feb_1_updated_1\" measured 334 px wide with its right edge at 414 px, against a 385 px document. The whole page therefore scrolls sideways.\n\nROOT CAUSE (from computed styles): the School licence tile's title sits in \"card-title word-wrap\" with word-break: break-word, so it wraps. The list row's title (span.item-text) has word-break: normal and only overflow-wrap: break-word, which does NOT break a long unbroken token in this layout. The two are styled inconsistently.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. FOUND 2026-08-26 while verifying TST_LIBR_TC_29 — the licence tile wraps correctly, which is what made the list's behaviour stand out. NOT in the source scenario list; added because it is a real rendering defect on the screen under test. Appended as TC_31 rather than inserted, so no existing ID was renumbered (admin-shared.md / manual-test-standard ordering rule). Grouped under scenario #3 because it was found through the School licence comparison; move it if a responsive-layout requirement is added later. Affects narrow desktop windows and mobile widths. Good VISUAL-REGRESSION candidate. Side-effect free.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"32","id":"TST_UMBP_TC_1","title":"Verify the product materials view op nt tiles under \"Learning materials\".\n3. Record the component TYPE label and component NAME shown on each tile.","testData":"Product testumbrellabundle — 15 components at capture","expected":"1. One tile is rendered per component of the umbrella — 15 at capture.\n2. Distinct component TYPES are all represented, covering at capture: Test1, Practice Extra (ankur), Project Work updated, Student Resource Bank, Test Generator, Presentation Plus, Downloadable Asset, Resource Bank (Teacher), External Resources, Unit Progress Test, ebook components (\"cqa teacher only book\", \"Student and teacher both paid ebook\", \"Student paid and teacher free ebook\") and Practice Extra.\n3. No component type is silently omitted from the view.","actual":"-","status":"Not Automated","remarks":"AUTOMATION TRAP: every component container shares the SAME qid \"t-prd-cmp-cntr-1\" — the qid is NOT unique per tile and cannot address an individual component. Select structurally by index or by the component's text. Verified live 2026-08-24 (12 identical qids on the R55 product, 15 on this one).","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["umbrellaProduct.test.js","adminSchoolLibrary.json"]},{"sNo":"34","id":"TST_UMBP_TC_3","title":"Verify each component tile shows its component type and its component name","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Positive","priority":"High","preconditions":"Product materials view open for a multi-component umbrella product.","steps":"1. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. For each component tile, read the first line and the second line.","testData":"Product testumbrellabundle","expected":"1. The first line of each tile is the component TYPE, e.g. \"Practice Extra (ankur)\", \"Student Resource Bank\", \"Test Generator\", \"Presentation Plus\", \"Downloadable Asset\".\n2. The second line is the component's own NAME where it has ens when Add to a class is clicked","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Positive","priority":"Medium","preconditions":"Product materials view open for an umbrella product, on a school that has classes.","steps":"1. Open \"See materials\" for \"R55 Multi Component Umbrella\".\n2. Click \"Add to a class\".\n3. Read the dialog heading, its input and its buttons. DO NOT complete the action.\n4. Close the dialog without adding.","testData":"Product: r55multicomponent · school FCN-CHZ-PDA","expected":"1. A dialog (id \"addMaterialToClassModal\") opens.\n2. Its heading reads \"Choose a class to add <product title>\" — e.g. \"Choose a class to add R55 Multi Component Umbrella\".\n3. It contains a text input with placeholder \"Search classes\" and a list of the school's classes.\n4. The \"Add to Class\" button is DISABLED until a class is selected.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. SIDE-EFFECT FREE ONLY IF the action is not completed — adding material to a class mutates the shared school, so this case stops at the dialog. TWO OBSERVATIONS: (a) each class row renders as \"[<class name>] [<class key>]\" with LITERAL square brackets in the text, e.g. \"[mn] [acPZ-EQTo]\" (raw markup: <button class=\"dropdown-item work-break class-list\">[mn] [acPZ-EQTo]</button>). CONFIRMED AS-DESIGNED [user, 2026-08-26] — this is the intended display format, NOT leftover template markup. Recorded for reference so it is not re-flagged as a defect; expected results may assert it verbatim; (b) only 5 classes were VISIBLE although the school shows 106, while 2330 class options sit pre-rendered and hidden behind the dialog — so it is NOT that only 5 exist. [ASSUMED] the visible list is
