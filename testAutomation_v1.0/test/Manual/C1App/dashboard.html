<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambridge One · QA Test Automation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
      --bg-main: #0B132B;
      --bg-card: #1C2541;
      --bg-card-hover: #232F55;
      --bg-subtle: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --c1-blue: #0284C7;
      --c1-blue-glow: rgba(2, 132, 199, 0.25);
      
      --color-pass: #10B981;
      --color-pass-bg: rgba(16, 185, 129, 0.12);
      --color-blocked: #F59E0B;
      --color-blocked-bg: rgba(245, 158, 11, 0.12);
      --color-notauto: #64748B;
      --color-notauto-bg: rgba(100, 116, 139, 0.15);
      --color-fail: #EF4444;
      --color-fail-bg: rgba(239, 68, 68, 0.15);

      --color-p1: #EF4444;
      --color-p2: #F59E0B;
      --color-p3: #3B82F6;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 20px rgba(2, 132, 199, 0.15);
    }

    .light-theme {
      --bg-main: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F8FAFC;
      --bg-subtle: #F8FAFC;
      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-dim: #94A3B8;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-glow: 0 0 15px rgba(2, 132, 199, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s, color 0.2s;
    }

    .app-container {
      max-width: 1540px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    header.dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-badge {
      background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
      color: white;
      font-weight: 800;
      font-size: 18px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-glow);
      letter-spacing: -0.5px;
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--c1-blue);
    }

    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: thin;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: var(--radius-lg);
      font-size: 13.5px;
      font-weight: 600;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: #38BDF8;
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: var(--shadow-glow);
    }
    .tab-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }
    .tab-btn.active .tab-badge {
      background: rgba(56, 189, 248, 0.2);
      color: #38BDF8;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent-color, var(--c1-blue));
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -1px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .kpi-sub {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-card);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      text-align: left;
    }
    table.data-table th {
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
    }
    table.data-table tr:last-child td {
      border-bottom: none;
    }
    table.data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
    }
    .badge-pass { background: var(--color-pass-bg); color: var(--color-pass); }
    .badge-blocked { background: var(--color-blocked-bg); color: var(--color-blocked); }
    .badge-notauto { background: var(--color-notauto-bg); color: #94A3B8; }
    .badge-fail { background: var(--color-fail-bg); color: var(--color-fail); }

    .badge-p1 { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
    .badge-p2 { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
    .badge-p3 { background: rgba(59, 130, 246, 0.15); color: #60A5FA; }

    .badge-pos { background: rgba(16, 185, 129, 0.1); color: #10B981; }
    .badge-edge { background: rgba(245, 158, 11, 0.1); color: #F59E0B; }
    .badge-neg { background: rgba(239, 68, 68, 0.1); color: #F87171; }

    .tc-code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      min-width: 260px;
      padding: 9px 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--c1-blue);
    }
    .filter-select {
      padding: 9px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      display: flex;
    }
    .progress-segment {
      height: 100%;
    }

    details.tc-details {
      cursor: pointer;
      margin-top: 6px;
    }
    details.tc-details summary {
      color: #38BDF8;
      font-size: 12px;
      font-weight: 500;
      outline: none;
    }
    .tc-detail-body {
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media print {
      body { background: white; color: black; }
      .tabs-wrapper, .filter-bar, .header-actions { display: none; }
      .card { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>

  <script>
    const DASHBOARD_DATA = {"title":"Cambridge One · QA Test Automation Dashboard","generatedAt":"Tuesday, 15 September 2026 at 12:23:35","global":{"total":343,"pass":146,"blocked":18,"notAutomated":179,"fail":0,"automatedCode":183,"passPct":"42.6","autoPct":"53.4"},"modules":[{"folder":"AdminApp-Classes","id":"adminapp-classes","name":"Classes Tab","badge":"CLST / BCCF / GSCL","file":"AdminApp_Classes_tab_test_cases.xlsx","total":92,"pass":64,"blocked":3,"notAutomated":25,"fail":0,"automatedCode":69,"typeDist":{"positive":{"count":68,"pass":48,"blocked":1,"notAuto":19},"edge":{"count":14,"pass":9,"blocked":2,"notAuto":3},"negative":{"count":10,"pass":7,"blocked":0,"notAuto":3}},"prioDist":{"high":25,"medium":52,"low":15},"blockedCases":[{"sNo":"26","id":"TST_GCAT_TC_4","title":"Verify the maximum-grading-categories limit is enforced","req":"#5 — Verify create grading category","type":"Edge","priority":"Medium","preconditions":"School already at the maximum number of grading categories.","steps":"1. Attempt to create another grading category.","testData":"-","expected":"Modal: You have reached the maximum number of grading categories for your school. Please remove at least one category to add a new one; no category created. [ASSUMED] exact max count.","actual":"- (not executed)","status":"Blocked","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. NOT AUTOMATED - BLOCKED. Deliberately absent from the test file, the TC repository and the execution file (not merely skipped), so it cannot run by accident.","comments":"BLOCKED (2026-08-18). The precondition is 'school is already at its maximum', so the test must first FILL the school with grading categories. Three problems: (1) the maximum is unknown, so the only way to find it is to keep creating until the app refuse title":"Verify a Class status and Class label filter applied together return only classes matching both","req":"#2 - Verify filter functionality is working fine","type":"Positive","priority":"Medium","preconditions":"On the Classes tab. At least one Active class carries a known label, and at least one class carrying that same label is not Active.","steps":"1. Open Filter. 2. Select Class status Active. 3. In Class labels, type the label into \"Find a label\" and select it. 4. Click Apply. 5. Expand each returned row and read its label and status.","testData":"Status: Active + Label: <LABEL_ON_AN_ACTIVE_CLASS> - must be a label confirmed to sit on at least one Active class.","expected":"Only classes that are both Active and carry the selected label are listed. Every returned row satisfies both conditions, and classes carrying the label but not Active are absent. The Active classes (n) heading updates to the filtered total and the page-level Clear link appears. [ASSUMED] - not yet run against a populated combination.","actual":"-","status":"Blocked","remarks":"Positive counterpart to TST_CLST_TC_22, which pairs a status and a label that match zero classes. TC_22 cannot distinguish AND from OR: if the filters were ORed, a zero-match pair would still return zero and TC_22 would still pass. This case is the only one that proves the AND. Added 2026-09-01 from the other team's TC_CLS_002, whose expected result states \"Combined filters apply as an AND condition\".","comments":"Blocked at design time (skill rule 4). TST_CLST_TC_4's Actual Result records that label VM1 matches no ACTIVE class on 3 July Test School 1. Unblock by applying an existing label to a known Active class on the target school, or by identifying a label/Active-class pair live; then ground the expected result and clear the [ASSUMED].","rawStatus":"Blocked","isImplemented":false,"implFiles":[]}],"notAutomatedCases":[{"sNo":"60","id":"TST_CMGT_TC_1","title":"Verify an existing label can be added to a class","req":"#21 — Add label in class","type":"Positive","priority":"Medium","preconditions":"A class is open (Classes tab -> launch a class -> /view/classdata).","steps":"1. Click + Add labels. 2. Select an existing label.","testData":"Label: VM1","expected":"The selected label is applied to the class and shown on it.","actual":"-","status":"Not Automated","remarks":"Same label list as bulk-create form (TST_BCCF_TC_5).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"61","id":"TST_CMGT_TC_2","title":"Verify a new label can be created and applied to a class","req":"#21 — Add label in class","type":"Positive","priority":"Low","preconditions":"A class is open.","steps":"1. Click + Add labels. 2. Click + Create new label. 3. Enter a label name and save.","testData":"New label: AutoTest Label","expected":"New label is created, applied to the class, and becomes available for other classes. [ASSUMED] confirm create-label form.","actual":"-","status":"Not Automated","remarks":"-","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"62","id":"TST_CMGT_TC_3","title":"Verify soft-deleting a single active class","req":"#23 — Verify delete classes (soft / hard / bulk up to 50)","type":"Positive","priority":"High","preconditions":"On the Classes tab with >=1 active class.","steps":"1. Select a class row checkbox. 2. Click Delete class. 3. Click Yes, delete 1 class.","testData":"An active class","expected":"WARNING confirmation shown (1 selected class has not ended. There might be students, teachers and course materials... Are you sure you want to delete?). After Yes, class removed from Active and moved to deleted/Ended section (soft delete). Note: This will take a few minutes. Deleted classes may show on dashboards for a few minutes before they are removed.","actual":"-","status":"Not Automated","remarks":"Soft delete is restorable.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"63" h many classes.","steps":"1. Select up to 50 classes. 2. Click Delete class and confirm.","testData":"50 classes","expected":"Up to 50 classes can be selected and deleted in one action. [ASSUMED] confirm the 50-class maximum.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Scenario title references 50 classes.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"66","id":"TST_CMGT_TC_7","title":"Verify deleting a class can be cancelled","req":"#23 — Verify delete classes (soft / hard / bulk up to 50)","type":"Edge","priority":"Low","preconditions":"On the Classes tab with >=1 class selected.","steps":"1. Click Delete class. 2. Click No, cancel.","testData":"-","expected":"Confirmation closes; class is not deleted.","actual":"-","status":"Not Automated","remarks":"-","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"67","id":"TST_CMGT_TC_8","title":"Verify a class cannot be permanently deleted when conditions are not met","req":"#23 — Verify delete classes (soft / hard / bulk up to 50)","type":"Negative","priority":"Medium","preconditions":"A class that still has students / another teacher / groups / assignments / grading scales / grading categories / locking rules.","steps":"1. Attempt to permanently delete it.","testData":"A class violating >=1 of the 7 conditions","expected":"Permanent deletion is blocked/unavailable until all 7 conditions are satisfied. [ASSUMED] capture the exact blocking behaviour/message.","actual":"-","status":"Not Automated","remarks":"-","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"68","id":"TST_CMGT_TC_9","title":"Verify the active-class count increases after adding a new class","req":"#30 — Veri elect the populated source. 2. Select all available components. 3. Continue and create.","testData":"A fully-populated source class [ASSUMED]","expected":"The cloned class contains the source's teacher, materials, assignments, locked content rules (incl. the assignment-created rule), and class grade settings. [ASSUMED] verify each component copies (tested sources had 0 of each).","actual":"-","status":"Not Automated","remarks":"Requires a seeded source class.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"77","id":"TST_CLON_TC_3","title":"Verify components with no items are not selectable when copying","req":"#31 — Verify class clone functionality (Copy an Existing Class)","type":"Edge","priority":"Medium","preconditions":"A source class that has 0 of one or more components.","steps":"1. Copy an Existing Class -> select a source with empty components -> Continue.","testData":"Source: SarthakTestClass1 (0 teachers/materials/assignments/rules)","expected":"Components with a count of 0 are disabled/unselectable (e.g. Teachers [0] disabled; Class grade settings - Not available).","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Observed live.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"78","id":"TST_CTXC_TC_1","title":"Verify a context class can be created","req":"#32 — Verify Context class creation and view in teacher/admin/student login","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin. [ASSUMED] context-class creation path TBD.","steps":"1. Create a context class via the (to-be-confirmed) context-class creation flow.","testData":"Context class details [ASSUMED]","expected":"The context class is created successfully. [ASSUMED] confirm the creation entry point and any context-specific fields.","actual":"-","status":"Not Automated","remarks":"Entry point not found in the admin bulk-create form; needs product clarification.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"79","id":"TST_CTXC_TC_2","title":"Verify the context class appears in the admin login","req":"#32 — Verify Context class creation and view in teacher/admin/student login","type":"Positive","priority":"Medium","preconditions":"A context class exists; logged in as school admin.","steps":"1. Open the school's Classes tab. 2. Locate the context class.","testData":"The created context class","expected":"The context class is listed on the Classes tab and its Student progress column reads \"Progress reset\". [ASSUMED] - the string is corroborated by the bulk-create CSV template, whose sample row carries Progress reset in its Student progress data column (see TST_BCCF_TC_10), but has not been read off a live class row.","actual":"-","status":"Not Automated","remarks":"Expected result strengthened 2026-09-01 from the other team's TC_CLS_030, which gives the concrete assertion this case previously lacked - ours read only \"behaves as expected\", which nothing could fail. Allow a few minutes after creation: class creation is asynchronous. Depends on TST_BCCF_TC_20 (the bulk Show student progress toolbar action) for the class that produces this state.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"80","id":"TST_CTXC_TC_3","title":"Verify the context class appears/behaves correctly in the teacher login","req":"#32 — Verify Context class creation and view in teacher/admin/student login","type":"Positive","priority":"Medium","preconditions":"A context class exists; a teacher account associated with it.","steps":"1. Log in as the teacher. 2. Locate/open the context class.","testData":"Teacher account [ASSUMED]","expected":"The context class is visible and behaves correctly for the teacher role. [ASSUMED] needs a teacher test account.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Cross-role verification.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"81","id":"TST_CTXC_TC_4","title":"Verify the context class appears/behaves correctly in the student login","req":"#32 — Verify Context class creation and view in teacher/admin/student login","type":"Positive","priority":"Medium","preconditions":"A context class exists; a student account enrolled in it.","steps":"1. Log in as the student. 2. Locate/open the context class.","testData":"Student account [ASSUMED]","expected":"The context class is visible and behaves correctly for the student role. [ASSUMED] needs a student test account.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Cross-role verification.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"84","id":"TST_GCAT_TC_10","title":"Verify a grading category cannot be created with a name that already exists","req":"#5 - Verify create grading category","type":"Negative","priority":"Medium","preconditions":"On the Manage grading categories page, with at least one existing category whose name is known.","steps":"1. Note an existing category name and the current category count. 2. Click Create a grading category. 3. Enter the exact existing name. 4. Click Save. 5. Return to the list and re-count.","testData":"The name of a category already present in the school.","exp CGST_TC_7","title":"Verify a grading category can be removed from the class weighting with the delete icon","req":"#22 - Launch class grade setting page from a class page","type":"Positive","priority":"Medium","preconditions":"On the Class grade settings page of a class that already has at least one grading category carrying a weightage.","steps":"1. Note the categories listed under grade weighting and the current Total grade %. 2. Click the delete (bin) icon against one grading category. 3. Observe the live total. 4. Click Save changes. 5. Refresh the page and re-read the weighting.","testData":"A class with a weighted grading category (the CGST suite creates one via TST_CGST_TC_3).","expected":"The category is removed from the class weighting, the live Total grade % recalculates immediately, and the removal persists after Save changes and a refresh. [ASSUMED] - the removal control has not been exercised live.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_CLS_034, which covers weights, add and remove, and the 100% rule. Our TST_CGST_TC_3 only adds a category and TST_CGST_TC_6 only checks the 100% total, so removal was untested. Fits the existing CGST suite, which already creates and tears down its own class - no new fixture needed. Creates and mutates real data on that throwaway class.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["adminClassGradeSettings.test.js","adminClassGradeSettings.json"]},{"sNo":"88","id":"TST_BCCF_TC_17","title":"Verify the bulk Add teacher toolbar action applies the teacher to every selected class row","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form (/class/create) with at least 2 class rows filled.","steps":"1. Fill 2+ class rows. 2. Tick the checkbox on each row. 3. Click Add teacher in the bulk toolbar. 4. Enter a valid teacher email in the \"Edit teachers\" modal mitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"92","id":"TST_BCCF_TC_21","title":"Verify the bulk Remove toolbar action deletes exactly the selected class rows","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form with at least 3 class rows filled and distinguishable by name.","steps":"1. Fill 3+ distinguishable class rows. 2. Tick the checkbox on 2 of them, leaving one unticked. 3. Click Remove in the bulk toolbar. 4. Confirm if prompted. 5. Read the remaining rows.","testData":"3+ draft class rows with distinct names.","expected":"Exactly the selected rows are removed and the unselected row survives, unchanged. The Create N class(es) button count drops to match the remaining valid rows, and the Saved indicator updates. [ASSUMED] - whether Remove raises its own confirmation is unconfirmed.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from TC_CLS_036. Deliberately leaves one row unselected: an action that removed all rows would still pass a case that only counted deletions. Side-effect free - the form is not submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]}],"allCases":[{"sNo":"1","id":"TST_CLST_TC_1","title":"Verify the Classes tab loads with all expected components","req":"#1 — Verify class tab is loading","type":"Positive","priority":"High","preconditions":"School opened from My school accounts.","steps":"1. Open school 3 July Test School 1. 2. Observe the Classes tab.","testData":"-","expected":"Classes tab loads: Active classes (N) heading, Search, Add class, Filter, User guide, select-all + disabled Delete, class table (Class name/Class key/Start date/End date/Student progress), and a separate Ended classes (N) section. Left nav: Classes/Students/Staff/Library/Reports.","actual":"PASS. Classes tab loaded with every listed component: 'Active classes (15)' heading, search box, Add class, Filter, User guide toggle, select-all checkbox with a disabled Delete class button, all five column headers, a separate 'Ended classes (26)' section, and the five left-nav items.","status":"Pass","remarks":"Classes(N) in nav = Active + Ended.","comments":"Automated - adminClassesTab.test.js (npm run P1AdminClassesTab_Thor, thor). Last run 2026-08-17: 12/12 passing.","rawStatus":"Pass","isImplemented":true,"implFiles":["adminClassesTab.test.js","adminClassesTab.json"]},{"sNo":"2","id":"TST_CLST_TC_2","title":"Verify the Filter modal opens and shows all filter options","req":"#2 — Verify filter functionality is working fine","type":"Positive","priority":"High","preconditions":"On the Classes tab.","steps":"1. Click Filter. 2. Observe the modal.","testData":"-","expected":"Filter modal opens with Class status (Not started, Active, Ended, Expired, Deleted), Class labels (Find a label), Clear all and Apply.","actual":"PASS. Filter modal opened showing all five Class status options (Not started / Active / Ended / Expired / Deleted), the 'Find a label' input, and the Clear all and Apply buttons.","status":"Pass","remarks":"Filter is a modal dialog. Open only - closing via X is TST_CLST_TC_23 (split 2026-08-21 so this TC's end-of-test screenshot shows the panel OPEN with its options, which is what the expected result describes).","comments":"Automated - adminClassesTab.test.js (npm run P1AdminClassesTab_Thor, thor). Last run 2026-08-21: 23/23 passing. X-CLOSE HISTORY CORRECTED 2026-08-21: the 3x re-click // WORKAROUND was removed and the behaviour re-investigated live. It is NOT a product bug - 10/10 manual single clicks close the panel, and 8/8 automated closes succeed when the panel is given time to settle after opening (locator.click, real mouse, dispatchEvent, focus+Enter all work). The panel is visible and geometrically stable before its close handler is bound, which Playwright cannot detect, so automation was simply clicking too early. Closing rading-categories limit is enforced","req":"#5 — Verify create grading category","type":"Edge","priority":"Medium","preconditions":"School already at the maximum number of grading categories.","steps":"1. Attempt to create another grading category.","testData":"-","expected":"Modal: You have reached the maximum number of grading categories for your school. Please remove at least one category to add a new one; no category created. [ASSUMED] exact max count.","actual":"- (not executed)","status":"Blocked","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. NOT AUTOMATED - BLOCKED. Deliberately absent from the test file, the TC repository and the execution file (not merely skipped), so it cannot run by accident.","comments":"BLOCKED (2026-08-18). The precondition is 'school is already at its maximum', so the test must first FILL the school with grading categories. Three problems: (1) the maximum is unknown, so the only way to find it is to keep creating until the app refuses; (2) 3 July Test School 1 (FCN-CHZ-PDA) is SHARED - while it sits at the cap, nobody else can create a grading category and other suites would fail with a misleading error (same cross-suite interference that broke two TST_CLST_TC_7 assertions on 2026-08-17); (3) if a run crashes before cleanup, the school stays full until cleared by hand. TO UNBLOCK, any one of: (a) a DEDICATED school used only by this test (recommended - cheapest and fully safe); (b) product/dev supply the exact maximum, plus agreement to accept the shared-school impact; (c) an environment where no other suite runs. The expected modal copy is already verified live (the modal is pre-rendered in the DOM), so once a school exists this is a short TC.","rawStatus":"Not Run - Blocked","isImplemented":true,"implFiles":["adminGradingCate em scale \"Cambridge One grading scale\".","expected":"The details page shows the scale name, the linked Classes (n) list (or \"No classes yet\") and the pre-27-July-2023 notice. No \"Grading scale bands\" section is rendered, because the default scale's target varies by material. [ASSUMED] - the notice wording is not captured verbatim.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_CLS_012, which opens both a custom scale and the default scale for comparison. Our TST_GSCL_TC_6 opens a custom scale only, and the default scale renders differently. The asymmetry is already recorded in this document's product reference and in TST_GSCL_TC_12's note - the case simply did not exist. Capture the notice text verbatim on the first live pass and clear the [ASSUMED].","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["adminClassGradeSettings.test.js","adminGradingScales.test.js","adminGradingScales.json"]},{"sNo":"86","id":"TST_GSCL_TC_14","title":"Verify a grading scale that is applied to a class cannot be deleted without warning","req":"#15 - Verify deleting a grading scale","type":"Negative","priority":"Medium","preconditions":"A non-default grading scale exists and is currently applied to at least one live class.","steps":"1. Apply a non-default scale to a class via Class grade settings. 2. Open the Grading scales page and that scale's Open drop down menu. 3. Click Delete. 4. Read the resulting dialog. 5. Cancel and confirm the scale is still listed and still applied to the class.","testData":"A non-default scale applied to <CLASS_WITH_CUSTOM_SCALE>.","expected":"Deletion of an in-use scale is prevented, or warns about the impact on the classes using it before proceeding, per business rule. The affected class(es) are identified to the admin. Cancelling leaves both the scale and the class assignment untouched. [ASSUMED] - behaviour and copy unconfirmed.","actual":"-","status":"Not Automated","remarks":"Added TC_17","title":"Verify the bulk Add teacher toolbar action applies the teacher to every selected class row","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form (/class/create) with at least 2 class rows filled.","steps":"1. Fill 2+ class rows. 2. Tick the checkbox on each row. 3. Click Add teacher in the bulk toolbar. 4. Enter a valid teacher email in the \"Edit teachers\" modal and click Apply changes. 5. Read every selected row and the row checkboxes.","testData":"Teacher email <EXISTING_THOR_TEACHER_EMAIL>; 2+ draft class rows.","expected":"The teacher is added to every selected row, not only the first. The rows deselect after the action is applied, and the Saved auto-save indicator updates. [ASSUMED] - the deselect-after-apply behaviour is recorded in TST_BCCF_TC_9's Remarks but has not been asserted by a case of its own.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_CLS_036, which exercises the whole bulk toolbar. TST_BCCF_TC_9 covers bulk Start/End date only; its Remarks claim \"the same pattern applies to bulk Add teacher / Add labels / Add Material\" - a prose claim, not coverage. This case and TC_18-TC_21 turn that sentence into tests. Side-effect free - the form is not submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"89","id":"TST_BCCF_TC_18","title":"Verify the bulk Add Material toolbar action applies the material to every selected class row","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form with at least 2 class rows filled.","steps":"1. Fill 2+ class rows. 2. Tick the checkbox on each row. 3. Click Add Material in the bulk toolbar. 4. Select a course material and apply. 5. Read every selected row and the row checkboxes.","testData":"Material/component <VALID_THOR_MATERIAL>; 2+ draft class rows.","expected":"The material is added to every selected row, the rows deselect after apply, and the Saved indicator updates. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from TC_CLS_036 - see TST_BCCF_TC_17 Remarks. Side-effect free.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"90","id":"TST_BCCF_TC_19","title":"Verify the bulk Add labels toolbar action applies the label to every selected class row","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form with at least 2 class rows filled.","steps":"1. Fill 2+ class rows. 2. Tick the checkbox on each row. 3. Click Add labels in the bulk toolbar. 4. Select or create a label and apply. 5. Read every selected row and the row checkboxes.","testData":"Label <EXISTING_THOR_CLASS_LABEL>; 2+ draft class rows.","expected":"The label is added to every selected row, the rows deselect after apply, and the Saved indicator updates. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from TC_CLS_036 - see TST_BCCF_TC_17 Remarks. Note TST_BCCF_TC_7 records that labels behave specially on Duplicate (an \"Apply the labels to new classes too?\" dialog); check whether the bulk label action raises anything similar. Side-effect free.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"91","id":"TST_BCCF_TC_20","title":"Verify the bulk Show student progress toolbar action applies to every selected class row","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form with at least 2 class rows filled.","steps":"1. Fill 2+ class rows. 2. Tick the checkbox on each row. 3. Click Show student progress in the bulk toolbar. 4. Apply the setting. 5. Read every selected row.","testData":"2+ draft class rows.","expected":"The \"show student progress\" setting is applied to every selected row, the rows deselect after apply, and the Saved indicator updates. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from TC_CLS_036. This is the toolbar control that produces a context class - the classes created this way are the subject of TST_CTXC_TC_1 and TST_CTXC_TC_2, so the two areas should be grounded in the same live pass. Side-effect free while the form is not submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"92","id":"TST_BCCF_TC_21","title":"Verify the bulk Remove toolbar action deletes exactly the selected class rows","req":"#3 - Verify bulk class creation form is working fine","type":"Positive","priority":"Medium","preconditions":"On the \"Create new classes\" form with at least 3 class rows filled and distinguishable by name.","steps":"1. Fill 3+ distinguishable class rows. 2. Tick the checkbox on 2 of them, leaving one unticked. 3. Click Remove in the bulk toolbar. 4. Confirm if prompted. 5. Read the remaining rows.","testData":"3+ draft class rows with distinct names.","expected":"Exactly the selected rows are removed and the unselected row survives, unchanged. The Create N class(es) button count drops to match the remaining valid rows, and the Saved indicator updates. [ASSUMED] - whether Remove raises its own confirmation is unconfirmed.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from TC_CLS_036. Deliberately leaves one row unselected: an action that removed all rows would still pass a case that only counted deletions. Side-effect free - the form is not submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]}]},{"folder":"AdminApp-Students","id":"adminapp-students","name":"Students Tab","badge":"SLST / SPRF / SBLK","file":"AdminApp_Students_tab_test_cases.xlsx","total":68,"pass":23,"blocked":4,"notAutomated":41,"fail":0,"automatedCode":35,"typeDist" he checkbox is not a filter, so identical ticked/unticked results were correct behaviour. <SCHOOL_WITH_MIXED_ACTIVATION> is NOT required. Unblocked by: one redeemed activation code + its student.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"32","id":"TST_SPRF_TC_3","title":"Verify the profile of an ADULT account that logs in with a username shows the username as its identifier","req":"#10 — Verify view profile for a adult with username","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Search for <ADULT_USERNAME_ACCOUNT>.\n2. Open the row’s action menu and click \"View student profile\".","testData":"<ADULT_USERNAME_ACCOUNT> — an adult account created via “Create adult student accounts” (username + password, no email)","expected":"[ASSUMED] The identifier line under the heading holds the username rather than an email, and the row in the Students list is labelled \"Adult Learner\" (not \"Child Learner\").","actual":"-","status":"Blocked","remarks":"BLOCKED at design time — FCN-CHZ-PDA holds 26 students, of which 25 are adults with email addresses and exactly one is a child with a username. There is no adult-with-username account to open. Unblocked by creating one via Manage students > Add new students to classes > Adults > Create adult student accounts (see TST_SBLK_TC_2), or by pointing the case at a school that already has one.","comments":"Blocked at design time. FCN-CHZ-PDA has no adult-with-username account (25 adults with email, 1 child with username). Unblocked by running TST_SBLK_TC_2 to create one, or by targeting a school that already has one.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"45","id":"TST_SPRF_TC_20","title":"Verify selecting more than 50 students blocks the removal with a limit message","req":"#22 — Verify remove from school account: View Profile > Manage account","type":"Edge","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The school holds more than 50 students.","steps":"1. Select 51 or more students.\n2. Click \"Remove from school account\".","testData":"51+ selected students","expected":"The removal is refused and a dialog reads, verbatim: \"You can only remove 50 students at one time\" / \"Please uncheck some students to continue\", with a single \"Close\" action.","actual":"-","status":"Blocked","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. BLOCKED at design time on FCN-CHZ-PDA — the school holds 26 students, so 51 cannot be selected. The modal copy is nevertheless verified word for word from the pre-rendered DOM (2026-08-22), so this case is short work once a school with 51+ students exists. Unblocked by <SCHOOL_WITH_51_PLUS_STUDENTS>.","comments":"Blocked at design time. The 50-student removal cap needs 51+ students selected; FCN-CHZ-PDA holds 26. Modal copy is already verified word for word from the pre-rendered DOM, so this is short work once a larger school exists.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"67","id":"TST_SBLK_TC_16","title":"Verify the administrator receives an email report for an asynchronous bulk job","req":"#17 - Verify Bulk feature > Add new students to classes children","type":"Positive","priority":"Medium","preconditions":"An administrator account whose mailbox the tester can read (e.g. a mailsac-style address). A bulk job has been submitted and its Request ID noted.","steps":"1. Submit a bulk job and record the Request ID and row count from the confirmation screen. 2. Wait for processing (the product states up to ~3 hours for account creation, and 24-48 hours for code activation). 3. Open the admin mailbox and locate the report email. 4. Compare its contents against the submitted job.","testData":"Admin mailbox <MAIL_READABLE_ADMIN_ACCOUNT>; the Request ID from step 1.","expected":"A report email reaches the admin mailbox naming the same Request ID and row count as the confirmation screen, and reporting the per-row outcomes. [ASSUMED]","actual":"-","status":"Blocked","remarks":"Added 2026-09-01: the other team repeat this step in five separate bulk cases (TC_STU_016, 017, 018, 019, 020) - \"check if corresponding email is appearing in admin inbox and shows all the required details\" - and we verify the email report nowhere. Fixture required before this can be automated: a mail-readable admin account. Scope that first; the case is written so it can be executed manually in the meantime. Written against the children path but applies to every async bulk job.","comments":"Blocked at design time (skill rule 4): no mail-readable admin fixture exists on thor. Unblock by provisioning an admin whose mailbox is programmatically readable, then re-scope the case across the five bulk flows.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]}],"notAutomatedCases":[{"sNo":"25","id":"TST_SLST_TC_25","title":"Verify the Students heading count increases after a new student is added to the school","req":"#23 — Verify count of students increase on adding a new student","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The current \"Students (N)\" count has been noted.","steps":"1. Note N from the \"Students (N)\" heading.\n2. Add one new student via Manage students > Add new students to classes (see the SBLK cases).\n3. Return to the Students tab and re ","req":"#8 — Verify view profile for a adult learner","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The student's View student profile page is open.","steps":"1. Read the Course materials section for a student whose umbrellas mix activated, unactivated and expired components.","testData":"Adult learner \"Learner us\" (testps27@mailsac.com) — umbrella \"testumbrellabundle\" holds all three states","expected":"Components are grouped under their umbrella name and each shows exactly one of three states: \"Code activated\" with \"Activated: <date>\" and \"Expires: <date>\"; \"Code not activated\" with no dates; or \"Code expired\" with \"Activated: <date>\" and \"Expires: <date>\" in the past.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-22. “Code expired” was seen only on this account — a fixture worth keeping. The “(N)” in “Course materials (N)” counts UMBRELLAS, not components.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["studentProfile.test.js","adminStudentProfile.json"]},{"sNo":"28","id":"TST_SPRF_TC_5","title":"Verify Back on the profile page returns the admin to the Students tab","req":"#8 — Verify view profile for a adult learner","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The student's View student profile page is open.","steps":"1. Click \"Back\".","testData":"-","expected":"The admin returns to /admin/admin/org ner profile\" page is shown at /admin/admin/org_<slug>/edit-user-profile/<orgUuid>/<userId> with tabs \"Personal info\" and \"Password\". After Update the new names are reflected on the profile heading and in the Students list row. [ASSUMED — Update was not clicked; see Remarks.]","actual":"-","status":"Not Automated","remarks":"MUTATES A REAL SHARED ACCOUNT — not executed during design (2026-08-22). The page, its tabs, its four fields and their editability were all captured live; only the post-Update result is [ASSUMED].","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"36","id":"TST_SPRF_TC_11","title":"Verify Username and Location are shown but cannot be edited","req":"#12 — Verify update personal info of user: View Profile > Manage account > Edit account details","type":"Edge","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The student's View student profile page is open. The \"Personal info\" tab of \"Manage learner profile\" is open.","steps":"1. Try to place the cursor in the Username field.\n2. Try to place the cursor in the Location field.","testData":"-","expected":"Both fields are disabled and reject input. First name and Last name are editable and required; Username and Location are not.","actual":"-","status":"Not Automated","remarks":"Verified live 2026-08-22 on the child account: firstName and lastName are required and editable; username and country are disabled. On that account the disabled Location field held the literal string \"undefined\" rather than a country or a blank — worth raising separately as a display defect. Neither name field carries a maxlength attribute, so any length limit is server-side and unknown; do not write a boundary case until it is measured.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["studentProfile.test.js LK_TC_5","title":"Verify existing students can be invited to classes by email in bulk","req":"#20 — Verify Bulk feature > Add existing students to classes adult/teacher (email)","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class exists.","steps":"1. Click \"Manage students\" > \"Add existing students to classes\".\n2. Select \"Invite students by email\" and click \"Next\".\n3. Populate and upload the CSV, then submit.","testData":"Existing-student CSV keyed by email. File: TST_SBLK_TC_5_existing_email.csv","expected":"The option is described as \"Students will receive an email invitation to join the class. They can sign up and log in with their email address or social media account.\" Submitting sends invitations. [ASSUMED beyond the chooser.]","actual":"-","status":"Not Automated","remarks":"SENDS REAL EMAIL. Chooser copy verified live 2026-08-22.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"54","id":"TST_SBLK_TC_7","title":"Verify the bulk activation page loads with its entry grid and CSV controls","req":"#21 — Verify Bulk feature > Activate course material","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Click \"Manage students\" > \"Activate course materials\".\n2. Observe the page.","testData":"-","expected":"The page /admin/admin/org_<slug>/bulk_activation opens, headed \"Activate codes for students in your school\" above the school name \"3 July Test School 1\". It offers \"Upload file\", \"Get CSV template\", a \"How to use this form\" help toggle, a \"0 Selected\" counter with \"Remove\", one empty entry row with the columns Email or Username / First name / Last name / Activation code (placeholder \"for example ABC4-DE3F-G2HJ-1KLM\"), and a disabled \"Activate 1 code\" button.","actual":"-","status":"Not Automated","remarks":"Verified live 2026-08-22 (screenshot bulk-activation-i18n-key.png). The button label counts the rows, so it changes as rows are added.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"55","id":"TST_SBLK_TC_11","title":"Verify uploading a CSV populates the bulk activation grid","req":"#21 — Verify Bulk feature > Activate course material","type":"Positive","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Click \"Get CSV template\" and save the template.\n2. Populate it with student identifiers and activation codes.\n3. Click \"Upload file\" and choose the populated file.\n4. Observe the grid.","testData":"TST_SBLK_TC_11_bulk_activation.csv — in the exact downloaded template format","expected":"[ASSUMED] The grid is populated with one row per CSV record and the Activate button label updates to the row count. A progress dialog reading \"Please wait, this may take a few minutes\" with \"Cancel upload\" is shown during the upload.","actual":"-","status":"Not Automated","remarks":"The progress dialog copy is verified from the pre-rendered DOM (2026-08-22); the upload itself was not run and the template headers were NOT downloaded, so the CSV fixture cannot be written until they are. If bulk activation behaves like the class bulk upload, uploading only POPULATES the form and “Activate N codes” remains the only gate — which would make this case side-effect free. Confirm that before placing it in a suite.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"56","id":"TST_SBLK_TC_8","title":"Verify the Activate button stays disabled until a row is complete","req":"#21 — Verify Bulk feature > Activate course material","type":"Edge","priority":"Medium","preconditions":"The bulk activation page is open with one empty row.","steps":"1. Observe \"Activate 1 code\" with the row empty.\n2. Fill only the Activation code and observe again.\n3. Fill every column of the row and observe again.","testData":"One partial row, then one complete row","expected":"[ASSUMED] The button is disabled until at least one row carries both an identified student and a code, and enabled once a row is complete.","actual":"-","status":"Not Automated","remarks":"Only the empty-row disabled state was verified live 2026-08-22; the enabling threshold was not exercised. Confirm during Phase 1.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"57","id":"TST_SBLK_TC_9","title":"Verify the bulk-activation success dialog shows real text and not raw translation keys","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"High","preconditions":"A bulk activation has been submitted successfully.","steps":"1. Complete at least one valid row on the bulk activation page.\n2. Click \"Activate N codes\".\n3. Read the success dialog.","testData":"<VALID_UNUSED_ACTIVATION_CODE>","expected":"The dialog should explain what happened in plain English.\n\nACTUAL (defect, observed 2026-08-22): the dialog body renders three RAW UNTRANSLATED KEYS instead of text — \"ADMIN.LEARNER.BULK_ACTIVATION.SUCCESS_MODAL_INFO_1\", \"...SUCCESS_MODAL_INFO_2\" and \"...SUCCESS_MODAL_INFO_3\" — above a \"Back to dashboard\" button.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. DEFECT — raise. Captured WITHOUT running a bulk activation, by reading the pre-rendered dialog in the DOM (admin-shared.md §A6). This is a user-visible failure waiting for the first successful bulk activation. The same page also holds \"An unexpected error occured.\" (sic — “occured”) in its Form-not-uploaded dialog.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"58","id":"TST_SBLK_TC_10","title":"Verify the bulk-activation row checkbox exposes a real accessible label","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Inspect the accessible name of the entry row's select checkbox (screen reader, or the sr-only label in the markup).","testData":"-","expected":"The checkbox should announce something meaningful such as “Select student row”.\n\nACTUAL (defect, observed 2026-08-22): the screen-reader-only label contains the raw key \"ADMIN.LEARNER.BULK_ACTIVATION.SELECT_STUDENT\", so a screen-reader user hears the translation key. The key is not visible on screen, which is why it has gone unnoticed.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. DEFECT (accessibility) — raise alongside TST_SBLK_TC_9; same missing translation bundle. A third instance, \"SCREEN_READER.PROCESSING_MESSAGE\", appears on the individual activation page (TST_SPRF_TC_16), so this looks like one systemic gap rather than three separate typos.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"59","id":"TST_SBLK_TC_12","title":"Verify a CSV that cannot be processed is rejected with a clear message","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Click \"Upload file\" and choose a malformed or oversized CSV.\n2. Read the dialog.","testData":"TST_SBLK_TC_12_malformed.csv","expected":"The upload is refused and a dialog headed \"Sorry, your file could not be uploaded\" is shown, ending \"If that doesn’t work, email our Customer Services team at ptsupport@cambridge.org\". [ASSUMED for the specific reason line, which is populated per failure type.]","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Dialog shell captured from the pre-rendered DOM 2026-08-22. The equivalent dialog on the adult CSV page enforces a 200-record maximum with its own wording (see product-knowledge/ExperienceApp.md); whether bulk activation shares that limit is unknown.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"60","id":"TST_SLST_TC_26","title":"Verify a student whose name contains special characters is returned by a name search","req":"#1 - Verify search by first name","type":"Edge","priority":"Medium","preconditions":"On the Students tab of a school containing a student whose first or last name contains special characters.","steps":"1. Enter the name containing special characters in the search box. 2. Click Search. 3. Read the returned row(s) and the rendered name.","testData":"First name !^(+)s95 or &FName - names present on the shared school per the other team's sheet. Confirm live before running.","expected":"The matching student is returned. The term is treated as literal text rather than interpreted, and the name is rendered correctly in the result row - not HTML-escaped, truncated or corrupted. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_001, which lists special-character names as fixtures. We already cover special characters in the email field (TST_SLST_TC_7) but never in a name field. SLST is already automated, so this is cheap to add. Read-only - no data created.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"61","id":"TST_SLST_TC_27","title":"Verify a partial username returns every account whose username contains the term","req":"#4 - Verify search by username","type":"Edge","priority":"Medium","preconditions":"On the Students tab, with two or more accounts whose usernames share a common substring.","steps":"1. Enter a substring shared by several usernames (not a whole username). 2. Click Search. 3. Read the returned rows.","testData":"Username fragment <SHARED_USERNAME_SUBSTRING> - e.g. the common prefix of s95child0001-style accounts.","expected":"Every account whose username contains the term is returned, not only an exact match. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_004, whose step 2 searches a partial username. Our TST_SLST_TC_8 searches a full child username only. We already prove partial matching for first name (TST_SLST_TC_3), so username was the one identifier left unverified. Read-only.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"62","id":"TST_SLST_TC_28","title":"Verify a never-activated code returns a clear no-result state in the activation-code search","req":"#5 - Verify search using who activated the code in my school checkbox","type":"Negative","priority":"Medium","preconditions":"On the Students tab with the \"Who activated the code in my school?\" checkbox ticked.","steps":"1. Tick Who activated the code in my school?. 2. Enter a well-formed 16-character code that has never been activated in this school. 3. Click Search. 4. Wait for the query to settle (the code search can take up to ~1 minute).","testData":"A syntactically valid but unredeemed 16-character code, e.g. AAAA-BBBB-CCCC-DDDD.","expected":"A clear no-result / empty state is shown, with no error and no stale results left from the previous query. [ASSUMED] - exact copy not captured.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_005, step 2. Our TST_SLST_TC_13 only toggles the checkbox and TST_SLST_TC_14 (Blocked, needs a known redeemed code) covers the success path, so the failure path was entirely unverified. This case is cheaper than TC_14 and can run today - it needs no seeded redemption. Read-only.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"63","id":"TST_SPRF_TC_23","title":"Verify a learner can sign in with the password an administrator has just set","req":"#11 - Verify Change password: View Profile > Manage account > Edit Account details","type":"Positive","priority":"High","preconditions":"A disposable learner account exists whose credentials the tester controls and whose current password is known.","steps":"1. As admin, open the learner's profile > Manage learner profile > Password. 2. Set a new policy-compliant password and click Update. 3. Sign out. 4. Sign in as the learner with the new password. 5. Sign out and attempt to sign in with the old password.","testData":"Disposable learner <DISPOSABLE_STUDENT_ACCOUNT>; new password meeting the policy (min 8 characters, at least one letter and one number/special).","expected":"Sign-in with the new password succeeds and the learner reaches their dashboard. Sign-in with the old password is rejected. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_010, whose expected result is \"login with the new password succeeds\". Our TST_SPRF_TC_8 stops at the form accepting the update - which a change that was acknowledged but never persisted would also satisfy. Mutates a real account: use a disposable learner, never a shared fixture, and place it in a data-mutating suite.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"64","id":"TST_SBLK_TC_13","title":"Verify a duplicate username is flagged on its own row during bulk account creation","req":"#17 - Verify Bulk feature > Add new students to classes children","type":"Negative","priority":"High","preconditions":"On \"Create new accounts for children\" via Manage students > Add new students to classes > Children.","steps":"1. Fill one valid child row. 2. Fill a second row re-using the same username. 3. Read both rows and the submit button. 4. Repeat via the CSV path with the same duplicate pair.","testData":"Two child rows sharing one username; the rest of the fields valid.","expected":"The offending row is flagged (no green tick) with an error naming the username field, the valid row is unaffected, and Create N account(s) stays unavailable while any row is invalid. Behaviour is the same for the manual grid and the CSV upload. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_016_N1. Our SBLK negatives cover only the CSV-level rejection (TST_SBLK_TC_12) and two UI defects (TC_9 raw i18n keys, TC_10 checkbox label) - row-level validation was untested. This is the guard that stops bad accounts being created in bulk. Side-effect free provided the form is never submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"65","id":"TST_SBLK_TC_14","title":"Verify a rule-violating username or password is flagged on its own row during bulk account creation","req":"#18 - Verify Bulk feature > Add new students to classes adult with username","type":"Negative","priority":"High","preconditions":"On \"Create adult student accounts\" via Manage students > Add new students to classes > Adults.","steps":"1. Fill one valid adult row. 2. Fill a second row with a username and a password that violate the documented rules. 3. Read both rows, the per-field messages and the submit button. 4. Repeat via the CSV path.","testData":"One valid adult row; one row with a rule-violating username and a rule-violating password.","expected":"The offending row is flagged (no green tick), the message identifies which field is wrong, the valid row is unaffected, and the submit control stays unavailable while any row is invalid. [ASSUMED] - the username and password rules must be read from the form's own help text before this case is finalised.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_017_N1. Companion to TST_SBLK_TC_13 on the adult path. Capture the stated rules verbatim on the first live pass - inventing them would breach golden rule 2. Side-effect free provided the form is never submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"66","id":"TST_SBLK_TC_15","title":"Verify an invalid code in a bulk activation is reported without blocking the valid rows","req":"#21 - Verify Bulk feature > Activate course material","type":"Negative","priority":"High","preconditions":"On \"Activate codes for students in your school\" via Manage students > Activate course materials.","steps":"1. Fill a batch mixing rows with valid unused codes and at least one already-used or invalid code. 2. Submit Activate N code(s). 3. Read the job outcome and, once processed, the affected learner profiles.","testData":"Valid unused 16-character codes plus one already-used/invalid code.","expected":"Only the bad row is flagged or reported in the job outcome; the valid rows still activate and their learners show \"Code activated\". A single bad row does not fail the whole batch. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_020_N1. Our TST_SBLK_TC_12 rejects an unprocessable CSV outright - the all-or-nothing path; this is the partial-failure path, which is where async bulk jobs typically break. Creates real data (consumes activation codes) - data-mutating suite only, and the codes cannot be reused.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"68","id":"TST_SBLK_TC_17","title":"Verify the bulk CSV upload accepts 200 records and rejects 201","req":"#18 - Verify Bulk feature > Add new students to classes adult with username","type":"Edge","priority":"Medium","preconditions":"On the adult bulk-creation form with the CSV template downloaded.","steps":"1. Build a CSV of exactly 200 valid rows and upload it. 2. Note whether the grid populates and the submit count. 3. Build a CSV of 201 valid rows and upload it. 4. Read the resulting message.","testData":"Two generated CSVs in the real template format - 200 rows and 201 rows.","expected":"The 200-row file is accepted and the grid reports 200 rows. The 201-row file is rejected with a message naming the limit. [ASSUMED] - the exact rejection copy is not captured.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_016/017, whose expected results state the cap twice (\"<=200 records\"). TST_SBLK_TC_12's Remarks already record that the adult CSV page enforces a 200-record maximum with its own wording - so the limit is known and the boundary case was simply missing. Boundary cases at a documented cap are the pattern that repeatedly caught real defects in the Classes work. Side-effect free if the 200-row file is never submitted. Generate the CSVs to the exact template headers.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]}],"allCases":[{"sNo":"1","id":"TST_SLST_TC_1","title":"Verify the Students tab loads with all expected components when a school is opened","req":"— (designer-added)","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Open school \"3 July Test School 1\" (FCN-CHZ-PDA) from My school accounts.\n2. Click the STUDENTS tab in the left nav.\n3. Observe the page.","testData":"-","expected":"URL is /admin/admin/org_perf_testschool_1/learner. Heading reads \"Students (N)\". The page shows: search box with placeholder \"Search by first name, last name, email or username\", a Search button, the checkbox \"Who activated the code in my school?\", a \"Manage students\" dropdown, a select-all checkbox with \"0 Selected\", a disabled \"Remove from school account\" button, a \"User guide\" toggle, and a table with sort headers Last name / First name / Email address or Username.","actual":"-","status":"Pass","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Added by the designer — the source list has no explicit tab-load scenario, but every other case depends on this state. N moves on this shared school; never assert an absolute count.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["adminStudentsTab.test.js","adminStudentsTab.json"]},{"sNo":"2","id":"TST_SLST_TC_2","title":"Verify a student is returned when searching by their exact first name","req":"#1 — Verify search by first name","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Type \"Marvin\" into the search box.\n2. Click Search.\n3. Observe the result list and the heading.","testData":"First name: Marvin (student \"Marvin Jae student\", nonmqastudent5@mailsac.com)","expected":"Exactly one row is listed — Last name \"student\", First name \"Marvin Jae\", Email \"nonmqastudent5@mailsac.com\". The heading changes from \"Students (N)\" to \"Students / Showing search results for Marvin. / Clear\" — the count is replaced by the search banner.","actual":"-","status":"Pass","remarks":"The search term is echoed in the banner verbatim.","comments":"-","rawStatus":
