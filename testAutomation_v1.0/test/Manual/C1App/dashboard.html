h was not followed in this session.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"14","id":"TST_INVI_TC_10","title":"Verify recent notifications show a relative date and older ones show an absolute date","req":"#3 — Verify notifications","type":"Edge","priority":"Medium","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. The account has notifications both within and beyond the last seven days.","steps":"1. Click the notifications bell.\n2. Read the date on a row under \"Last Seven days\".\n3. Read the date on a row under \"Older\".","testData":"—","expected":"Rows under \"Last Seven days\" show a RELATIVE date, e.g. \"5 days ago\".\nRows under \"Older\" show an ABSOLUTE date in the format \"Ddd, DD Mmm, YYYY\", e.g. \"Mon, 17 Aug, 2026\".","actual":"-","status":"Not Automated","remarks":"Grounded live 2026-08-27 — both formats observed in the same panel. This is worth pinning because a single date-format assertion across all rows will fail: the format depends on which time group the row falls in. The exact boundary between the two groups is [ASSUMED] to be seven days from the group heading wording; it was not tested at the boundary.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"15","id":"TST_INVI_TC_11","title":"Verify report-ready notifications describe the Reports destination consistently","req":"#3 — Verify notifications","type":"Negative","priority":"Low","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. The account has both \"Class summary\" and \"Aggregated data\" report-ready notifications.","steps":"1. Click the notifications bell.\n2. Read the body line of a \"Your Class summary report is ready\" row.\n3. Read the body line of a \"Your Aggregated data report is ready\" row.","testData":"—","expected":"Both notifications refer to the same r opened interactively, so the open/close behaviour is [ASSUMED].","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"17","id":"TST_ASHL_TC_4","title":"Verify the Tutorials submenu lists all five tutorial topics when it is expanded","req":"#7 — Verify Help","type":"Positive","priority":"Medium","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Click \"Help\" in the page header.\n2. Click \"Tutorials\".\n3. Observe the listed tutorial topics.","testData":"—","expected":"Exactly five tutorial topics are listed, with these titles verbatim:\n1. \"Understanding codes and keys\"\n2. \"Activating course materials\"\n3. \"Creating a class\"\n4. \"Adding students to a class\"\n5. \"Creating assignments\"","actual":"-","status":"Not Automated","remarks":"Titles grounded live 2026-08-27 from the pre-rendered DOM. ⚠️ All five share the SINGLE qid \"cHeader-hlp-6\" — when automated they must be addressed by text or index, never by qid. Same trap class as \"t-prd-cmp-cntr-1\" (admin-shared.md §B3), and the same shape as the cFooter-9 duplication the footer selectors already work around with an aria-label qualifier. What each topic OPENS was not captured — [ASSUMED] and out of scope for this case.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"18","id":"TST_ASHL_TC_5","title":"Verify all five school tabs are shown with Classes active when a school is opened","req":"#11 — Verify different tab navigation","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Click a school card on \"My school accounts\".\n2. Observe the tab strip and which tab is active.\n3. Observe the page heading and the browser tab title.","testData":"School: \"3 July Test School 1\" (<SCHOOL_KEY>)","expected":"Exactly FIVE tabs are shown, in this order and in upper case:\nCLASSES · STUDENTS · STAFF · LIBRARY · REPORTS\n\"CLASSES\" is the active tab by default, the page heading shows the school name, and the browser tab reads \"Classes | Cambridge One\".","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27. Tab qids \"aDetail-1\" (Classes), \"aDetail-2\" (Students), \"aDetail-4\" (Staff), \"aDetail-5\" (Library), \"aDetail-6\" (Reports). ⚠️ \"aDetail-3\" IS SKIPPED — the sequence is 1,2,4,5,6. Do not iterate 1..5 assuming contiguity. ⚠️ THE ACTIVE MARKER IS ON THE PARENT <li>, not the anchor: \"li.nav-item.active > a\". The anchor className is identical on every tab whether active or not, so asserting on the link class is a guaranteed false green. Labels render UPPER CASE — confirm whether that is CSS text-transform or the actual text before asserting case-sensitively.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"19","id":"TST_ASHL_TC_6","title":"Verify each tab loads its own page and becomes the active tab when it is selected","req":"#11 — Verify different tab navigation","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. A school is open on the Classes tab.","steps":"1. Click \"STUDENTS\" and note the URL, title and active tab.\n2. Repeat for \"STAFF\", \"LIBRARY\", \"REPORTS\", then \"CLASSES\".","testData":"School slug: org_<SCHOOL_SLUG>","expected":"Each tab navigates to its own URL, sets its own browser-tab title, and becomes the active tab:\n| Tab | URL suffix | Title |\n| CLASSES | /class | \"Classes \\| Cambridge One\" |\n| STUDENTS | /learner | \"Students \\| Cambridge One\" |\n| STAFF | /staff | \"Staff \\| Cambridge One\" |\n| LIBRARY | /library | \"Library \\| Cambridge One\" |\n| REPORTS | /reports | \"Reports \\| Cambridge One\" |\nThe school heading stays unchanged throughout.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27 — all five walked and every URL and title confirmed. ⚠️ NOTE the STUDENTS tab routes to \"/learner\", NOT \"/student\". A URL assertion built from the tab label will fail on this one. Tabs carry REAL hrefs (unlike the footer, whose logged-in hrefs collapse to javascript:void(0) — TST_FOOT_TC_10 remarks), so tab navigation is genuinely href-driven. TIMING measured this session: Reports took ~4.3 s to become active, Classes ~1.2 s. Poll for \"li.nav-item.active > a\" carrying the expected qid rather than using a fixed pause (admin-shared.md §B8).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"20","id":"TST_ASHL_TC_7","title":"Verify the active school tab is identifiable to assistive technology","req":"#11 — Verify different tab navigation","type":"Negative","priority":"Medium","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. A school is open.","steps":"1. Inspect each tab link for an aria-current or selected-state attribute.\n2. Switch tabs and re-inspect.","testData":"—","expected":"The active tab exposes an accessible current/selected state, so assistive technology can announce which section the user is in.\nACTUAL (2026-08-27): this FAILS. No tab link carries aria-current or aria-selected; the only indicator is the \"active\" CSS class on the parent <li>, which is presentational.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27. This is the SECOND instance of the same gap in this batch — the My Profile tabs have it too (TST_MYPR_TC_8). Worth raising as one combined accessibility ticket rather than two. The school tabs are at least recoverable for automation via \"li.nav-item.active\"; the profile tabs have no indicator at all, which makes them the more severe of the two.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"21","id":"TST_FOOT_TC_10","title":"Verify the admin footer renders seven links and omits Site Feedback","req":"#8 — Verify footer link","type":"Edge","priority":"Medium","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Scroll to the bottom of an admin page.\n2. List every link rendered in the footer.","testData":"—","expected":"The admin footer renders exactly SEVEN links:\n\"Terms of use\" · \"Privacy notice\" · \"Accessibility\" · \"Our approach\" · \"FAQs\" · \"Cambridge One for schools\" · \"Help\"\nplus the site-language control and the copyright line \"© Cambridge University Press & Assessment 2026\".\n\"Site Feedback\" (qid cFooter-4) is NOT rendered in the admin app.","actual":"-","status":"Not Automated","remarks":"Grounded live 2026-08-27 on /admin/admin/dashboard. EXTENDS the existing FOOT module (TST_FOOT_TC_1..9, footer.test.js) rather than duplicating it — those nine cases already validate each footer page launches correctly, and this batch adds no per-link cases. GENUINE GAP: the FOOT selector set includes \"footerSiteFeedback\" (a[qid=\"cFooter-4\"]), so the C1 footer carries EIGHT links, but the ADMIN footer renders only seven — Site Feedback is absent. Nothing currently pins that difference, so a shared-footer change could silently add or remove it. The copyright YEAR is dynamic — assert the pattern, not the literal 2026.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"22","id":"TST_SKEY_TC_1","title":"Verify the School settings menu exposes Change school key alongside the grading options","req":"#4 — Verify Change school key for normal school","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Click \"School settings\" on the Classes tab.\n2. Observe the items in the open menu.","testData":"—","expected":"The menu opens and contains exactly three items:\n1. \"Change school key\"\n2. \"Manage grading categories\"\n3. \"Manage grading scales\"","actual":"-","status":"Not Automated","remarks":"GROUNDED LIVE 2026-08-27 from the pre-rendered DOM. Trigger qid \"adEdit-1\"; items \"adEdit-2\" (Change school key), \"adEdit-7\" (categories), \"adEdit-8\" (scales). ⚠️ CORRECTS admin-shared.md §A1, which lists School settings as having only the TWO grading entries. \"Change school key\" is a third and was previously undocumented. Note the qid numbering is NOT contiguous (2, 7, 8) — adEdit-3/4 are the confirmation-dialog buttons, not menu items. Do not iterate the family.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"23","id":"TST_SKEY_TC_2","title":"Verify an irreversible-action warning is shown when Change school key is selected","req":"#4 — Verify Change school key for normal school","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Open \"School settings\".\n2. Click \"Change school key\".\n3. Read the dialog.","testData":"—","expected":"A warning dialog is shown, ss all 7 schools: three uppercase triplets, e.g. \"FCN-CHZ-PDA\". Whether existing members are affected, and whether the change is announced anywhere, are both unknown. DESTRUCTIVE AND IRREVERSIBLE — this decides suite placement absolutely: it can never sit in a shared-school suite.","comments":"BLOCKED at design time 2026-08-27 — IRREVERSIBLE ACTION ON A SHARED SCHOOL. The product itself states \"Changing the school key cannot be undone\". Unblock with a DEDICATED, DISPOSABLE school that no suite depends on.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"25","id":"TST_SKEY_TC_4","title":"Verify the school key is unchanged when the warning dialog is cancelled","req":"#4 — Verify Change school key for normal school","type":"Negative","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Note the current school key.\n2. Open \"School settings\" and click \"Change school key\".\n3. Click \"Cancel\" in the warning dialog.\n4. Re-read the school key.","testData":"—","expected":"[ASSUMED] The dialog closes and the school key is UNCHANGED.","actual":"-","status":"Not Automated","remarks":"⚠️ EXPECTED RESULT NOT VERIFIED — the dialog was never opened, by design, on the shared school. This is the SAFE half of the flow and is the one case here that could reasonably be run on a shared school, PROVIDED Cancel is clicked and never Continue. Even so, treat it carefully: a misclick is irreversible. Cancel qid \"adEdit-4\". Also confirm whether dismissing via Esc or a backdrop click behaves the same as Cancel.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"26","id":"TST_LIBR_TC_32","title":"Verify MQA and CQA restricted products are not listed for an administrator outside those programmes","req":"#5 — Verify non mqa admin should not see cqa/mqa product","type":"Negative","priority":"High","preconditions":"Logged in as an administrator with NO MQA or CQA entitlement, on a school outside those programmes. Library tab open.","steps":"1. Open the Library tab for the school.\n2. Note the total product count in the \"Library (N)\" heading.\n3. Search the listing for products restricted to the MQA and CQA programmes.","testData":"School: <NON_MQA_SCHOOL_KEY>","expected":"[ASSUMED] No MQA- or CQA-restricted product appears in the listing, and the total count excludes them.","actual":"-","status":"Blocked","remarks":"⚠️ THE EXPECTED RESULT DEPENDS ON A DEFINITION THAT DOES NOT YET EXIST. Restriction is a licensing property, NOT a naming convention, so this case cannot be written against product titles.\nOBSERVED LIVE 2026-08-27 on \"3 July Test School 1\" (FCN-CHZ-PDA), Library (971): TWO products whose TITLES contain \"CQA\" are listed — \"CQA - 7 Jan 2021 - Test Umbrella product\" and \"Teacher Training - CQA Test Product\". Separately, 3 titles begin \"NON MQA\", which are explicitly non-MQA products and are correctly present.\nThis is an OBSERVATION, NOT A DEFECT CLAIM: a title containing \"CQA\" does not prove the product is CQA-restricted. It is recorded because it is the concrete thing to check once the definition exists — if those two ARE restricted, this is a live leak; if they are merely named that way, the case needs different data.\nExtends the existing LIBR module (TST_LIBR_TC_1..31) — do not renumber it.","comments":"BLOCKED at design time 2026-08-27 on TWO counts: (1) no non-MQA admin account is available — <ADMIN_USER>'s home school IS MQA Sierra School (MQA-ABC-DEF); (2) the product team must first define what technically marks a product as MQA/CQA-restricted. Unblock with a non-MQA admin account and that definition.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"27","id":"TST_SADB_TC_2","title":"Verify every school the administrator manages is listed when My school accounts is opened","req":"#10 — Admin part of multiple org","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Observe the \"My school accounts\" page.\n2. Inspect each school card.","testData":"—","expected":"Every school the administrator manages is listed, one card each, numbered sequentially from \"01\" with zero padding.\nEach card shows: index, school name, address, the label \"School key\", the key itself in XXX-XXX-XXX format, a \"Copy\" control, and a chevron opening the school.\nObserved 2026-08-27 for <ADMIN_USER>: 7 schools, numbered 01–07.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27. Card qid \"aDashboard-N\" (a.inst-link); chevron is a SEPARATE \"aDashboard1-N\". Both are POSITIONAL. The school key is carried in the card's aria-label, which is what makes key-based selection possible (schoolAdminDashboard.schoolLinkByKey uses a.inst-link[aria-label*=\"{{key}}\"]).\n⚠️ NEVER assert the literal count 7 — this is a shared account and the list changes (admin-shared.md §A5). Assert the card STRUCTURE and that the expected key is present.\nExtends the existing SADB module (TST_SADB_TC_1 opens a school by key) — that case already covers opening; this one covers the LISTING, which nothing did.\n⚠️ EXTENDS admin-shared.md §0, which documents 4 schools. This account sees 7 — KNF-XRD-QVE, HQC-ZWM-ZVF and GYB-JMU-KYA were undocumented.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"28","id":"TST_SADB_TC_3","title":"Verify switching between organisations loads each one independently when the admin manages several","req":"#10 — Admin part of multiple org","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Open the first school and note the org slug in the URL and the page heading.\n2. Return to \"My school accounts\".\n3. Open a DIFFERENT school and note its org slug and heading.\n4. Compare the Classes listings of the two.","testData":"Schools: <SCHOOL_KEY_A> and <SCHOOL_KEY_B>","expected":"Each school opens under its own org slug, /admin/admin/org_<slug>/class, with its own name as the page heading and its own class list. No content from the previously opened school persists.\nObserved 2026-08-27: \"3 July Test School 1\" (FCN-CHZ-PDA) opened as org_perf_testschool_1.","actual":"-","status":"Not Automated","remarks":"GROUNDED PARTIALLY 2026-08-27 — one school was opened and its slug confirmed; the SWITCH between two schools was not exercised, so step 4 is [ASSUMED].\n⚠️ The org slug is NOT derivable from the school name or key — \"3 July Test School 1\" (FCN-CHZ-PDA) maps to org_perf_testschool_1. Capture each slug; never construct it.\nThe school context MUST be set by clicking the card — deep-linking /admin/admin/org_<slug>/class returns /dashboard/error even when authenticated (admin-shared.md §A1).\nWorth checking whether the per-account server-side class Filter and Search (§A4) are scoped per school or leak across organisations — that is unknown and would be a real defect if they leak.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"29","id":"TST_SADB_TC_4","title":"Verify two schools sharing a display name remain distinguishable by their school key","req":"#12 — Verify viewing multiple schools","type":"Edge","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Locate the two cards sharing the same display name.\n2. Compare their school keys.\n3. Open the one matching a specific key and confirm which school loaded.","testData":"Duplicate display name \"3 July Test School 1\" — keys FCN-CHZ-PDA and ZPB-TWP-AEQ","expected":"Both cards show the SAME display name but DIFFERENT school keys, and the card selected by key opens that specific school.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27 — cards 01 and 02 both read \"3 July Test School 1\" with keys FCN-CHZ-PDA and ZPB-TWP-AEQ, and identical addresses too.\n⚠️ THIS IS THE CASE THAT JUSTIFIES admin-shared.md §0's standing rule: ALWAYS select a school by KEY, never by name or card position. Selecting by name is ambiguous here, and card qids (aDashboard-N) are positional so they re-issue when the list changes.\nConfirming WHICH school loaded (step 3) needs a distinguishing feature — the org slug in the URL is the reliable one, since the heading shows the shared name.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"30","id":"TST_SRQS_TC_2","title":"Verify the institution request is submitted and confirmed from the summary step","req":"#6 — Verify launch of Cambridge one for schools and create institution request","type":"Positive","priority":"High","preconditions":"The \"Set up a school account\" wizard has been completed through step 7, so the School request summary step (step 8) is displayed.","steps":"1. Review the summary of the entered details.\n2. Submit the request.\n3. Observe the confirmation.","testData":"School name: \"<TEST_PREFIX> Test School\" · Type: Primary school · Teachers: 2-14 · Location: United Kingdom · Address: 123 Test Street, Test City · Tel: +441234567890","expected":"[ASSUMED] The request is submitted and a confirmation is shown, stating that the request has been received and what happens next.","actual":"-","status":"Blocked","remarks":"⚠️ THE ONLY UNCOVERED STEP OF THIS SCENARIO. The wizard is already automated step by step — TST_DINS_TC_1 (entry), TST_SUSA_TC_1..2 (intro), TST_SCTY_* (type), TST_NTCH_* (teachers), TST_SNAM_* (name), TST_SLOC_* (location), TST_SADR_* (address), TST_SCON_* (contact), TST_SRQS_TC_1 (summary loads). Launching from the footer is covered by TST_FOOT_TC_7 (\"Validate Cambridge One School page is launched correctly\"). What NOTHING covers is the actual SUBMISSION and its confirmation — this case, extending SRQS. Confirmation copy is [ASSUMED]; capture it verbatim when the block is lifted. CREATES REAL DATA outside the test estate.","comments":"BLOCKED at design time 2026-08-27 — submitting raises a REAL institution request that reaches a human queue and cannot be withdrawn from the UI. Unblock by confirming with the product team that Thor submissions are safe to raise and are swept, or by agreeing a test-only school name prefix.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"31","id":"TST_SRQS_TC_3","title":"Verify each wizard step blocks progress until its required input is supplied","req":"#6 — Verify launch of Cambridge one for schools and create institution request","type":"Negative","priority":"Medium","preconditions":"The \"Set up a school account\" wizard is open at step 2 (School type).","steps":"1. On School type, without selecting an option, attempt to continue.\n2. Select an option and confirm progress is now allowed.\n3. Repeat the same check for Number of teachers, School name, School location, School address and School contact details.","testData":"—","expected":"[ASSUMED] On each step the Next control is unavailable until that step's required input is supplied, and becomes available once it is. No step can be skipped.","actual":"-","status":"Not Automated","remarks":"⚠️ EXPECTED RESULT NOT VERIFIED — the wizard was not walked in this session. INFERRED from the existing automation, whose case titles state the enabling direction only, e.g. TST_SCTY_TC_3 \"Select first radio option (Primary school) to ENABLE Next button\" and TST_SNAM_TC_3 \"Fill school name field to ENABLE Next button\". The DISABLED half is nowhere asserted, which is the gap this case fills. Confirm whether Next is natively disabled or only CSS-disabled — admin-shared.md §B4 records CSS-only disabling elsewhere in this app, which would make a naive enabled-state check a false green. SIDE-EFFECT FREE: stops short of submission.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"32","id":"TST_ASHL_TC_8","title":"Verify no dialog is visible when an admin screen first loads","req":"#9 — Verify various errors in forms and modals","type":"Negative","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Load the Classes tab and observe the screen without interacting.\n2. Repeat for Students, Staff, Library and Reports.","testData":"—","expected":"On every tab, no dialog, warning or error is visible on load. The screen shows only its own content.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27 — verified that every dialog present in the DOM was hidden on load (Classes 5, Students 4, Staff 1; all offsetParent === null). ⚠️ THIS IS THE HEADLINE AUTOMATION TRAP FOR THIS SCENARIO. Admin dialogs are PRE-RENDERED, so they exist in the DOM before anything triggers them. Any check of the form \"getElementCount(dialog) > 0\" therefore passes ALWAYS and proves nothing — admin-shared.md §B2 records this silently breaking reset_filters for weeks. Assert VISIBILITY, never presence. Note also that opacity:0 still counts as visible to Playwright; only display:none is hidden.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"33","id":"TST_ASHL_TC_9","title":"Verify the 50-item limit warnings use a consistent message pattern across screens","req":"#9 — Verify various errors in forms and modals","type":"Edge","priority":"Medium","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Read the bulk-limit warning offered on the Classes tab.\n2. Read the equivalent warning on the Students tab.\n3. Compare their wording.","testData":"—","expected":"Both follow the same two-line pattern, differing only in the noun:\nClasses: \"You can only delete 50 classes at one time\" / \"Please uncheck some classes to continue\"\nStudents: \"You can only remove 50 students at one time\" / \"Please uncheck some students to continue\"\nBoth offer a \"Close\" control.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. COPY GROUNDED LIVE 2026-08-27 — both captured VERBATIM from the pre-rendered DOM (§A6) without reaching the capped state, which would otherwise require 51+ rows. Note the VERB differs with the domain — \"delete\" for classes, \"remove\" for students — so a single shared assertion string is wrong. The LIMIT (50) and the sentence shape are the consistent parts. Reaching these states for real is Blocked on the shared school (admin-shared.md §A5: it holds 26 students, so the 50-student cap cannot be hit).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"34","id":"TST_ASHL_TC_10","title":"Verify destructive confirmations state their consequence before the action is taken","req":"#9 — Verify various errors in forms and modals","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; a school opened from \"My school accounts\" so the school context is set; Classes tab displayed.","steps":"1. Read the class-deletion confirmation.\n2. Read the student-removal confirmation.\n3. Read the change-school-key confirmation.\n4. Check each offers a way to back out.","testData":"—","expected":"Each destructive confirmation names its consequence and offers a non-destructive exit:\nClass delete — \"WARNING!\" / \"There might be students, teachers and course materials in the selected classes\" / \"Are you sure you want to delete?\" / \"No, cancel\"\nStudent removal — \"I confirm that I want to remove students from my school account\" / \"Cancel\" / \"Request to remove\"\nChange school key — \"CAREFUL!\" / \"Changing the school key cannot be undone\" / \"Cancel\"","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. ALL THREE CAPTURED VERBATIM 2026-08-27 from the pre-rendered DOM, without triggering any of them — which is the only safe way, since all three are destructive on a shared school. ⚠️ The change-school-key dialog is present on EVERY admin tab (Classes, Students, Staff all carry it) because School settings lives in the shared page chrome — scope any modal selector with :has(...) to the specific dialog, or it will match this one everywhere. Async follow-ups are also pre-rendered and worth checking in the same pass: \"This will take a few minutes\" (classes) and \"Removing students may take some time\" (students).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"35","id":"TST_SADB_TC_5","title":"Verify the administrator can switch to the teacher dashboard and back again","req":"#13 — Verify Admin is able to switch to teacher view","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed.","steps":"1. Note that the toggle reports Administrator as active.\n2. Activate the toggle.\n3. Observe the resulting page.\n4. Activate the toggle again.\n5. Confirm the administrator view is restored.","testData":"—","expected":"After step 2 the browser navigates to /dashboard/teacher/dashboard, the browser tab reads \"Teacher dashboard | Cambridge One\", the page greets the user (\"Hi <FIRST_NAME>!\") and the toggle now reports \"Teacher currently active\".\nAfter step 4 the browser returns to /admin/admin/dashboard, titled \"My school accounts | Cambridge One\", and the toggle reports \"Administrator currently active\".","actual":"-","status":"Not Automated","remarks":"GROUNDED LIVE 2026-08-27 — the full round trip was performed and the account was left in Administrator view. ⚠️ THE SWITCH ELEMENT IS NAMED DIFFERENTLY IN EACH VIEW: \".can-toggle__switch\" (double underscore) in the admin view, \".can-toggle-switch\" (single hyphen) in the teacher view. A selector written for one view SILENTLY FAILS to find it in the other, which breaks exactly the round trip this case exercises. Use \"#teacher-admin-toggle\" (stable in both) and read the input's checked state — false = Administrator, true = Teacher. The focusable control is the inner [tabindex=\"0\"] div; the input itself is aria-hidden. The toggle also appears on inner admin tabs, not just the dashboard. Existing selector schoolAdminDashboard.teacherAdminToggle already targets the input; this extends SADB. SIDE-EFFECT FREE — a view switch only.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"36","id":"TST_SADB_TC_6","title":"Verify the teacher view lists the schools where the user teaches, not those they administer","req":"#13 — Verify Admin is able to switch to teacher view","type":"Edge","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. The user is both an administrator and a teacher on overlapping sets of schools.","steps":"1. On \"My school accounts\", list the schools shown.\n2. Switch to the teacher view.\n3. List the school groups shown there.\n4. Compare the two lists.","testData":"—","expected":"The two lists are NOT the same. The administrator view shows schools the user administers; the teacher view groups classes under schools where the user teaches, which may include schools absent from the administrator view.\nObserved 2026-08-27: administrator view 7 schools; teacher view 8 school groups, including \"ABERYSTWYTH COLLEGE : THOR\" and \"LTI INTEGRATIONS TEST2\", neither of which appears in the administrator list.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. GROUNDED LIVE 2026-08-27. This matters because it is easy to assume the two views show the same estate — they do not, and a test asserting equal school counts across the toggle will fail. ⚠️ The teacher view groups by school DISPLAY NAME, so the two distinct schools both called \"3 July Test School 1\" (FCN-CHZ-PDA and ZPB-TWP-AEQ) collapse into a SINGLE group there. The admin view keeps them separate via their keys. Do not match schools across the two views by name. ⚠️ NEVER assert the literal counts 7 and 8 — shared account (§A5). Assert the RELATIONSHIP: the teacher list contains at least one school the admin list does not. ⚠️ Every \"Create class\" button in the teacher view shares qid \"tDashboard-ncls-btn-1\" — 7 elements, one per school group. See TST_SADB_TC_7.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"37","id":"TST_SADB_TC_7","title":"Verify a class created in the teacher view appears in the Admin Classes tab for the same school","req":"#14 — Verify admin is able to create a new class in teacher view and view that class in Admin classes tab","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <ADMIN_USER> on Thor; \"My school accounts\" (/admin/admin/dashboard) displayed. The user is both administrator and teacher on the target school. USE A SCHOOL WHOSE CLASS LIST IS NOT ASSERTED BY OTHER SUITES.","steps":"1. Switch to the teacher view.\n2. Locate the section for the target school and click ITS \"Create class\" control.\n3. Create a class named \"AutoClass_TeacherView_<RUN_ID>\".\n4. Switch back to the administrator view.\n5. Open the same school and go to the Classes tab.\n6. Search for the class by name.","testData":"School: <SCHOOL_KEY> · Class name: \"AutoClass_TeacherView_<RUN_ID>\"","expected":"[ASSUMED] The class is created under the chosen school and, after step 6, is listed in that school's Admin Classes tab under the same name.","actual":"-","status":"Not Automated","remarks":"⚠️ CREATES REAL DATA — a real class on a real school. This decides suite placement absolutely: it must NOT sit in a side-effect-free suite. Use the sweepable \"AutoClass_\" prefix (admin-shared.md §A7) so leftovers are recognisable, and note that class DELETE is SOFT, so every run leaves a permanent soft-deleted row (§A5).\n⚠️ CHOOSING THE RIGHT \"Create class\" IS THE HARD PART. All 7 buttons in the teacher view share qid \"tDashboard-ncls-btn-1\", one per school group, and the qid cannot distinguish them. The button must be located THROUGH its school-group heading, or the class lands on the wrong school. A class literally named \"admin as a teacher class\" already exists under MQA Sierra School, suggesting this has been done manually before.\n⚠️ CLASS CREATION IS ASYNCHRONOUS (§A4) — the success dialog says it \"can take up to 12 hours\"; measured visibility ~24 s on a responsive Thor and >90 s on a loaded one. Step 6 must POLL, and the active-class count does NOT increment immediately, so never assert count + 1.\nTeacher-side creation itself is already automated (ENTE / CREA modules, createNewClass.page.js) — what is NOT covered anywhere is this CROSS-ROLE journey, which is the point of the case.\nThe teacher view groups by display name, so a school with a duplicate name is ambiguous here — pick a school with a UNIQUE name (§A5, TST_SADB_TC_6).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"38","id":"TST_INVI_TC_12","title":"Verify clicking a notification opens its target and clears it from the unread count","req":"#3 - Verify notifications","type":"Positive","priority":"Medium","preconditions":"Signed in as an administrator with at least one unread notification, the bell showing a count.","steps":"1. Record the unread badge count. 2. Open the notifications panel. 3. Click a notification whose target is known (e.g. a report-ready notification). 4. Confirm where it lands. 5. Re-open the panel and re-read the badge count and the item's read state.","testData":"An account with unread notifications; a report-ready notification if available.","expected":"The click navigates to the notification's target (a report-ready notification lands on the Reports tab), the item is marked read, and the unread badge count decreases by one. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_GEN_003, whose steps click a notification and mark it read. All five of our notification cases (TST_INVI_TC_7-TC_11) are about rendering - badge, grouping, dates, wording - and none clicks a row. TST_INVI_TC_7 already pairs the badge with its accessible name, so this closes the loop by proving the count actually changes. Mutates state (read status is not reversible) - keep out of side-effect-free suites.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"39","id":"TST_LIBR_TC_34","title":"Verify an MQA administrator does see the MQA/CQA restricted products","req":"#5 - Verify non mqa admin should not see cqa/mqa product","type":"Positive","priority":"Medium","preconditions":"An MQA-provisioned administrator account with access to a school holding MQA/CQA products.","steps":"1. Sign in as the MQA-provisioned administrator. 2. Open the school's Library tab. 3. Search for the restricted product by title and confirm it is listed.","testData":"MQA admin <MQA_ADMIN_ACCOUNT>; restricted product <MQA_RESTRICTED_PRODUCT>.","expected":"The MQA/CQA product is listed for the MQA administrator. [ASSUMED]","actual":"-","status":"Blocked","remarks":"Added 2026-09-01 from the other team's TC_GEN_005, whose step 3 is an explicit control check. TST_LIBR_TC_32 proves only the negative half - that restricted products are hidden from a non-MQA admin - which a defect hiding the product from everyone would also satisfy. The pair is what makes either half meaningful. This is the same structural point as TST_CLST_TC_24 on the Classes tab: a negative-only assertion cannot distinguish correct behaviour from over-blocking.","comments":"Blocked at design time (skill rule 4): needs an MQA-provisioned administrator account, the counterpart to the non-MQA account TST_LIBR_TC_32 is already waiting on. Unblock both together - one fixture request covers the pair.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"40","id":"TST_FOOT_TC_11","title":"Verify every admin footer link opens its intended destination","req":"#8 - Verify footer link","type":"Positive","priority":"Low","preconditions":"On any admin page with the footer visible.","steps":"1. Scroll to the footer and record every link it renders. 2. Click each link in turn. 3. Confirm the destination that opens and return. 4. Reconcile the set of links found against TST_FOOT_TC_10.","testData":"The footer links - the other team name Terms of use, Privacy notice, Accessibility, Our approach and FAQs.","expected":"Each footer link opens its intended destination and none is broken (no 404, no dead anchor). [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_GEN_008, which clicks each link and checks the destination. TST_FOOT_TC_10 asserts the footer renders seven links and omits Site Feedback - a presence check, not a navigation check. Reconcile the count while grounding: our register says seven links, theirs names five. One of the two is wrong; correct whichever it is and note the outcome here. Read-only, but links may open new tabs or external sites - handle that in automation.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"41","id":"TST_SADB_TC_8","title":"Verify data stays scoped to the active organisation when an admin manages several schools","req":"#11 - Verify different tab navigation","type":"Negative","priority":"High","preconditions":"An administrator with access to two or more schools, where each school holds at least one record (class, student, staff member, library product) that exists only in that school.","steps":"1. Sign in as the multi-org administrator and open school A. 2. On each tab - Classes, Students, Staff, Library - confirm every listed record belongs to school A, and specifically that school B's unique records are absent. 3. Switch to school B and repeat in the opposite direction. 4. Apply a search or filter in school A, then switch to school B, and confirm no results carry across.","testData":"Multi-org admin <MULTI_ORG_ADMIN>; unique records <A_ONLY_RECORD> and <B_ONLY_RECORD>.","expected":"Every tab shows only the active organisation's data. No record unique to the other school appears anywhere, and switching organisations does not carry search or filter results across. [ASSUMED]","actual":"-","status":"Blocked","remarks":"Added 2026-09-01 from the other team's TC_ORG_001, whose expected result ends \"with no cross-org data leakage\". TST_SADB_TC_3 proves each organisation loads independently; it does not prove one cannot see the other's data. Highest-severity gap of the entire comparison - a leak here is a data-privacy incident, not a UI defect, which is why this is High priority despite sitting in a thinly covered area. Step 4 exists because carried-over query state is the most likely mechanism for a leak.","comments":"Blocked at design time (skill rule 4): needs a multi-organisation admin fixture with records unique to each school, so that absence is provable rather than assumed. Unblock by provisioning two small schools under one admin with deliberately distinct data. NOTE: the multi-organisation area has no register of its own - if it grows beyond the SADB cases it should get one (see the 2026-09-01 handoff).","rawStatus":"Blocked","isImplemented":false,"implFiles":[]}]}]};

    let activeTabId = 'overview';
    let currentSearchTerm = '';
    let currentTypeFilter = 'ALL';
    let currentStatusFilter = 'ALL';
    let currentPrioFilter = 'ALL';

    function init() {
      renderTabs();
      renderActiveTab();
    }

    function renderTabs() {
      const nav = document.getElementById('tabsNav');
      let html = '';

      html += `
        <button class="tab-btn ${activeTabId === 'overview' ? 'active' : ''}" onclick="switchTab('overview')">
          🌐 Global Overview
          <span class="tab-badge">${DASHBOARD_DATA.global.total}</span>
        </button>
      `;

      DASHBOARD_DATA.modules.forEach(m => {
        html += `
          <button class="tab-btn ${activeTabId === m.id ? 'active' : ''}" onclick="switchTab('${m.id}')">
            📂 ${m.name}
            <span class="tab-badge">${m.total}</span>
          </button>
        `;
      });

      nav.innerHTML = html;
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      currentSearchTerm = '';
      currentTypeFilter = 'ALL';
      currentStatusFilter = 'ALL';
      currentPrioFilter = 'ALL';
      renderTabs();
      renderActiveTab();
    }

    function renderActiveTab() {
      const container = document.getElementById('tabContentArea');
      if (activeTabId === 'overview') {
        container.innerHTML = renderOverviewTab();
      } else {
        const mod = DASHBOARD_DATA.modules.find(m => m.id === activeTabId);
        container.innerHTML = renderModuleTab(mod);
      }
    }

    function renderOverviewTab() {
      const g = DASHBOARD_DATA.global;
      const mods = DASHBOARD_DATA.modules;

      let html = `
        <div class="kpi-grid">
          <div class="kpi-card" style="--accent-color: #38BDF8;">
            <div class="kpi-label">Total Test Cases</div>
            <div class="kpi-value">${g.total}</div>
            <div class="kpi-sub">Across ${mods.length} Configured Modules</div>
          </div>
          <div class="kpi-card" style="--accent-color: #10B981;">
            <div class="kpi-label">Verified Passed</div>
            <div class="kpi-value" style="color: #10B981;">${g.pass}</div>
            <div class="kpi-sub">${g.passPct}% Live Environment Pass Rate</div>
          </div>
          <div class="kpi-card" style="--accent-color: #0284C7;">
            <div class="kpi-label">Automated in Code</div>
            <div class="kpi-value" style="color: #38BDF8;">${g.automatedCode}</div>
            <div class="kpi-sub">${g.autoPct}% Playwright Code Coverage</div>
          </div>
          <div class="kpi-card" style="--accent-color: #F59E0B;">
            <div class="kpi-label">Blocked Test Cases</div>
            <div class="kpi-value" style="color: #F59E0B;">${g.blocked}</div>
            <div class="kpi-sub">Environment / Fixture Blockers</div>
          </div>
          <div class="kpi-card" style="--accent-color: #64748B;">
            <div class="kpi-label">Pending / Not Automated</div>
            <div class="kpi-value" style="color: #94A3B8;">${g.notAutomated}</div>
            <div class="kpi-sub">Ready in Manual Register</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">📊 Cross-Module Executive Rollup & Health Summary</div>
          </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Module</th>
                  <th>Prefix / Focus</th>
                  <th style="text-align: center;">Total</th>
                  <th style="text-align: center;">Pass</th>
                  <th style="text-align: center;">Blocked</th>
                  <th style="text-align: center;">Not Automated</th>
                  <th style="text-align: center;">Automated in Code</th>
                  <th style="width: 220px;">Health & Execution Status</th>
                </tr>
              </thead>
              <tbody>
      `;

      mods.forEach(m => {
        const passPct = ((m.pass / m.total) * 100).toFixed(0);
        const blkPct = ((m.blocked / m.total) * 100).toFixed(0);
        const notPct = ((m.notAutomated / m.total) * 100).toFixed(0);

        html += `
          <tr style="cursor: pointer;" onclick="switchTab('${m.id}')">
            <td><strong>${m.name}</strong></td>
            <td><span class="tc-code">${m.badge}</span></td>
            <td style="text-align: center; font-weight: 700;">${m.total}</td>
            <td style="text-align: center;"><span class="badge badge-pass">${m.pass}</span></td>
            <td style="text-align: center;"><span class="badge badge-blocked">${m.blocked}</span></td>
            <td style="text-align: center;"><span class="badge badge-notauto">${m.notAutomated}</span></td>
            <td style="text-align: center; font-weight: 600; color: #38BDF8;">${m.automatedCode} / ${m.total}</td>
            <td>
              <div class="progress-bar-wrap">
                <div class="progress-segment" style="width: ${passPct}%; background: var(--color-pass);" title="Pass: ${m.pass}"></div>
                <div class="progress-segment" style="width: ${blkPct}%; background: var(--color-blocked);" title="Blocked: ${m.blocked}"></div>
                <div class="progress-segment" style="width: ${notPct}%; background: rgba(255,255,255,0.15);" title="Not Automated: ${m.notAutomated}"></div>
              </div>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      return html;
    }

    function renderModuleTab(mod) {
      if (!mod) return '<div class="empty-state">Module not found</div>';

      const d = mod.typeDist;
      const filteredCases = applyFilters(mod.allCases);

      let html = `
        <div class="kpi-grid">
          <div class="kpi-card" style="--accent-color: #38BDF8;">
            <div class="kpi-label">Total Test Cases</div>
            <div class="kpi-value">${mod.total}</div>
            <div class="kpi-sub">${mod.badge}</div>
          </div>
          <div class="kpi-card" style="--accent-color: #10B981;">
            <div class="kpi-label">Pass Verified</div>
            <div class="kpi-value" style="color: #10B981;">${mod.pass}</div>
            <div class="kpi-sub">${((mod.pass / mod.total) * 100).toFixed(1)}% Pass Rate</div>
          </div>
          <div class="kpi-card" style="--accent-color: #0284C7;">
            <div class="kpi-label">Automated in Code</div>
            <div class="kpi-value" style="color: #38BDF8;">${mod.automatedCode}</div>
            <div class="kpi-sub">${((mod.automatedCode / mod.total) * 100).toFixed(1)}% Automated</div>
          </div>
          <div class="kpi-card" style="--accent-color: #F59E0B;">
            <div class="kpi-label">Blocked</div>
            <div class="kpi-value" style="color: #F59E0B;">${mod.blocked}</div>
            <div class="kpi-sub">Environment Blockers</div>
          </div>
          <div class="kpi-card" style="--accent-color: #64748B;">
            <div class="kpi-label">Not Automated</div>
            <div class="kpi-value" style="color: #94A3B8;">${mod.notAutomated}</div>
            <div class="kpi-sub">Pending Automation</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">📋 Test Case Distribution by Type (Positive / Edge / Negative)</div>
          </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Test Case Type</th>
                  <th style="text-align: center;">Count</th>
                  <th style="text-align: center;">Pass</th>
                  <th style="text-align: center;">Blocked</th>
                  <th style="text-align: center;">Not Automated</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><span class="badge badge-pos">🟢 Positive</span> (Happy path & feature workflows)</td>
                  <td style="text-align: center; font-weight: 700;">${d.positive.count}</td>
                  <td style="text-align: center;"><span class="badge badge-pass">${d.positive.pass}</span></td>
                  <td style="text-align: center;"><span class="badge badge-blocked">${d.positive.blocked}</span></td>
                  <td style="text-align: center;"><span class="badge badge-notauto">${d.positive.notAuto}</span></td>
                </tr>
                <tr>
                  <td><span class="badge badge-edge">🟡 Edge</span> (Boundary conditions, limits, max lengths)</td>
                  <td style="text-align: center; font-weight: 700;">${d.edge.count}</td>
                  <td style="text-align: center;"><span class="badge badge-pass">${d.edge.pass}</span></td>
                  <td style="text-align: center;"><span class="badge badge-blocked">${d.edge.blocked}</span></td>
                  <td style="text-align: center;"><span class="badge badge-notauto">${d.edge.notAuto}</span></td>
                </tr>
                <tr>
                  <td><span class="badge badge-neg">🔴 Negative</span> (Validation errors, rejected inputs)</td>
                  <td style="text-align: center; font-weight: 700;">${d.negative.count}</td>
                  <td style="text-align: center;"><span class="badge badge-pass">${d.negative.pass}</span></td>
                  <td style="text-align: center;"><span class="badge badge-blocked">${d.negative.blocked}</span></td>
                  <td style="text-align: center;"><span class="badge badge-notauto">${d.negative.notAuto}</span></td>
                </tr>
                <tr style="font-weight: 700; background: var(--bg-subtle);">
                  <td>TOTAL</td>
                  <td style="text-align: center;">${mod.total}</td>
                  <td style="text-align: center;">${mod.pass}</td>
                  <td style="text-align: center;">${mod.blocked}</td>
                  <td style="text-align: center;">${mod.notAutomated}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        ${renderBlockedSection(mod)}
        ${renderNotAutomatedSection(mod)}

        <div class="card">
          <div class="card-header">
            <div class="card-title">📑 Complete Test Case Registry (${filteredCases.length} / ${mod.total})</div>
          </div>

          <div class="filter-bar">
            <input type="text" class="search-input" placeholder="🔍 Search test case ID, title, requirement..." 
                   value="${currentSearchTerm}" oninput="onSearchChange(this.value)">
            
            <select class="filter-select" onchange="onTypeFilterChange(this.value)">
              <option value="ALL" ${currentTypeFilter==='ALL'?'selected':''}>All Types</option>
              <option value="Positive" ${currentTypeFilter==='Positive'?'selected':''}>Positive</option>
              <option value="Edge" ${currentTypeFilter==='Edge'?'selected':''}>Edge</option>
              <option value="Negative" ${currentTypeFilter==='Negative'?'selected':''}>Negative</option>
            </select>

            <select class="filter-select" onchange="onStatusFilterChange(this.value)">
              <option value="ALL" ${currentStatusFilter==='ALL'?'selected':''}>All Statuses</option>
              <option value="Pass" ${currentStatusFilter==='Pass'?'selected':''}>Pass</option>
              <option value="Blocked" ${currentStatusFilter==='Blocked'?'selected':''}>Blocked</option>
              <option value="Not Automated" ${currentStatusFilter==='Not Automated'?'selected':''}>Not Automated</option>
            </select>

            <select class="filter-select" onchange="onPrioFilterChange(this.value)">
              <option value="ALL" ${currentPrioFilter==='ALL'?'selected':''}>All Priorities</option>
              <option value="High" ${currentPrioFilter==='High'?'selected':''}>High</option>
              <option value="Medium" ${currentPrioFilter==='Medium'?'selected':''}>Medium</option>
              <option value="Low" ${currentPrioFilter==='Low'?'selected':''}>Low</option>
            </select>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 50px;">S.No.</th>
                  <th>Test Case ID</th>
                  <th>Title</th>
                  <th>Requirement</th>
                  <th style="text-align: center;">Type</th>
                  <th style="text-align: center;">Priority</th>
                  <th style="text-align: center;">Status</th>
                  <th>Automation Files</th>
                </tr>
              </thead>
              <tbody>
      `;

      if (filteredCases.length === 0) {
        html += '<tr><td colspan="8" class="empty-state">No matching test cases found.</td></tr>';
      } else {
        filteredCases.forEach((tc, idx) => {
          const typeBadge = tc.type === 'Positive' ? 'badge-pos' : tc.type === 'Edge' ? 'badge-edge' : 'badge-neg';
          const prioBadge = tc.priority === 'High' ? 'badge-p1' : tc.priority === 'Medium' ? 'badge-p2' : 'badge-p3';
          const statusBadge = tc.status === 'Pass' ? 'badge-pass' : tc.status === 'Blocked' ? 'badge-blocked' : 'badge-notauto';

          html += `
            <tr>
              <td>${idx + 1}</td>
              <td><span class="tc-code">${tc.id}</span></td>
              <td>
                <strong>${escapeHtml(tc.title)}</strong>
                ${tc.remarks !== '-' || tc.comments !== '-' ? `
                  <details class="tc-details">
                    <summary>View Notes & Expected Result</summary>
                    <div class="tc-detail-body">
                      ${tc.expected !== '-' ? `<div><strong>Expected:</strong> ${escapeHtml(tc.expected)}</div>` : ''}
                      ${tc.remarks !== '-' ? `<div><strong>Remarks:</strong> ${escapeHtml(tc.remarks)}</div>` : ''}
                      ${tc.comments !== '-' ? `<div><strong>Comments:</strong> ${escapeHtml(tc.comments)}</div>` : ''}
                    </div>
                  </details>
                ` : ''}
              </td>
              <td>${escapeHtml(tc.req)}</td>
              <td style="text-align: center;"><span class="badge ${typeBadge}">${tc.type}</span></td>
              <td style="text-align: center;"><span class="badge ${prioBadge}">${tc.priority}</span></td>
              <td style="text-align: center;"><span class="badge ${statusBadge}">${tc.status}</span></td>
              <td>${tc.implFiles.length > 0 ? tc.implFiles.map(f => `<span class="tc-code" style="font-size:11px;">${f}</span>`).join(' ') : '<span style="color:var(--text-dim);">-</span>'}</td>
            </tr>
          `;
        });
      }

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      return html;
    }

    function renderBlockedSection(mod) {
      if (mod.blockedCases.length === 0) return '';

      let html = `
        <div class="card" style="border-left: 4px solid var(--color-blocked);">
          <div class="card-header">
            <div class="card-title" style="color: var(--color-blocked);">
              🚫 Blocked Test Cases (${mod.blockedCases.length})
            </div>
          </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 50px;">S.No.</th>
                  <th>Test Case ID</th>
                  <th>Title</th>
                  <th style="text-align: center;">Type</th>
                  <th style="text-align: center;">Priority</th>
                  <th>Blocker Root Cause & Unblocking Strategy</th>
                </tr>
              </thead>
              <tbody>
      `;

      mod.blockedCases.forEach((tc, idx) => {
        const reason = tc.comments !== '-' ? tc.comments : tc.remarks;
        html += `
          <tr>
            <td>${idx + 1}</td>
            <td><span class="tc-code">${tc.id}</span></td>
            <td><strong>${escapeHtml(tc.title)}</strong></td>
            <td style="text-align: center;"><span class="badge ${tc.type === 'Edge' ? 'badge-edge' : 'badge-pos'}">${tc.type}</span></td>
            <td style="text-align: center;"><span class="badge badge-p2">${tc.priority}</span></td>
            <td style="line-height: 1.6; color: #FCD34D;">${escapeHtml(reason)}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      return html;
    }

    function renderNotAutomatedSection(mod) {
      if (mod.notAutomatedCases.length === 0) return '';

      let html = `
        <div class="card" style="border-left: 4px solid var(--c1-blue);">
          <div class="card-header">
            <div class="card-title" style="color: #38BDF8;">
              ⏸️ Not Automated Test Cases (${mod.notAutomatedCases.length})
            </div>
          </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width: 50px;">S.No.</th>
                  <th>Test Case ID</th>
                  <th>Title</th>
                  <th>Linked Requirement</th>
                  <th style="text-align: center;">Type</th>
                  <th style="text-align: center;">Priority</th>
                  <th>Remarks / Automation Roadmap</th>
                </tr>
              </thead>
              <tbody>
      `;

      mod.notAutomatedCases.forEach((tc, idx) => {
        const notes = tc.remarks !== '-' ? tc.remarks : tc.comments;
        const typeBadge = tc.type === 'Positive' ? 'badge-pos' : tc.type === 'Edge' ? 'badge-edge' : 'badge-neg';
        const prioBadge = tc.priority === 'High' ? 'badge-p1' : tc.priority === 'Medium' ? 'badge-p2' : 'badge-p3';

        html += `
          <tr>
            <td>${idx + 1}</td>
            <td><span class="tc-code">${tc.id}</span></td>
            <td><strong>${escapeHtml(tc.title)}</strong></td>
            <td>${escapeHtml(tc.req)}</td>
            <td style="text-align: center;"><span class="badge ${typeBadge}">${tc.type}</span></td>
            <td style="text-align: center;"><span class="badge ${prioBadge}">${tc.priority}</span></td>
            <td style="color: var(--text-muted); font-size: 13px;">${escapeHtml(notes)}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      return html;
    }

    function applyFilters(cases) {
      return cases.filter(tc => {
        const matchSearch = currentSearchTerm === '' ||
          tc.id.toLowerCase().includes(currentSearchTerm.toLowerCase()) ||
          tc.title.toLowerCase().includes(currentSearchTerm.toLowerCase()) ||
          tc.req.toLowerCase().includes(currentSearchTerm.toLowerCase()) ||
          tc.remarks.toLowerCase().includes(currentSearchTerm.toLowerCase());

        const matchType = currentTypeFilter === 'ALL' || tc.type === currentTypeFilter;
        const matchStatus = currentStatusFilter === 'ALL' || tc.status === currentStatusFilter;
        const matchPrio = currentPrioFilter === 'ALL' || tc.priority === currentPrioFilter;

        return matchSearch && matchType && matchStatus && matchPrio;
      });
    }

    function onSearchChange(val) {
      currentSearchTerm = val;
      renderActiveTab();
    }
    function onTypeFilterChange(val) {
      currentTypeFilter = val;
      renderActiveTab();
    }
    function onStatusFilterChange(val) {
      currentStatusFilter = val;
      renderActiveTab();
    }
    function onPrioFilterChange(val) {
      currentPrioFilter = val;
      renderActiveTab();
    }

    function exportCurrentViewCsv() {
      const mod = DASHBOARD_DATA.modules.find(m => m.id === activeTabId);
      const cases = mod ? mod.allCases : DASHBOARD_DATA.modules.flatMap(m => m.allCases);
      const filename = `C1App_${activeTabId}_QA_TestCases.csv`;

      let csv = 'Test Case ID,Title,Linked Requirement,Type,Priority,Status,Remarks,Comments\n';
      cases.forEach(c => {
        const clean = str => '"' + String(str || '').replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
        csv += `${clean(c.id)},${clean(c.title)},${clean(c.req)},${clean(c.type)},${clean(c.priority)},${clean(c.status)},${clean(c.remarks)},${clean(c.comments)}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
    }

    function escapeHtml(str) {
      if (!str) return '-';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
