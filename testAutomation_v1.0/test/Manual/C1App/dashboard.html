he pickers are the only input path.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"33","id":"TST_MRPT_TC_33","title":"Verify the custom date-range option is unavailable for report types that do not support it","req":"#12 — Verify Custom date range reports","type":"Negative","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Tick one class and click \"Continue\".\n2. Choose report type \"Assignments summary\" and observe the \"Date range\" radios.\n3. Repeat for \"Assignments detailed data\".\n4. Repeat for \"Estimated CEFR level\".","testData":"Report types: Assignments summary, Assignments detailed data, Estimated CEFR level","expected":"For all three types the \"Custom date range\" radio remains DISABLED and \"From the beginning\" stays selected — no \"From\"/\"To\" fields can be produced.","actual":"-","status":"Not Automated","remarks":"**[EXTRA — Phase 1 exclusion]** Not present in the other team's reviewed sheet (`Admin_Gap_Analysis.xlsx`, status \"Extra in Ours\"). **This case will NOT be automated in Phase 1** — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-26 across all seven types. Date range is supported by exactly four (Class summary, Class detailed data, Class daily data, Aggregated data), which matches the four named in scenario #12 — the scenario list is correct, and this case pins the negative half of it.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"34","id":"TST_MRPT_TC_34","title":"Verify the custom grade-settings option is offered and unticked by default for the report types that support it","req":"#13 — Verify reports with custom grade settings applied","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Tick one class and click \"Continue\".\n2. Choose report type \"Class summary\".\n3. Observe the checkbox labelled \"Only include items that contribute to grade calculation\".\n4. Repeat for Class detailed data, Class daily data, Aggregated data, Assignments summary and Assignments detailed data.","testData":"The six grade-capable report types","expected":"For all six types the checkbox \"Only include items that contribute to grade calculation\" is present, ENABLED and unticked by default.","actual":"-","status":"Pass","remarks":"Verified live 2026-08-26 across all seven types — exactly these six offer it, matching the six listed in scenario #13. This checkbox is the product's expression of \"custom grade settings applied (eg: exclude a component)\": the exclusion itself is configured on the class's Class grade settings page (module CGST), and this checkbox makes the report honour it.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"35","id":"TST_MRPT_TC_35","title":"Verify the created report is restricted to grade-contributing items when the custom grade option is ticked","req":"#13 — Verify reports with custom grade settings applied","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed. The chosen class has Class grade settings configured so that at least one component is excluded from grade calculation.","steps":"1. Tick a class whose grade settings exclude a component, and click \"Continue\".\n2. Choose report type \"Class summary\".\n3. Tick \"Only include items that contribute to grade calculation\".\n4. Click \"Submit\".\n5. Click \"Back to Reports\".\n6. Observe the new row's \"Items\" column.\n7. Download the report and compare its contents with the same report created without the option.","testData":"Class with an excluded component · Report type: Class summary · Custom grade option: ticked","expected":"[ASSUMED] The new Reports row shows an \"Items\" value other than \"All items\", reflecting the restriction, and the downloaded report omits the excluded component.","actual":"-","status":"Not Automated","remarks":"[ASSUMED] — the \"Items\" cell reads \"All items\" when the option is UNticked (verified live 2026-08-26); the ticked value was NOT captured. Listed in Open items. Also requires a class with an excluded component — verify one exists on VED-NEH-KVU or configure one via Class grade settings (CGST) first. CREATES REAL DATA.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"36","id":"TST_MRPT_TC_36","title":"Verify the custom grade-settings option is unavailable for the Estimated CEFR level report","req":"#13 — Verify reports with custom grade settings applied","type":"Negative","priority":"Medium","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Tick one class and click \"Continue\".\n2. Choose report type \"Estimated CEFR level\".\n3. Observe the \"Only include items that contribute to grade calculation\" checkbox.","testData":"Report type: Estimated CEFR level","expected":"The checkbox is DISABLED and cannot be ticked.","actual":"-","status":"Not Automated","remarks":"**[EXTRA — Phase 1 exclusion]** Not present in the other team's reviewed sheet (`Admin_Gap_Analysis.xlsx`, status \"Extra in Ours\"). **This case will NOT be automated in Phase 1** — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-26. Estimated CEFR level is the only one of the seven types supporting neither a custom date range nor custom grade settings — which is why it appears in neither scenario #12 nor #13.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"37","id":"TST_MRPT_TC_37","title":"Verify a Estimated CEFR level report is created and listed for download when \"From the beginning\" is selected","req":"#14 — Verify Estimated CEFR level report from beginning","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Select one class (e.g. \"Gated LP Class\", key 4mG6-9Jkf) using its row checkbox.\n2. Click \"Continue\" in the footer bar.\n3. In the \"Create report\" dialog open the \"Report type\" dropdown and choose \"Estimated CEFR level\".\n4. Leave \"Date range\" on the default \"From the beginning\".\n5. Leave \"Only include items that contribute to grade calculation\" unchecked.\n6. Click \"Submit\".\n7. Click \"Back to Reports\".","testData":"Class: \"Gated LP Class\" (4mG6-9Jkf) · Report type: \"Estimated CEFR level\" · Date range: From the beginning","expected":"After step 6 the confirmation dialog reads \"We are preparing your report\" and \"We will notify you when your Estimated CEFR level report is ready to download\", offering \"Create another report\" and \"Back to Reports\".\nAfter step 7 the Reports heading count increases by one and a new row carrying a \"New\" badge shows: Report type = \"Estimated CEFR level\"; Classes = 1; Students = 1; Items = \"All items\"; Date range = \"All student data (up to - <TODAY>)\"; Date created = <TODAY>; a file size; and a \"Download\" link.","actual":"-","status":"Pass","remarks":"IN SCOPE — confirmed with the requester on 2026-08-26 that this seventh report type was a genuine omission from AdminApp_Report tab.xlsx, not a deliberate exclusion. It is therefore treated as a first-class report-type scenario alongside #6–#11 rather than as added coverage. Its dropdown description reads \"Gives an indication of your students' level based on all tests submitted.\" Estimated CEFR level supports NEITHER a custom date range NOR custom grade settings (verified live 2026-08-26), so it is correctly absent from scenarios #12 and #13; those exclusions are pinned by TST_MRPT_TC_33 and TST_MRPT_TC_36. [ASSUMED] for the resulting Reports row — the report-type value and its availability were verified live, but the row was not; its shape is inherited from the grounded Class summary run. CREATES REAL DATA: a report on the school, auto-expiring after 60 days.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReportsCreate.test.js","adminSchoolReportsCreate.json"]},{"sNo":"38","id":"TST_MRPT_TC_38","title":"Verify the failure dialog is shown when report generation fails","req":"#15 — Added coverage: report generation error paths","type":"Negative","priority":"Medium","preconditions":"The class-selection step is open and the report-generation backend is forced to fail.","steps":"1. Tick one class and click \"Continue\".\n2. Choose any report type.\n3. Click \"Submit\" while report generation is failing.\n4. Observe the dialog.","testData":"—","expected":"A dialog is shown headed \"Sorry, something went wrong. The report you requested was not generated.\" offering \"Try again\" and \"Back to Reports\".","actual":"-","status":"Blocked","remarks":"**[EXTRA — Phase 1 exclusion]** Not present in the other team's reviewed sheet (`Admin_Gap_Analysis.xlsx`, status \"Extra in Ours\"). **This case will NOT be automated in Phase 1** — exclude it from the Phase 1 automation scope; revisit for a later phase. BLOCKED at design time. The copy above was captured verbatim from the PRE-RENDERED DOM on 2026-08-26 (admin-shared.md §A6 free-capture), so the expected result is verified even though the state was never reached. UNBLOCK: backend fault injection or a stubbed failure response. A second, separate failure surface exists on the Reports tab itself — see TST_MRPT_TC_39.","comments":"Blocked at design time — report generation failure cannot be forced on Thor.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"39","id":"TST_MRPT_TC_39","title":"Verify the partial-failure detail modal lists the excluded classes when a report is created with errors","req":"#15 — Added coverage: report generation error paths","type":"Negative","priority":"Medium","preconditions":"The Reports tab holds a report that was generated with per-class errors.","steps":"1. Open the Reports tab.\n2. Open the error detail for a report created with errors.\n3. Observe the modal.","testData":"—","expected":"A modal headed \"Report created with errors\" states \"<N> out of <TOTAL> classes were not included in your report due to the errors shown below\" above a table with the columns \"Class name\", \"Class key\" and \"Error message\", and offers \"Download report\".","actual":"-","status":"Blocked","remarks":"**[EXTRA — Phase 1 exclusion]** Not present in the other team's reviewed sheet (`Admin_Gap_Analysis.xlsx`, status \"Extra in Ours\"). **This case will NOT be automated in Phase 1** — exclude it from the Phase 1 automation scope; revisit for a later phase. BLOCKED at design time. Copy captured from the pre-rendered DOM on the Reports tab 2026-08-26. Requires a multi-class report in which some classes fail — cannot be produced on demand. UNBLOCK: fault injection, or a class deliberately placed in a state that fails report generation.","comments":"Blocked at design time — a partially-failing report cannot be produced on Thor.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"40","id":"TST_MRPT_TC_40","title":"Verify the class-selection filter offers class statuses only and no class-label filter","req":"#3 — Verify filter","type":"Positive","priority":"Medium","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Click \"Create report\" to reach the class-selection step.\n2. Open \"Filter\".\n3. Record every filter group the panel offers.\n4. Confirm no class-label group is present.","testData":"—","expected":"The filter panel offers EXACTLY ONE group — the five class statuses (\"Not started\", \"Active\", \"Ended\", \"Expired\", \"Deleted\") — and no class-label filter of any kind. The panel contains exactly five checkboxes in total.","actual":"-","status":"Pass","remarks":"REWRITTEN 2026-09-08 by user decision. Originally added 2026-09-01 from the other team's TC_REP_003, which describes a \"status/label filter\", and the case asked whether the filter narrows the list by class LABEL. Its own Remarks flagged the premise as unconfirmed and said GROUND FIRST. Grounded live 2026-09-08: the premise is FALSE — the report-flow panel offers five status checkboxes and no other group, so the other team's sheet is wrong on this point. The case is therefore inverted into an expected-versus-actual assertion that PINS the absence of a label filter. A class-label filter does exist on the Classes tab (TST_CLST_TC_4); the report flow does not reuse that panel. Read-only.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"41","id":"TST_MRPT_TC_41","title":"Verify a generated report contains data that reconciles with the class it was run against","req":"#6 — Verify Class summary report from beginning","type":"Positive","priority":"High","preconditions":"Logged in as the Reports school-admin; the FROZEN fixture class \"Automation_frozen_DND\" (gHoZ-iBXf) exists on VED-NEH-KVU with 2 enrolled students whose activity is known and unchanging.","steps":"1. Create a \"Class summary\" report over \"Automation_frozen_DND\" and return to the Reports tab.\n2. Wait for the new row to offer \"Download\", then download and unzip it.\n3. Locate each component's CSV by its Component COLUMN (not by filename or position).\n4. For the component that holds the activity (\"Project Work\"), reconcile every student row against the known activity.\n5. Confirm the components with no activity report none.","testData":"Class \"Automation_frozen_DND\" (gHoZ-iBXf). cqatestauto_stu1@mailsac.com performed 3 activities; cqatestauto_stu2@mailsac.com performed 1. Product total: 24 activities on the \"Project Work\" component.","expected":"The \"Project Work\" CSV holds one row per enrolled student, each carrying Class name \"Automation_frozen_DND\" and Class key \"gHoZ-iBXf\". cqatestauto_stu1 reports 3 activities completed of 24 (13%), best and first score average 72. cqatestauto_stu2 reports 1 of 24 (4%), best and first score average 67. The percentage is arithmetically consistent with completed/total in every row. Both students show a non-zero Time spent and a Last active value. The CSVs for \"Practice Extra\" and \"Practice Extra - Group Enabled\" report no completed activities and 00:00:00 time spent for either student.","actual":"-","status":"Pass","remarks":"UNBLOCKED AND AUTOMATED 2026-09-11 — the fixture was provisioned by the user specifically for this. THE POINT OF THIS CASE, and why it is worth the fixture: our eight generation cases (TST_MRPT_TC_21–TC_26, TC_28, TC_37) all stop at \"a row appeared in the list\", and TST_MRPT_TC_43 checks the file's structure and identity — a report generated with the WRONG NUMBERS passes all nine. This is the only case that reads the figures. The completed counts (3 and 1) are the one expectation here that did NOT come from the product: the user performed that activity and stated the counts BEFORE the report was read, and the report then agreed. That makes this a genuine correctness check; the score averages and totals are frozen snapshots and only catch regressions. The percentage is additionally asserted against its own arithmetic (round(completed/total*100)), which needs no frozen value and keeps working if the fixture is ever re-baselined. DELIBERATELY NOT ASSERTED AS VALUES: \"Time spent\" (00:02:40 / 00:00:50) and \"Last active\" (11-Sep-2026-11:10:18am / 11:13:12am) — both move the moment anyone opens the content, so only their presence or absence is checked. 🚨 NEVER MODIFY \"Automation_frozen_DND\": no enrolment changes, no material or grade-settings changes, and never log in as cqatestauto_stu1/stu2 and touch content. The day someone does, this case fails and it is NOT a product defect.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReportsCreate.test.js","adminSchoolReportsCreate.json"]},{"sNo":"42","id":"TST_MRPT_TC_42","title":"Verify a custom grade exclusion is respected consistently across every report type that supports it","req":"#13 — Verify reports with custom grade settings applied","type":"Edge","priority":"Medium","preconditions":"A class whose grade settings exclude one component or category from the grade, with known activity on the excluded item.","steps":"1. Configure the class grade settings to exclude one component/category.\n2. Generate each supported type with the custom grade option ticked: Class summary, Class detailed data, Class daily data, Aggregated data, Assignments summary, Assignments detailed data.\n3. In each output, confirm the excluded item is absent and the totals recompute without it.","testData":"Class <FROZEN_ACTIVITY_CLASS> with one component excluded from the grade.","expected":"All six report types consistently omit the excluded component and recompute their totals/averages without it. [ASSUMED]","actual":"-","status":"Blocked","remarks":"Added 2026-09-01 from the other team's TC_REP_014, which sweeps the exclusion across all six types. Our TST_MRPT_TC_35 proves the option takes effect on ONE report; consistency across types was untested — and inconsistency between report types is precisely the defect this guards against. Depends on the same fixture as TST_MRPT_TC_41.","comments":"Blocked at design time. The frozen-activity fixture it needed NOW EXISTS (Automation_frozen_DND / gHoZ-iBXf, provisioned 2026-09-11 and used by TST_MRPT_TC_41), so the remaining blocker is narrower than it was: that class still needs ONE COMPONENT EXCLUDED from its grade settings, and activity on the excluded item. Once that is configured this case can follow TST_MRPT_TC_41 directly.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"43","id":"TST_MRPT_TC_43","title":"Verify the downloaded report file is well formed and contains the right class and students","req":"#6 — Verify Class summary report from beginning","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Create a \"Class summary\" report over the fixture class and return to the Reports tab.\n2. Wait for the new row to offer \"Download\", then click it.\n3. Unzip the downloaded archive.\n4. Open each CSV inside it and check the header row and the data rows.","testData":"Class: \"Automation_class_DND\" (z698-JPfC), 2 students: cqa_stu8sept@mailsac.com, cqa_student12jan@mailsac.com","expected":"The download is a ZIP containing at least one CSV, one per product component, named \"<product> <component>_<DD-MMM-YYYY>_<report type> report.csv\". Every CSV has 19 columns beginning with the fixed identity block \"First name, Last name, Email, Username, Class name, Class key, Product, Component\". Every data row carries Class name \"Automation_class_DND\" and Class key \"z698-JPfC\". Each CSV holds exactly one row per enrolled student (2), and the set of Email values equals the class roster.","actual":"-","status":"Pass","remarks":"ADDED 2026-09-11 after a real report was downloaded and inspected — the first case in this register to look INSIDE the file. Until now every generation case (TST_MRPT_TC_21–TC_26, TC_28, TC_37) stopped at \"a row appeared in the list\", so a report generated with entirely wrong CONTENT passed all of them. This case closes the structural half of that gap: empty file, corrupt ZIP, wrong class, a missing student, or changed columns are all now caught. It does NOT reconcile the activity NUMBERS (scores, completion, time spent) — that still needs the frozen-activity fixture and remains TST_MRPT_TC_41, which stays Blocked. TWO THINGS ARE DELIBERATELY NOT ASSERTED: (1) the exact label of column 14, which varies by component — observed as \"Best attempts above target score (Gold Medals)\" on two CSVs and \"Best attempts above target score\" on the third; (2) the NUMBER of CSVs, which follows the product's component count and would fail on a product change rather than a defect. Runs in the data-owning suite because a report must exist before it can be downloaded.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReportsCreate.test.js","adminSchoolReportsCreate.json"]}]},{"folder":"AdminApp-Library","id":"adminapp-library","name":"Library Tab","badge":"SLIB","file":"AdminApp_Library_tab_test_cases.xlsx","total":42,"pass":0,"blocked":0,"notAutomated":42,"fail":0,"automatedCode":16,"typeDist":{"positive":{"count":17,"pass":0,"blocked":0,"notAuto":17},"edge":{"count":19,"pass":0,"blocked":0,"notAuto":19},"negative":{"count":6,"pass":0,"blocked":0,"notAuto":6}},"prioDist":{"high":15,"medium":20,"low":7},"blockedCases":[],"notAutomatedCases":[{"sNo":"1","id":"TST_LIBR_TC_1","title":"Verify the Library tab renders its heading, count, search bar, sort control and School licence section when opened from the left nav","req":"— Library tab load (added, not in source)","type":"Positive","priority":"High","preconditions":"Logged in as school-admin (testt1@mailsac.com) on Thor; school FCN-CHZ-PDA \"3 July Test School 1\" already opened from My school accounts (school context MUST be set by clicking the school card).","steps":"1. From the school page, note the count shown on the left-nav LIBRARY tab.\n2. Click the LIBRARY tab.\n3. Wait for the product list to render.\n4. Observe the page heading, the search bar, the Sort by control and the School licence section.","testData":"School key FCN-CHZ-PDA · left-nav Library count at time of capture: 970","expected":"1. URL becomes /admin/admin/org_perf_testschool_1/library and the browser tab reads \"Library | Cambridge One\".\n2. The h2 heading reads \"Library (N)\" where N EQUALS the count on the left-nav LIBRARY tab.\n3. A search box with placeholder \"Search by title\" and an enabled \"Search\" button are present.\n4. A \"Sort by:\" label with a \"Title\" control is present.\n5. The \"School licence\" section is present above the product list, with the description \"Here are the materials that students can access when added to a class and all teachers can access in their library\".\n6. Every product row shows the product title and a \"See materials\" link.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Count is environment- and time-specific — assert heading count EQUALS left-nav count, never an absolute number (admin-shared.md §A5). List render measured at ~5.1 s for 970 products on Thor 2026-08-24; budget generously.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"2","id":"TST_LIBR_TC_2","title":"Verify the product list is sorted by title in ascending order when the Library tab first loads","req":"#1 — Verify Sort feature","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA with a populated product list.","steps":"1. Open the Library tab.\n2. Read the titles of the first and last products in the list, and capture the full ordered list of titles.","testData":"None — read-only","expected":"1. The list is sorted A→Z by title, compared case-insensitively.\n2. At capture the first three were \"(Do Not Edit) sj11042501\", \"(DO NOT USE) nonmqa_umbrella_do_not_use\", \"3 Level TOC Compass Umbrella\" and the last was \"yaminitestproduct1\".\n3. The \"Sort by: Title\" control is displayed and marked active.","actual":"-","status":"Not Automated","remarks":"Named titles are Thor/FCN-CHZ-PDA specific — the durable assertion is \"list equals itself sorted case-insensitively ascending\", not the literal titles.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"3","id":"TST_LIBR_TC_3","title":"Verify the product list reverses to descending order when the Sort by Title control is clicked once","req":"#1 — Verify Sort feature","type":"Positive","priority":"High","preconditions":"Library tab open, list in its default A→Z order.","steps":"1. Capture the ordered list of product titles.\n2. Click the \"Title\" control next to \"Sort by:\".\n3. Capture the ordered list of titles again.","testData":"None — read-only","expected":"1. The list re-renders in Z→A order — it is the exact reverse of the list captured in step 1.\n2. The product COUNT is unchanged (no products are added or dropped by sorting).\n3. At capture the first three became \"yaminitestproduct1\", \"Y Test Product\", \"vm_automation_testing_108\".","actual":"-","status":"Not Automated","remarks":"Sorting is client-side and immediate — no page reload.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"4","id":"TST_LIBR_TC_4","title":"Verify the product list returns to ascending order when the Sort by Title control is clicked a second time","req":"#1 — Verify Sort feature","type":"Positive","priority":"Medium","pr orting, and the \"Showing search results for vm_automation.\" banner remains.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Result count is data-dependent — assert that the count is unchanged by sorting, not 22. NOTE: sorting reorders the whole result set alphabetically, which overrides the relevance ranking of TST_LIBR_TC_21. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"8","id":"TST_LIBR_TC_8","title":"Verify the sort control is not rendered when a search returns no results","req":"#1 — Verify Sort feature","type":"Edge","priority":"Low","preconditions":"Library tab open.","steps":"1. Search for a term that matches no product (e.g. zzqqxx9999).\n2. Inspect the area where \"Sort by: Title\" normally appears.","testData":"Search term: zzqqxx9999","expected":"1. The no-results message is shown.\n2. The \"Sort by:\" label and \"Title\" control are NOT present in the page — there is nothing to sort.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Genuinely removed from the DOM in this state (verified 2026-08-24), so a presence check is truthful here — unlike most admin dialogs (admin-shared.md §B2).","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"9","id":"TST_LIBR_TC_9","title":"Verify the sort control indicates the current sort direction to the user","req":"#1 — Verify Sort feature","type":"Negative","priority":"Medium","preconditions":"Library tab open in the default A→Z order.","steps":"1. Observe the \"Sort by: Title\" control and record its label, any icon, and its styling.\n2. Click \"Title\" to switch to Z→A.\n3. Observe the control again and compare.","testData":"None — read-only","expected":"EXPECTED: the control communicates the active direction — e.g. an ascending/descending arrow, a changed label, or an aria-sort value — so a user can tell A→Z from Z→A without reading the list.\n\nACTUAL (Thor, re-verified 2026-08-26): the control is byte-for-byte IDENTICAL in both states. Captured before and after a single click:\n  <a qid=\"aLibrary-3\" href=\"javascript:void(0);\" class=\"list-info ml-2 sort-by-title-btn active\">Title</a>\n  · label \"Title\" unchanged · class unchanged (note \"active\" is present in BOTH states — it means \"this is the sort in use\", not a direction) · ZERO child elements, so there is no icon to rotate · aria-sort, aria-label and title all ABSENT.\nThe list itself did flip (first item \"(Do Not Edit) sj11042501\" → \"yaminitestproduct1\"), so sorting works — only the indicator is missing.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. STATUS: acknowledged as a VALID concern by the user 2026-08-26 — RECORDED AS A REMARK FOR NOW, deliberately NOT raised as a defect ticket yet. Revisit before the batch is signed off. Two separable halves: (a) the missing visual arrow may be a deliberate design choice; (b) the missing aria-sort is an ACCESSIBILITY gap — a screen-reader user has no way at all to learn the sort direction — and stands on its own regardless of (a). Evidence re-captured live 2026-08-26 by comparing the full outerHTML before and after a click; they are identical. AUTOMATION NOTE: assert list ORDER, never the control's class or text — the control genuinely cannot distinguish the two states.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"10","id":"TST_LIBR_TC_10","title":"Verify the searched product is returned as the first result when its full exact title is searched","req":"#4 — Verify search by title","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA; the automation-owned product vm_automation_book101 present in the library.","steps":"1. Type the full title \"vm_automation_book101\" into \"Search by title\".\n2. Click Search.\n3. Wait for the list to settle and read the results in order.","testData":"Search term: vm_automation_book101 (10 results at capture, 2026-08-26)","expected":"1. \"vm_automation_book101\" is returned as the FIRST result.\n2. The heading changes to \"Library\" followed by \"Showing search results for vm_automation_book101.\" and a \"Clear\" link.\n3. Further close-match products are listed after it — an exact-title search still returns a fuzzy tail (see TST_LIBR_TC_21). Do NOT expect exactly one result.\n4. Every result row still shows its title and a \"See materials\" link.","actual":"-","status":"Not Automated","remarks":"Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26] Assert RANK 1, not the result count — the tail length is data-dependent (10 at capture). Search settles ~1.0 s.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"11","id":"TST_LIBR_TC_11","title":"Verify all products whose title contains the term are returned first when a partial title is searched","req":"#4 — Verify search by title","type":"Positive","priority":"High","precondit ntify which titles contain the term and which do not.\n4. Check where the boundary between the two falls.","testData":"Search term: vm_automation (22 results at capture — 2 contain the term, 20 are close matches)","expected":"1. The results contain BOTH exact substring matches and close matches whose titles do NOT contain the term — e.g. \"automation thor product(Do not touch)\", \"cqaautomationbundle1\", \"Bulk Activation - Test Umbrella 1\", \"Visible prior to activation other comps\".\n2. Every substring match ranks ABOVE every close match — the leading results are the true title matches, and the close matches follow.\n3. The search never returns zero results while a substring match exists.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. CONFIRMED INTENDED BEHAVIOUR by the product team [2026-08-26] — the search is deliberately fuzzy, so a rough or mistyped term still finds something. Originally written as a defect; RECLASSIFIED from Negative to Edge. AUTOMATION: never assert that every result contains the term — that fails against the live product. Assert the RANKING instead (substring matches first), which held across every term tried on 2026-08-26. Uses products created by our own automation (vm_automation_*) rather than another team's data, so the expected ranking stays stable as the shared school changes. [user decision, 2026-08-26]","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"22","id":"TST_LIBR_TC_22","title":"Verify a whitespace-only search term is treated as an empty search rather than as a searchable term","req":"#4 — Verify search by title","type":"Negative","priority":"Low","preconditions":"Library tab open with the full list shown.","steps":"1. Type three spaces into \"Search by title\".\n2. Click Search.\n3. Read the heading and the result list.","testData":"Search term: \"   \" (three spaces)","expected":"EXPECTED: the term is trimmed and treated as empty, so the full product list is retained (consistent with TST_LIBR_TC_15).\n\nACTUAL (Thor, 2026-08-24) — DEFECT: the term is NOT trimmed. Zero products are returned and the banner renders the raw spaces — \"Showing search results for   .\" — leaving a visible gap before the full stop and giving the user no readable indication of what was searched.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Low user impact but a clear input-handling gap. The same trimming question applies to leading/trailing spaces around a real term — not yet tested, worth adding once the trimming behaviour is decided.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"23","id":"TST_LIBR_TC_23","title":"Verify the School licence section lists one tile per school licence held by the school","req":"#3 — Verify School licence appear in school licence section","type":"Positive","priority":"High","preconditions":"Library tab open on FCN-CHZ-PDA, which holds 3 school licences at capture.","steps":"1. Open the Library tab.\n2. Locate the \"School licence\" section above the product list.\n3. Read its heading, description and the tiles it contains.","testData":"School key FCN-CHZ-PDA · 3 licences at capture: \"R55 Multi Component Umbrella\", \"presentation_plus_test_umb_product_2_june_1\", \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\"","expected":"1. The section heading reads VERBATIM \"School licence\".\n2. The description reads VERBATIM \"Here are the materials that students can access when added to a class and all teachers c TE_LICENCE_TITLE>.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"25","id":"TST_LIBR_TC_25","title":"Verify the product materials view opens when a School licence tile is clicked","req":"#3 — Verify School licence appear in school licence section","type":"Positive","priority":"High","preconditions":"Library tab open with at least one School licence tile displayed.","steps":"1. Click the School licence tile for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. Wait for the page to load.\n3. Read the URL and the page heading.","testData":"Licence tile: testumbrellabundlevery_longname_tocheck_wrapping_oftext (product id testumbrellabundle)","expected":"1. The browser navigates to /dashboard/teacher/org_perf_testschool_1/bundle/<productId>/view.\n2. The h1 heading equals the licensed product's title.\n3. The browser tab title reads \"<product title> | Cambridge One\".\n4. This is the SAME destination reached by \"See materials\" on that product's row in the list below.","actual":"-","status":"Not Automated","remarks":"Note the destination leaves the admin app and lands on the TEACHER dashboard route. See TST_UMBP_TC_10 — the \"Back\" control on that page does not return to the Library tab.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["schoolLibrary.test.js","adminSchoolLibrary.json"]},{"sNo":"26","id":"TST_LIBR_TC_26","title":"Verify an expired school licence is still listed and is marked with \"Expired\" and a warning icon","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Medium","preconditions":"Library tab open on a school holding at least one licence whose expiry date has passed (FCN-CHZ-PDA holds two at capture).","steps":"1. Locate the School licence tile for \"R55 Multi Component Umbrella\".\n2. Read the date line and note any icon.\n3. Confirm the tile is still listed in the section.","testData":"Expired licences at capture: \"R55 Multi Component Umbrella\" (Expired Jan 7, 2026), \"presentation_plus_test_umb_product_2_june_1\" (Expired Jan 31, 2026)","expected":"1. The expired licence is STILL listed in the School licence section — it is not hidden.\n2. Its date line reads \"Expired <Mon D, YYYY>\" — past tense — e.g. \"Expired Jan 7, 2026\".\n3. A warning/error icon (error.svg, class \"school-licence-icon\") is rendered immediately before the date, which the in-date tile does not have.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. The icon carries alt=\"\" so its meaning is not exposed to screen-reader users — an accessibility observation worth raising separately. Verified live 2026-08-24.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"27","id":"TST_LIBR_TC_27","title":"Verify products held under a school licence also appear in the main Library product list","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Medium","preconditions":"Library tab open with the School licence section populated.","steps":"1. Record the title of each School licence tile.\n2. For each recorded title, search for it (or scan the full list) in the product list below.","testData":"3 licence titles at capture","expected":"1. EVERY school-licence product title is ALSO present as a row in the main product list.\n2. The School licence section is an additional highlight of those products, not a separate inventory — so the products are not double-counted or omitted from \"Library (N)\".","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 — all 3 licence titles found among the 970 list rows. ⚠️ IMPORTANT CONTEXT ADDED 2026-08-26: the main product list is CATALOGUE-WIDE, not licence-driven. Perf Test School 4 · key ACJ-DXL-JKR · org slug org_perf_testschool_4 holds ZERO licences and still lists the SAME 970 products as FCN-CHZ-PDA, which holds 3 (see TST_LIBR_TC_30). So a licensed product appearing in the list proves nothing about licensing — the list would contain it either way. Do not read this case as evidence that the list is derived from licences.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"28","id":"TST_LIBR_TC_28","title":"Verify a placeholder is rendered on a School licence tile when the product has no cover image","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Low","preconditions":"Library tab open on a school holding a licence for a product with no cover image (at capture: \"R55 Multi Component Umbrella\").","steps":"1. Locate the School licence tile for \"R55 Multi Component Umbrella\".\n2. Compare its image area with a tile whose product does have a cover image.","testData":"No-image licence at capture: R55 Multi Component Umbrella","expected":"1. The tile renders an empty placeholder block (element with class \"no-image-container\") in place of the cover image.\n2. No broken-image icon and no alt-text fallback string is shown.\n3. The tile's title and date line stay correctly aligned — the layout does not collapse.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. The same placeholder is used on rows in the main product list. Verified in the DOM live 2026-08-24; the visual alignment claim is [ASSUMED] — confirm by eye or by a visual snapshot during automation.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"29","id":"TST_LIBR_TC_29","title":"Verify a very long product title wraps inside its School licence tile without overflowing","req":"#3 — Verify School licence appear in school licence section","type":"Edge","priority":"Low","preconditions":"Library tab open on a school holding a licence for a product with a long, unbroken title (at capture: \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\", 55 characters).","steps":"1. Locate the School licence tile for the long-titled product.\n2. At desktop width (~1046 px viewport), observe how the title renders inside the tile.\n3. Narrow the browser to ~400 px and observe it again.\n4. Check whether the title stays inside its tile, and whether the page gains a horizontal scrollbar.","testData":"Long title: testumbrellabundlevery_longname_tocheck_wrapping_oftext (55 chars)","expected":"1. The title WRAPS onto multiple lines inside the tile — measured 3 lines at ~1046 px and 2 lines at 400 px (line height 24 px).\n2. The title never overflows its tile: at both widths the title's right edge stays inside the tile's right edge, and the text does not overflow its own box (scrollWidth == clientWidth).\n3. The title container carries class \"card-title word-wrap\" with computed word-break: break-word, which is what produces the wrapping.\n4. The date line stays below the title and remains readable.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. VERIFIED LIVE 2026-08-26 (previously [ASSUMED] — the word-wrap class had been read from the DOM but the rendering was never measured). Measurements: desktop viewport 1046 px → tile 327 px, title 229 px, 3 lines; narrow viewport 400 px → tile 351 px, title 261 px, 2 lines; overflowsTileRight false and textOverflowsOwnBox false at BOTH widths. ⚠️ SCOPE: this case covers the SCHOOL LICENCE TILE only. The main product-list rows behave DIFFERENTLY and do overflow at narrow widths — see TST_LIBR_TC_31. Do not generalise this result to the list. ⚠️ TITLE CHURN: this product was RENAMED on the shared school between 2026-08-24 and 2026-08-26 (was \"testumbrellabundleverylongnametocheckwrappingoftext\", now \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\"). Treat the literal title as <LONG_TITLE_PRODUCT> and re-read it at run time rather than hard-coding it.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"30","id":"TST_LIBR_TC_30","title":"Verify the School licence section is not rendered at all when the school holds no school licence","req":"#3 — Verify School licence appear in school licence section","type":"Negative","priority":"Medium","preconditions":"Logged in as school-admin on Thor; a school that holds ZERO school licences — use Perf Test School 4 · key ACJ-DXL-JKR · org slug org_perf_testschool_4.","steps":"1. From My school accounts, open the school BY KEY ACJ-DXL-JKR (\"Perf Test School 4\").\n2. Click the LIBRARY tab and wait for the product list to render.\n3. Look at the area between the search bar and the \"Sort by:\" control, where the School licence section sits on a licensed school.\n4. Search the page for the text \"School licence\".\n5. Confirm the rest of the tab still works — heading count, search box, sort control, product rows.","testData":"School key ACJ-DXL-JKR (\"Perf Test School 4\", org_perf_testschool_4) — 0 school licences, 970 products at capture","expected":"1. The School licence section is ABSENT ENTIRELY — no container, no tiles, and NO empty-state message replaces it. The product list begins immediately after the \"Sort by: Title\" control.\n2. The text \ st rendered; browser resizable.","steps":"1. Open the Library tab at desktop width and confirm there is no horizontal scrollbar.\n2. Narrow the browser window to ~400 px wide.\n3. Scroll down the main product list to a row with a long unbroken title, e.g. \"blue_umb_auto_update_test_15_feb_1_updated_1\".\n4. Check whether that row's title stays inside the page width.\n5. Check whether the PAGE has gained a horizontal scrollbar.","testData":"Viewport 400 px · rows with long titles, e.g. blue_umb_auto_update_test_15_feb_1_updated_1, blue_umb_multi_book_download_test_30_nov_1","expected":"EXPECTED: long titles in the product list wrap within the available width — the same behaviour the School licence tile already shows (TST_LIBR_TC_29) — and the page never scrolls horizontally.\n\nACTUAL (Thor, 2026-08-26) — DEFECT: the list rows do NOT wrap and push past the page edge. At a 385 px document width the page scrollWidth was 607 px, and 22 elements extended beyond the right edge. The row title \"blue_umb_auto_update_test_15_feb_1_updated_1\" measured 334 px wide with its right edge at 414 px, against a 385 px document. The whole page therefore scrolls sideways.\n\nROOT CAUSE (from computed styles): the School licence tile's title sits in \"card-title word-wrap\" with word-break: break-word, so it wraps. The list row's title (span.item-text) has word-break: normal and only overflow-wrap: break-word, which does NOT break a long unbroken token in this layout. The two are styled inconsistently.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. FOUND 2026-08-26 while verifying TST_LIBR_TC_29 — the licence tile wraps correctly, which is what made the list's behaviour stand out. NOT in the source scenario list; added because it is a real plemented":true,"implFiles":["schoolLibrary.test.js","umbrellaProduct.test.js","adminSchoolLibrary.json"]},{"sNo":"33","id":"TST_UMBP_TC_2","title":"Verify every component of a multi-component umbrella product is listed under Learning materials","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Positive","priority":"High","preconditions":"Product materials view open for a multi-component umbrella product.","steps":"1. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. Count the component tiles under \"Learning materials\".\n3. Record the component TYPE label and component NAME shown on each tile.","testData":"Product testumbrellabundle — 15 components at capture","expected":"1. One tile is rendered per component of the umbrella — 15 at capture.\n2. Distinct component TYPES are all represented, covering at capture: Test1, Practice Extra (ankur), Project Work updated, Student Resource Bank, Test Generator, Presentation Plus, Downloadable Asset, Resource Bank (Teacher), External Resources, Unit Progress Test, ebook components (\"cqa teacher only book\", \"Student and teacher both paid ebook\", \"Student paid and teacher free ebook\") and Practice Extra.\n3. No component type is silently omitted from the view.","actual":"-","status":"Not Automated","remarks":"AUTOMATION TRAP: every component container shares the SAME qid \"t-prd-cmp-cntr-1\" — the qid is NOT unique per tile and cannot address an individual component. Select structurally by index or by the component's text. Verified live 2026-08-24 (12 identical qids on the R55 product, 15 on this one).","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["umbrellaProduct.test.js","adminSchoolLibrary.json"]},{"sNo":"34","id":"TST_UMBP_TC_3","title":"Verify each component tile shows its component type and its component name","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Positive","priority":"High","preconditions":"Product materials view open for a multi-component umbrella product.","steps":"1. Open \"See materials\" for \"testumbrellabundlevery_longname_tocheck_wrapping_oftext\".\n2. For each component tile, read the first line and the second line.","testData":"Product testumbrellabundle","expected":"1. The first line of each tile is the component TYPE, e.g. \"Practice Extra (ankur)\", \"Student Resource Bank\", \"Test Generator\", \"Presentation Plus\", \"Downloadable Asset\".\n2. The second line is the component's own NAME where it has one, e.g. type \"Test Generator\" / name \"Test Generator - updated\", type \"Test1\" / name \"multiumbrellatest1\".\n3. A component with no distinct name shows the type line alone, e.g. \"Unit Progress Test\" — the tile is still rendered and is not blank.","actual":"-","status":"Not Automated","remarks":"Captured verbatim live 2026-08-24, e.g. \"Practice Extra (ankur)\\nsd\\nSchool licence active\\nStarted: Jul 5, 2024 Expires: Jul 4, 2029\".","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["umbrellaProduct.test.js","adminSchoolLibrary.json"]},{"sNo":"35","id":"TST_UMBP_TC_4","title":"Verify the product materials view shows the Back, Add to a class and Activate materials controls","req":"#2 — Verify See Materials for an umbrella product - All types of components","type":"Positive","priority":"Medium","preconditions":"Product materials view open for an umbrella product.","steps":"1. Open \"See materials\" for any umbrella product.\n2. Inspect the header area above the component list.","testData":"Products: testumbrellabundle · r55multicomponent","expected":"1. A \"Back\" control is present at the top of the page.\n2. The product title is displayed as the h1.\n3. An \"Add to a class\" control is present.\n4. A \"Learning materials\" heading and an \"Activate materials\" control are present.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in
