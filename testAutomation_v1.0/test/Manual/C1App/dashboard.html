ew Profile > Manage account","type":"Edge","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. The school holds more than 50 students.","steps":"1. Select 51 or more students.\n2. Click \"Remove from school account\".","testData":"51+ selected students","expected":"The removal is refused and a dialog reads, verbatim: \"You can only remove 50 students at one time\" / \"Please uncheck some students to continue\", with a single \"Close\" action.","actual":"-","status":"Blocked","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. BLOCKED at design time on FCN-CHZ-PDA — the school holds 26 students, so 51 cannot be selected. The modal copy is nevertheless verified word for word from the pre-rendered DOM (2026-08-22), so this case is short work once a school with 51+ students exists. Unblocked by <SCHOOL_WITH_51_PLUS_STUDENTS>.","comments":"Blocked at design time. The 50-student removal cap needs 51+ students selected; FCN-CHZ-PDA holds 26. Modal copy is already verified word for word from the pre-rendered DOM, so this is short work once a larger school exists.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"46","id":"TST_SPRF_TC_21","title":"Verify Remove from school account is disabled while no student is selected","req":"#22 — Verify remove from school account: View Profile > Manage account","type":"Edge","priority":"Low","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. With no rows ticked, read the \"0 Selected\" label and the Remove button.","testData":"-","expected":"The counter reads \"0 Selected\" and the \"Remove from school account\" button is disabled.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-22 — natively disabled.","comments":"-","rawStatus":"Not Run","isImplemented":true,"implFiles":["studentProfile.test.js"]},{"sNo":"47","id":"TST_SPRF_TC_22","title":"Verify cancelling the removal confirmation leaves the student in the school","req":"#22 — Verify remove from school account: View Profile > Manage account","type":"Negative","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. One student is selected and the confirmation dialog is open.","steps":"1. Click \"Cancel\".\n2. Reload the Students tab and search for the student.","testData":"<DISPOSABLE_STUDENT>","expected":"[ASSUMED] The dialog closes, nothing is submitted, and the student is still listed.","actual":"-","status":"Not Automated","remarks":"Not run 2026-08-22 (would require opening a destructive dialog against a real shared account). Also confirm whether the row selection survives the cancel.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"48","id":"TST_SBLK_TC_1","title":"Verify new CHILD student accounts can be added to classes in bulk","req":"#17 — Verify Bulk feature > Add new students to classes children","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class already exists in the school.","steps":"1. Click \"Manage students\" > \"Add new students to classes\".\n2. On the chooser select \"Children\" and click \"Next\".\n3. Download the CSV template, populate it and upload it.\n4. Complete the form and submit.","testData":"Child CSV in the real template format — headers as documented for the child page in product-knowledge/ExperienceApp.md (Student’s First name, Student’s Last name, …). File: TST_SBLK_TC_1_children.csv","expected":"The chooser page /admin/admin/org_<slug>/learner/select/new is shown, headed with the Children and Adults options and carrying the notice \"Important: Classes must be created before setting up student accounts\". Choosing Children and Next opens the child bulk-creation form; the CSV populates it; submitting creates the accounts. [ASSUMED beyond the chooser — see Remarks.]","actual":"-","status":"Not Automated","remarks":"CREATES REAL DATA. Grounded live only as far as the chooser (2026-08-22). The downstream child CSV page is already documented from the NEMO-24306 work in product-knowledge/ExperienceApp.md — reuse that knowledge and its verified validation messages rather than re-deriving them.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"49","id":"TST_SBLK_TC_6","title":"Verify the account-type chooser cannot be advanced without a selection","req":"#17 — Verify Bulk feature > Add new students to classes children","type":"Edge","priority":"Low","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Click \"Manage students\" > \"Add new students to classes\".\n2. Without selecting Children or Adults, click \"Next\".","testData":"-","expected":"[ASSUMED] Next is disabled, or clicking it surfaces a “choose an option” prompt, and the admin stays on the chooser.","actual":"-","status":"Not Automated","remarks":"Not run 2026-08-22 — the radio state on first load was not recorded. Confirm during Phase 1; the same case applies to both downstream choosers.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"50","id":"TST_SBLK_TC_2","title":"Verify new ADULT accounts that log in with a username can be created in bulk","req":"#18 — Verify Bulk feature > Add new students to classes adult with username","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class already exists in the school.","steps":"1. Click \"Manage students\" > \"Add new students to classes\".\n2. Select \"Adults\" and click \"Next\".\n3. On the second chooser select \"Create adult student accounts\" and click \"Next\".\n4. Populate and upload the CSV, then submit.","testData":"Adult CSV in the real template format. File: TST_SBLK_TC_2_adults_username.csv","expected":"The Adults branch opens a SECOND chooser at /admin/admin/org_<slug>/learner/adult-select/new, headed \"Create accounts or invite students\", offering \"Create adult student accounts\" (\"Students will be provided with a username and password to log in\") and \"Invite adult students by email\". Choosing the first opens the adult bulk-creation form and submitting creates username-based adult accounts. [ASSUMED beyond the chooser.]","actual":"-","status":"Not Automated","remarks":"CREATES REAL DATA. The two-step chooser was captured live 2026-08-22 — this is the branch that distinguishes source scenarios #18 and #19. Running this case is also what unblocks TST_SPRF_TC_3.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"51","id":"TST_SBLK_TC_3","title":"Verify new adult students can be invited to classes by email in bulk","req":"#19 — Verify Bulk feature > Add new students to classes adult/teacher (email)","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class already exists in the school.","steps":"1. Click \"Manage students\" > \"Add new students to classes\".\n2. Select \"Adults\" > \"Next\".\n3. Select \"Invite adult students by email\" > \"Next\".\n4. Populate and upload the CSV, then submit.","testData":"Adult invitation CSV in the real template format. File: TST_SBLK_TC_3_adults_email.csv","expected":"The option is described as \"Students will receive an email invitation to create their account and join the class. They can sign up and log in with their email address or social media account and reset their own password.\" Submitting sends invitations rather than creating live accounts. [ASSUMED beyond the chooser.]","actual":"-","status":"Not Automated","remarks":"SENDS REAL EMAIL. Use mailsac/yopmail addresses only. Chooser copy verified live 2026-08-22.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"52","id":"TST_SBLK_TC_4","title":"Verify EXISTING students can be added to classes by username in bulk","req":"#20 — Verify Bulk feature > Add existing students to classes adult/teacher (email)","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class exists and the students already have accounts.","steps":"1. Click \"Manage students\" > \"Add existing students to classes\".\n2. On the chooser select \"Add students by username\" and click \"Next\".\n3. Populate and upload the CSV, then submit.","testData":"Existing-student CSV keyed by username. File: TST_SBLK_TC_4_existing_username.csv","expected":"The chooser page /admin/admin/org_<slug>/learner/select/existing is shown, headed \"Add students by username or email?\" and carrying \"Important: Classes must be created before adding existing students\". \"Add students by username\" is described as \"Students will be added through their existing usernames.\" Submitting adds them to the chosen class without creating new accounts. [ASSUMED beyond the chooser.]","actual":"-","status":"Not Automated","remarks":"MODIFIES REAL CLASS MEMBERSHIP. Chooser captured live 2026-08-22. AUTOMATION NOTE: this chooser reuses the SAME element identifiers as the adult new-account chooser in TST_SBLK_TC_2 — identify the screen by its URL or heading, never by the control ids alone.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"53","id":"TST_SBLK_TC_5","title":"Verify existing students can be invited to classes by email in bulk","req":"#20 — Verify Bulk feature > Add existing students to classes adult/teacher (email)","type":"Positive","priority":"Medium","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed. At least one class exists.","steps":"1. Click \"Manage students\" > \"Add existing students to classes\".\n2. Select \"Invite students by email\" and click \"Next\".\n3. Populate and upload the CSV, then submit.","testData":"Existing-student CSV keyed by email. File: TST_SBLK_TC_5_existing_email.csv","expected":"The option is described as \"Students will receive an email invitation to join the class. They can sign up and log in with their email address or social media account.\" Submitting sends invitations. [ASSUMED beyond the chooser.]","actual":"-","status":"Not Automated","remarks":"SENDS REAL EMAIL. Chooser copy verified live 2026-08-22.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"54","id":"TST_SBLK_TC_7","title":"Verify the bulk activation page loads with its entry grid and CSV controls","req":"#21 — Verify Bulk feature > Activate course material","type":"Positive","priority":"High","preconditions":"Logged in as school admin (testt1@mailsac.com) on Thor. School \"3 July Test School 1\" (key FCN-CHZ-PDA) opened from \"My school accounts\". Students tab is displayed.","steps":"1. Click \"Manage students\" > \"Activate course materials\".\n2. Observe the page.","testData":"-","expected":"The page /admin/admin/org_<slug>/bulk_activation opens, headed \"Activate codes for students in your school\" above the school name \"3 July Test School 1\". It offers \"Upload file\", \"Get CSV template\", a \"How to use this form\" help toggle, a \"0 Selected\" counter with \"Remove\", one empty entry row with the columns Email or Username / First name / Last name / Activation code (placeholder \"for example ABC4-DE3F-G2HJ-1KLM\"), and a disabled \"Activate 1 code\" button.","actual":"-","status":"Not Automated","remarks":"Verified live 2026-08-22 (screenshot bulk-activation-i18n-key.png). The button label counts the rows, so it changes as rows are added.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"55","id":"TST_SBLK_TC_11","title":"Verify uploading a CSV populates the bulk activation grid","req":"#21 — Verify Bulk feature > Activate course material","type":"Positive","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Click \"Get CSV template\" and save the template.\n2. Populate it with student identifiers and activation codes.\n3. Click \"Upload file\" and choose the populated file.\n4. Observe the grid.","testData":"TST_SBLK_TC_11_bulk_activation.csv — in the exact downloaded template format","expected":"[ASSUMED] The grid is populated with one row per CSV record and the Activate button label updates to the row count. A progress dialog reading \"Please wait, this may take a few minutes\" with \"Cancel upload\" is shown during the upload.","actual":"-","status":"Not Automated","remarks":"The progress dialog copy is verified from the pre-rendered DOM (2026-08-22); the upload itself was not run and the template headers were NOT downloaded, so the CSV fixture cannot be written until they are. If bulk activation behaves like the class bulk upload, uploading only POPULATES the form and “Activate N codes” remains the only gate — which would make this case side-effect free. Confirm that before placing it in a suite.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"56","id":"TST_SBLK_TC_8","title":"Verify the Activate button stays disabled until a row is complete","req":"#21 — Verify Bulk feature > Activate course material","type":"Edge","priority":"Medium","preconditions":"The bulk activation page is open with one empty row.","steps":"1. Observe \"Activate 1 code\" with the row empty.\n2. Fill only the Activation code and observe again.\n3. Fill every column of the row and observe again.","testData":"One partial row, then one complete row","expected":"[ASSUMED] The button is disabled until at least one row carries both an identified student and a code, and enabled once a row is complete.","actual":"-","status":"Not Automated","remarks":"Only the empty-row disabled state was verified live 2026-08-22; the enabling threshold was not exercised. Confirm during Phase 1.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"57","id":"TST_SBLK_TC_9","title":"Verify the bulk-activation success dialog shows real text and not raw translation keys","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"High","preconditions":"A bulk activation has been submitted successfully.","steps":"1. Complete at least one valid row on the bulk activation page.\n2. Click \"Activate N codes\".\n3. Read the success dialog.","testData":"<VALID_UNUSED_ACTIVATION_CODE>","expected":"The dialog should explain what happened in plain English.\n\nACTUAL (defect, observed 2026-08-22): the dialog body renders three RAW UNTRANSLATED KEYS instead of text — \"ADMIN.LEARNER.BULK_ACTIVATION.SUCCESS_MODAL_INFO_1\", \"...SUCCESS_MODAL_INFO_2\" and \"...SUCCESS_MODAL_INFO_3\" — above a \"Back to dashboard\" button.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. DEFECT — raise. Captured WITHOUT running a bulk activation, by reading the pre-rendered dialog in the DOM (admin-shared.md §A6). This is a user-visible failure waiting for the first successful bulk activation. The same page also holds \"An unexpected error occured.\" (sic — “occured”) in its Form-not-uploaded dialog.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"58","id":"TST_SBLK_TC_10","title":"Verify the bulk-activation row checkbox exposes a real accessible label","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Inspect the accessible name of the entry row's select checkbox (screen reader, or the sr-only label in the markup).","testData":"-","expected":"The checkbox should announce something meaningful such as “Select student row”.\n\nACTUAL (defect, observed 2026-08-22): the screen-reader-only label contains the raw key \"ADMIN.LEARNER.BULK_ACTIVATION.SELECT_STUDENT\", so a screen-reader user hears the translation key. The key is not visible on screen, which is why it has gone unnoticed.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. DEFECT (accessibility) — raise alongside TST_SBLK_TC_9; same missing translation bundle. A third instance, \"SCREEN_READER.PROCESSING_MESSAGE\", appears on the individual activation page (TST_SPRF_TC_16), so this looks like one systemic gap rather than three separate typos.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"59","id":"TST_SBLK_TC_12","title":"Verify a CSV that cannot be processed is rejected with a clear message","req":"#21 — Verify Bulk feature > Activate course material","type":"Negative","priority":"Medium","preconditions":"The bulk activation page is open.","steps":"1. Click \"Upload file\" and choose a malformed or oversized CSV.\n2. Read the dialog.","testData":"TST_SBLK_TC_12_malformed.csv","expected":"The upload is refused and a dialog headed \"Sorry, your file could not be uploaded\" is shown, ending \"If that doesn’t work, email our Customer Services team at ptsupport@cambridge.org\". [ASSUMED for the specific reason line, which is populated per failure type.]","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Dialog shell captured from the pre-rendered DOM 2026-08-22. The equivalent dialog on the adult CSV page enforces a 200-record maximum with its own wording (see product-knowledge/ExperienceApp.md); whether bulk activation shares that limit is unknown.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"60","id":"TST_SLST_TC_26","title":"Verify a student whose name contains special characters is returned by a name search","req":"#1 - Verify search by first name","type":"Edge","priority":"Medium","preconditions":"On the Students tab of a school containing a student whose first or last name contains special characters.","steps":"1. Enter the name containing special characters in the search box. 2. Click Search. 3. Read the returned row(s) and the rendered name.","testData":"First name !^(+)s95 or &FName - names present on the shared school per the other team's sheet. Confirm live before running.","expected":"The matching student is returned. The term is treated as literal text rather than interpreted, and the name is rendered correctly in the result row - not HTML-escaped, truncated or corrupted. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_001, which lists special-character names as fixtures. We already cover special characters in the email field (TST_SLST_TC_7) but never in a name field. SLST is already automated, so this is cheap to add. Read-only - no data created.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"61","id":"TST_SLST_TC_27","title":"Verify a partial username returns every account whose username contains the term","req":"#4 - Verify search by username","type":"Edge","priority":"Medium","preconditions":"On the Students tab, with two or more accounts whose usernames share a common substring.","steps":"1. Enter a substring shared by several usernames (not a whole username). 2. Click Search. 3. Read the returned rows.","testData":"Username fragment <SHARED_USERNAME_SUBSTRING> - e.g. the common prefix of s95child0001-style accounts.","expected":"Every account whose username contains the term is returned, not only an exact match. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_004, whose step 2 searches a partial username. Our TST_SLST_TC_8 searches a full child username only. We already prove partial matching for first name (TST_SLST_TC_3), so username was the one identifier left unverified. Read-only.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"62","id":"TST_SLST_TC_28","title":"Verify a never-activated code returns a clear no-result state in the activation-code search","req":"#5 - Verify search using who activated the code in my school checkbox","type":"Negative","priority":"Medium","preconditions":"On the Students tab with the \"Who activated the code in my school?\" checkbox ticked.","steps":"1. Tick Who activated the code in my school?. 2. Enter a well-formed 16-character code that has never been activated in this school. 3. Click Search. 4. Wait for the query to settle (the code search can take up to ~1 minute).","testData":"A syntactically valid but unredeemed 16-character code, e.g. AAAA-BBBB-CCCC-DDDD.","expected":"A clear no-result / empty state is shown, with no error and no stale results left from the previous query. [ASSUMED] - exact copy not captured.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_005, step 2. Our TST_SLST_TC_13 only toggles the checkbox and TST_SLST_TC_14 (Blocked, needs a known redeemed code) covers the success path, so the failure path was entirely unverified. This case is cheaper than TC_14 and can run today - it needs no seeded redemption. Read-only.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"63","id":"TST_SPRF_TC_23","title":"Verify a learner can sign in with the password an administrator has just set","req":"#11 - Verify Change password: View Profile > Manage account > Edit Account details","type":"Positive","priority":"High","preconditions":"A disposable learner account exists whose credentials the tester controls and whose current password is known.","steps":"1. As admin, open the learner's profile > Manage learner profile > Password. 2. Set a new policy-compliant password and click Update. 3. Sign out. 4. Sign in as the learner with the new password. 5. Sign out and attempt to sign in with the old password.","testData":"Disposable learner <DISPOSABLE_STUDENT_ACCOUNT>; new password meeting the policy (min 8 characters, at least one letter and one number/special).","expected":"Sign-in with the new password succeeds and the learner reaches their dashboard. Sign-in with the old password is rejected. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_010, whose expected result is \"login with the new password succeeds\". Our TST_SPRF_TC_8 stops at the form accepting the update - which a change that was acknowledged but never persisted would also satisfy. Mutates a real account: use a disposable learner, never a shared fixture, and place it in a data-mutating suite.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"64","id":"TST_SBLK_TC_13","title":"Verify a duplicate username is flagged on its own row during bulk account creation","req":"#17 - Verify Bulk feature > Add new students to classes children","type":"Negative","priority":"High","preconditions":"On \"Create new accounts for children\" via Manage students > Add new students to classes > Children.","steps":"1. Fill one valid child row. 2. Fill a second row re-using the same username. 3. Read both rows and the submit button. 4. Repeat via the CSV path with the same duplicate pair.","testData":"Two child rows sharing one username; the rest of the fields valid.","expected":"The offending row is flagged (no green tick) with an error naming the username field, the valid row is unaffected, and Create N account(s) stays unavailable while any row is invalid. Behaviour is the same for the manual grid and the CSV upload. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_016_N1. Our SBLK negatives cover only the CSV-level rejection (TST_SBLK_TC_12) and two UI defects (TC_9 raw i18n keys, TC_10 checkbox label) - row-level validation was untested. This is the guard that stops bad accounts being created in bulk. Side-effect free provided the form is never submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"65","id":"TST_SBLK_TC_14","title":"Verify a rule-violating username or password is flagged on its own row during bulk account creation","req":"#18 - Verify Bulk feature > Add new students to classes adult with username","type":"Negative","priority":"High","preconditions":"On \"Create adult student accounts\" via Manage students > Add new students to classes > Adults.","steps":"1. Fill one valid adult row. 2. Fill a second row with a username and a password that violate the documented rules. 3. Read both rows, the per-field messages and the submit button. 4. Repeat via the CSV path.","testData":"One valid adult row; one row with a rule-violating username and a rule-violating password.","expected":"The offending row is flagged (no green tick), the message identifies which field is wrong, the valid row is unaffected, and the submit control stays unavailable while any row is invalid. [ASSUMED] - the username and password rules must be read from the form's own help text before this case is finalised.","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STU_017_N1. Companion to TST_SBLK_TC_13 on the adult path. Capture the stated rules verbatim on the first live pass - inventing them would breach golden rule 2. Side-effect free provided the form is never submitted.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"66","id":"TST_SBLK_TC_15","title":"Verify an invalid code in a bulk activation is reported without blocking the valid rows","req":"#21 - Verify Bulk feature > Activate course material","type":"Negative","priority":"High","preconditions":"On \"Activate codes for students in your school\" via Manage students > Activate course materials.","steps":"1. Fill a batch mixing rows with valid unused codes and at least one already-used or invalid code. 2. Submit Activate N code(s). 3. Read the job outcome and, once processed, the affected learner profiles.","testData":"Valid unused 16-character codes plus one already-used/invalid code er no longer appears on the Staff tab and the Staff (N) count decreases by one. [ASSUMED] — the post-confirmation screen, whether the removal is synchronous or reported later, and whether an email report is sent are all unverified.","actual":"-","status":"Not Automated","remarks":"[ASSUMED]. Destructive. ⚠️ Never remove a staff member this suite did not create. Unlike student removal there is no pre-rendered \"in progress\" or email-report dialog on this screen, which suggests staff removal may be synchronous — confirm in Phase 1 rather than assuming.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"44","id":"TST_STFB_TC_1","title":"Verify the invitation form opens when Add new teachers to classes is chosen from Manage staff","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Positive","priority":"High","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff.","steps":"1. Click Manage staff.\n2. Read the menu items.\n3. Click Add new teachers to classes.","testData":"—","expected":"The Manage staff menu holds exactly one item, Add new teachers to classes. Clicking it opens /admin/admin/org_<slug>/email/invite, headed Invite students and teachers / to <school name>.","actual":"-","status":"Not Automated","remarks":"Verified live 2026-08-24. Note the Staff tab has no \"add existing\", no bulk activation and no bulk removal — the Students tab has all three. The destination is a shared students-and-teachers invite form, not a teacher-only form.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"45","id":"TST_STFB_TC_2","title":"Verify the invitation form shows all expected controls and columns when it is opened","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Positive","priority":"High","p ers invited to school Account with You can track responses in the pending section for each class.As students/teachers accept your invitation they will appear on your dashboard, the question Would you like a record of the invitations sent? and the controls Back to dashboard and Download record.","actual":"-","status":"Not Automated","remarks":"Dialog copy captured verbatim from the pre-rendered DOM, 2026-08-24; the send itself was not performed. Sends real email — mailsac/yopmail addresses only, prefix AutoStaff_. Two copy defects visible in this dialog: school Account (stray capital A) and the missing space after each class.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"49","id":"TST_STFB_TC_5","title":"Verify the bulk row actions are unavailable when no rows are selected","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Edge","priority":"Medium","preconditions":"The invitation form is open with no row checkboxes ticked.","steps":"1. Confirm the counter reads 0 Selected.\n2. Observe Add role, + Add class key and Remove.","testData":"—","expected":"All three bulk actions are presented as unavailable while 0 Selected is shown.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24. Automation trap: these three controls carry no qid and are disabled by the CSS class disable (not disabled, and with no native disabled property). Resolve them by their text and assert on the class.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"50","id":"TST_STFB_TC_6","title":"Verify a previously saved draft is restored when the invitation form is re-opened","req":"#12 — Verify Bulk feature > Add new teachers to classes form", ":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Expected-versus-actual, low severity. Consistent with TST_STFB_TC_4 — the shared invite form is presented as a students screen throughout. Group both with the product owner as one copy/labelling issue rather than two.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"56","id":"TST_STFP_TC_19","title":"Verify a newly promoted administrator can actually open the admin console","req":"#9 - Verify Grant admin rights","type":"Positive","priority":"High","preconditions":"A disposable teacher account exists whose password the tester controls, currently without admin rights.","steps":"1. As an administrator, open the teacher's staff profile > Manage account > Grant admin rights and confirm. 2. Verify the role now reads Administrator/Teacher. 3. Sign out. 4. Sign in as that user. 5. Open the school and confirm the admin console and its tabs are reachable.","testData":"Disposable teacher <DISPOSABLE_STAFF_ACCOUNT> on the target school.","expected":"After the grant, the user can sign in and reach the admin console for that school, seeing the administrator tabs. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STF_009, whose step 3 is \"log in as that user and confirm admin console access\". Our TST_STFP_TC_10 stops at the role label changing in the UI - which a grant that updated the display but not the permission would also satisfy. This is the same shape as the Students password gap (TST_SPRF_TC_23): we verify the UI acknowledged the change, not that the change took effect. Mutates a real account - data-mutating suite, and revoke the rights afterwards as housekeeping.","comments":"-","rawStatus":"Not Run","isImplemented tschool_1/staff. A mailsac/yopmail address not already on the school is available.","steps":"1. Note the count in Staff (N).\n2. Go to Manage staff > Add new teachers to classes and send an invitation to a new teacher email with role Teacher and a valid class key.\n3. Accept the invitation from the mailbox and complete sign-up.\n4. Return to the Staff tab and reload.\n5. Read Staff (N) and search for the new teacher.","testData":"Email: AutoStaff_<timestamp>@mailsac.com; Class key: <VALID_THOR_CLASS_KEY>","expected":"After the invitation is ACCEPTED the count in Staff (N) is one higher than the value noted in step 1 and the new teacher appears in the list with role Teacher. The count does NOT move when the invitation is merely sent — it increments only on acceptance [confirmed with the team 2026-08-24].","actual":"-","status":"Not Automated","remarks":"Sends real email and creates a real account — mailsac/yopmail addresses only, prefix AutoStaff_. The count timing is now confirmed (acceptance, not invitation), so this case is no longer [ASSUMED] on that point; what remains unverified is the end-to-end run itself. Note TST_STFL_TC_26: the heading count and the rendered rows already disagree by 2 on this school, so assert the DELTA on the count, not the row total.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"27","id":"TST_STFP_TC_1","title":"Verify the staff profile opens with all expected details when View profile is used on a teacher","req":"#7 — Verify View Profile launch","type":"Positive","priority":"High","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff.","steps":"1. Locate the row ln | teacher17aug2026 | teacher17aug2026@mailsac.com | Teacher.\n2. Click the row to open its action menu.\n3. Click View profile.","testData":"Teacher: teacher17aug2026@mailsac. ed to CLIENT-SIDE ERROR HANDLING only. The underlying HTTP 500 from getUserDetailWithClasses is a KNOWN DATA ISSUE on this one account — confirmed with the team 2026-08-24 — and is NOT part of this case; do not raise it as a product defect. What remains product-side is that any 500 produces no message and a stuck overlay. The 500 account is retained deliberately as the trigger fixture; teacher17aug2026@mailsac.com is the healthy teacher fixture used elsewhere.","comments":"HTTP 500 confirmed as a known data issue with the team, 2026-08-24. Case narrowed to the missing error handling and the stuck loading overlay.","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"32","id":"TST_STFP_TC_7","title":"Verify the class page opens when a class is clicked on a staff profile","req":"#8 — Verify class launch from view profile page","type":"Positive","priority":"High","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff.","steps":"1. Open the profile of testt1@mailsac.com (T1, Test), which shows Classes (3).\n2. Click the class name A11y test.\n3. Observe the page.","testData":"Staff with classes: testt1@mailsac.com; class A11y test, key iCmL-9Y8J","expected":"The class page opens at /class/teacher/org_<slug>/class/<uuid>/view, settling on /view/classdata, with h1 reading the class name A11y test and the browser tab reading A11y test | Cambridge One.","actual":"-","status":"Pass","remarks":"Verified live 2026-08-24. Each listed class is a real link (user-profile-6-<index>). Contrast with the student profile, where the umbrella name is plain text with no link — do not assume the two profiles behave alike. Crossing from admin to class is a full page load, not an Angular route change; budget for it.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["staffProfile.test.js","adminSta n.","steps":"1. Click Manage account.\n2. Read the menu items.\n3. Do NOT confirm.","testData":"Own account: testt1@mailsac.com","expected":"Remove admin rights and Remove from school account are both offered on the administrator's own profile — the product does not exclude the signed-in user from either action.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 (menu inspected only). Never confirm either action on this account — it is the login used by every admin suite, and self-revoking would lock the whole programme out. Worth raising: should self-revocation and self-removal be prevented, or at least warned about?","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"40","id":"TST_STFP_TC_15","title":"Verify the removal confirmation explains the consequence when Remove from school account is opened","req":"#10 — Verify remove from school account","type":"Positive","priority":"High","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff. A staff profile has been opened via the row action menu > \"View profile\" (the profile URL is NOT deep-linkable, so a staff profile cannot be reached directly).","steps":"1. Click Manage account > Remove from school account.\n2. Read the dialog.","testData":"—","expected":"The dialog is headed Remove from school account and reads This staff member will no longer have access to your school account or any of its classes. They can still use their account independently from your school, with the confirmation checkbox I confirm I want to remove this staff member from my school a e confirmation checkbox.\n3. Click Yes, remove.\n4. Observe the resulting screen.\n5. Return to the Staff tab and search for the staff member.","testData":"A staff member created by this suite (prefix AutoStaff_)","expected":"The staff member no longer appears on the Staff tab and the Staff (N) count decreases by one. [ASSUMED] — the post-confirmation screen, whether the removal is synchronous or reported later, and whether an email report is sent are all unverified.","actual":"-","status":"Not Automated","remarks":"[ASSUMED]. Destructive. ⚠️ Never remove a staff member this suite did not create. Unlike student removal there is no pre-rendered \"in progress\" or email-report dialog on this screen, which suggests staff removal may be synchronous — confirm in Phase 1 rather than assuming.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"43","id":"TST_STFP_TC_16","title":"Verify the Yes, remove button is unavailable until the confirmation checkbox is ticked","req":"#10 — Verify remove from school account","type":"Edge","priority":"High","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff. A staff profile has been opened via the row action menu > \"View profile\" (the profile URL is NOT deep-linkable, so a staff profile cannot be reached directly). The Remove from school account dialog is open.","steps":"1. Observe Yes, remove with the checkbox unticked.\n2. Tick I confirm I want to remove this staff member from my school account.\n3. Observe Yes, remove again.\n4. Untick the checkbox and observe once more.","testData":"—","expected":"Yes, remove is presented as unavailable while the box is unticked, becomes available when it is ticked, and returns to unavailable when it is unticked again.","actual":"-","status":"Pass","remarks":"Verified live 2026-08-24. Automation trap: l":"-","status":"Not Automated","remarks":"Dialog copy captured verbatim from the pre-rendered DOM, 2026-08-24; the send itself was not performed. Sends real email — mailsac/yopmail addresses only, prefix AutoStaff_. Two copy defects visible in this dialog: school Account (stray capital A) and the missing space after each class.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"49","id":"TST_STFB_TC_5","title":"Verify the bulk row actions are unavailable when no rows are selected","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Edge","priority":"Medium","preconditions":"The invitation form is open with no row checkboxes ticked.","steps":"1. Confirm the counter reads 0 Selected.\n2. Observe Add role, + Add class key and Remove.","testData":"—","expected":"All three bulk actions are presented as unavailable while 0 Selected is shown.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24. Automation trap: these three controls carry no qid and are disabled by the CSS class disable (not disabled, and with no native disabled property). Resolve them by their text and assert on the class.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"50","id":"TST_STFB_TC_6","title":"Verify a previously saved draft is restored when the invitation form is re-opened","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Edge","priority":"High","preconditions":"A draft invitation has previously been entered on this form and left unsent.","steps":"1. Open Manage staff > Add new teachers to classes.\n2. Observe the grid rows and the area above it.","testData":"—","expected":"The form is not empty — the previously entered rows are restored, a Saved <age> indicator is shown (e.g. Saved 30+ days ago), the submit button counts the restored rows, and any validation messages on those rows are already displayed.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 — the form opened showing Saved 30+ days ago, four restored rows and live validation messages. Same auto-save/restore behaviour as the Create new classes form (admin-shared.md §A4). A test that assumes an empty form will fail, and the draft is shared state on a shared school — do not assume your own suite wrote it.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"51","id":"TST_STFB_TC_7","title":"Verify the submit button is unavailable while any invitation row is incomplete","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Edge","priority":"High","preconditions":"The invitation form is open with at least one row missing a required value.","steps":"1. Leave a row without a role or without a valid class key.\n2. Observe the Send N invites button.","testData":"—","expected":"The Send N invites button is unavailable while any row fails validation.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Verified live 2026-08-24 — the button was both natively disabled and carried the disabled class in this state.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"52","id":"TST_STFB_TC_9","title":"Verify a CSV of teacher records populates the grid when it is uploaded","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Edge","priority":"High","preconditions":"The invitation form is open and a CSV in the downloaded template format is available.","steps":"1. Click Upload file.\n2. Choose the CSV.\n3. Wait for the progress dialog to complete.\n4. Read the grid.","testData":"TST_STFB_TC_9_teachers.csv","expected":"The grid is populated with one row per CSV record, up to the 200-record limit, with the Role cell set to Teacher and the Class key carried through. Upload populates the form only — invitations are sent solely by Send N invites, so this case creates nothing and sends no email.","actual":"-","status":"Not Automated","remarks":"Fixture written 2026-08-24 from the real downloaded template, headers verified. It omits the template example row and uses class key wLE3-zTx6 (AutoClass_CreateOnly, active Aug 24 2026 - Sep 15 2026) — an auto-created class this programme already owns. If that class has been swept, substitute any active class key from the Classes tab. [ASSUMED] whether the Role value must be exactly Teacher (the template example uses Student) and whether the example row must be removed before upload — resolve both on the first run. During upload the product shows Please wait, this may takea few minutes — note the missing space in takea, a copy defect to raise. On failure it shows Sorry, your file could not be uploaded with the ptsupport@cambridge.org contact.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"53","id":"TST_STFB_TC_8","title":"Verify per-field validation messages are shown when invitation rows are incomplete or invalid","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Negative","priority":"High","preconditions":"The invitation form is open.","steps":"1. Leave the Role cell of a populated row empty.\n2. Enter an invalid class key in another row.\n3. Leave the Email cell of a row that has a role empty.\n4. Read the messages under each cell.","testData":"Invalid class key: notakey","expected":"The messages are shown verbatim: Select student or teacher under an empty Role, Enter a valid class key under an invalid Class key, and Add a teacher’s email under an empty Email on a teacher row.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. All three captured verbatim live 2026-08-24 from a restored draft. Add a teacher’s email confirms the form does distinguish the teacher case even though its help copy does not.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"54","id":"TST_STFB_TC_11","title":"Verify translated text is shown when the form upload error dialog is raised","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Negative","priority":"High","preconditions":"The invitation form is open.","steps":"1. Trigger the form upload error state.\n2. Read the dialog heading, body and close control.","testData":"—","expected":"Expected: the dialog reads Form not uploaded / An unexpected error occured. Please try again. / Close — the strings the product already ships. Actual (verified in the pre-rendered DOM, 2026-08-24): it renders three raw translation keys — ADMIN.LEARNER.ADULT_INVITE.FORM_UPLOAD_ERROR_HEADING as the heading, ADMIN.LEARNER.ADULT_INVITE.FORM_UPLOAD_ERROR_INFO as the body and ADMIN.LEARNER.ADULT_INVITE.FORM_UPLOAD_ERROR_CLOSE as the close button.","actual":"-","status":"Blocked","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Expected-versus-actual. ROOT CAUSE established from the admin bundle 2026-08-24: the modal is #existingChildFormUploadErrorModal, a component reused from the add-existing-children CSV flow, but on this page it looks its copy up under ADMIN.LEARNER.ADULT_INVITE. The FORM_UPLOAD_ERROR_* strings are defined ONLY under ADMIN.LEARNER.EXISTING_CHILD and ADMIN.LEARNER.BULK_ACTIVATION (in both en and es) — the ADULT_INVITE block exists but does not define them, so ngx-translate falls back to printing the key. Changing site language does not help; Spanish has the same gap. Control test: the same dialog on the add-existing-children CSV screen renders correctly, which is why this has gone unnoticed. Note the correct string carries the known occured typo already recorded in admin-students-tab.md. Found by free-capture of the pre-rendered DOM (admin-shared.md A6) before the state was ever reached.","comments":"Blocked at design time — the dialog is present in the pre-rendered DOM but the condition that raises it has not been reproduced, so the case cannot be executed end to end. Root cause is known (missing ADULT_INVITE translation keys — see Remarks). Unblock: force the invitation form upload to fail — DevTools > Network > block the upload request, or go offline mid-upload — and confirm which of the three error modals is raised; if it is #existingChildFormUploadErrorModal rather than #errorFileUploadModal or #somethingWentWrongModal, the case is runnable.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]},{"sNo":"55","id":"TST_STFB_TC_12","title":"Verify the browser tab title names the correct area when the invitation form is opened from the Staff tab","req":"#12 — Verify Bulk feature > Add new teachers to classes form","type":"Negative","priority":"Low","preconditions":"Logged in as school admin testt1@mailsac.com on thor. School FCN-CHZ-PDA (\"3 July Test School 1\") opened from \"My school accounts\" BY KEY. Staff tab open at /admin/admin/org_perf_testschool_1/staff.","steps":"1. Click Manage staff > Add new teachers to classes.\n2. Read the browser tab title.","testData":"—","expected":"Expected: a title naming staff or the invitation form. Actual (verified live 2026-08-24): the tab reads Students | Cambridge One, even though the page was reached from the Staff tab and is headed Invite students and teachers.","actual":"-","status":"Not Automated","remarks":"[EXTRA — Phase 1 exclusion] Not present in the other team's reviewed sheet (Admin_Gap_Analysis.xlsx, status \"Extra in Ours\"). This case will NOT be automated in Phase 1 — exclude it from the Phase 1 automation scope; revisit for a later phase. Expected-versus-actual, low severity. Consistent with TST_STFB_TC_4 — the shared invite form is presented as a students screen throughout. Group both with the product owner as one copy/labelling issue rather than two.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"56","id":"TST_STFP_TC_19","title":"Verify a newly promoted administrator can actually open the admin console","req":"#9 - Verify Grant admin rights","type":"Positive","priority":"High","preconditions":"A disposable teacher account exists whose password the tester controls, currently without admin rights.","steps":"1. As an administrator, open the teacher's staff profile > Manage account > Grant admin rights and confirm. 2. Verify the role now reads Administrator/Teacher. 3. Sign out. 4. Sign in as that user. 5. Open the school and confirm the admin console and its tabs are reachable.","testData":"Disposable teacher <DISPOSABLE_STAFF_ACCOUNT> on the target school.","expected":"After the grant, the user can sign in and reach the admin console for that school, seeing the administrator tabs. [ASSUMED]","actual":"-","status":"Not Automated","remarks":"Added 2026-09-01 from the other team's TC_STF_009, whose step 3 is \"log in as that user and confirm admin console access\". Our TST_STFP_TC_10 stops at the role label changing in the UI - which a grant that updated the display but not the permission would also satisfy. This is the same shape as the Students password gap (TST_SPRF_TC_23): we verify the UI acknowledged the change, not that the change took effect. Mutates a real account - data-mutating suite, and revoke the rights afterwards as housekeeping.","comments":"-","rawStatus":"Not Run","isImplemented":false,"implFiles":[]},{"sNo":"57","id":"TST_STFP_TC_20","title":"Verify admin rights cannot be revoked from the only remaining administrator","req":"#11 - Verify revoke admin rights","type":"Negative","priority":"High","preconditions":"A school whose staff list contains exactly one administrator.","steps":"1. Open the sole administrator's staff profile > Manage account. 2. Attempt Remove admin rights. 3. Read whether the control is unavailable or the action is blocked, and the message shown. 4. Re-read the role afterwards.","testData":"A school with a single administrator.","expected":"The action is prevented - the control is unavailable, or it is blocked with a message explaining the school must retain at least one administrator - and the role is unchanged afterwards. [ASSUMED]","actual":"-","status":"Blocked","remarks":"Added 2026-09-01 from the other team's TC_STF_011_N1. No counterpart existed anywhere in our register. Related but distinct from TST_STFP_TC_14, which checks an administrator can reach Remove admin rights on their own profile - this one checks what happens when doing so would leave the school with none.","comments":"Blocked at design time (skill rule 4): the precondition is a school with exactly one administrator. 3 July Test School 1 is shared and has several, and reducing it to one would break other suites. Unblock with a dedicated single-admin school.","rawStatus":"Blocked","isImplemented":false,"implFiles":[]}]},{"folder":"AdminApp-Reports","id":"adminapp-reports","name":"Reports Tab","badge":"MRPT","file":"AdminApp_Reports_tab_test_cases.xlsx","total":43,"pass":31,"blocked":4,"notAuto chool \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Type \"Fixture_GradeSettings_DO_NOT_DELETE\" into the \"Search for class name or class key\" box.\n2. Do NOT click \"Search\".\n3. Observe the class list.","testData":"Search term: Fixture_GradeSettings_DO_NOT_DELETE","expected":"The list narrows to the single class \"Fixture_GradeSettings_DO_NOT_DELETE\" with key 62k3-AXm6, WITHOUT the \"Search\" button being clicked, and the row remains selectable.","actual":"-","status":"Pass","remarks":"CORRECTED 2026-09-08 — the previous expected result was [ASSUMED] and WRONG. The search is LIVE / debounced, not submit-driven: the list narrowed to one row before the \"Search\" button was clicked. The earlier assumption was inherited from the Classes tab, which IS submit-driven — exactly the trap admin-shared.md §A4 warns about. A \"Search\" control (a[qid=\"createReport-10\"]) does exist but is not required to filter. Test data also changed: the original \"Gated LP Class\" (4mG6-9Jkf) lives on VED-NEH-KVU, which the suite account cannot see. Fixture_GradeSettings_DO_NOT_DELETE is documented never-delete in admin-shared.md §A7, so it is unique and stable on this shared school.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","schoolReportsCreate.test.js","adminSchoolReports.json","adminSchoolReportsCreate.json"]},{"sNo":"5","id":"TST_MRPT_TC_5","title":"Verify a class is returned when its class key is searched","req":"#2 — Verify search using class name or class key","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Type \"62k3-AXm6\" into the search box.\n2. Do NOT click \"Search\".\n3. Observe the class list.","testData":"Search term: 62k3-AXm6","expected":"The um","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Type \"zzzznotaclass\" into the search box.\n2. Click \"Search\".\n3. Observe the class list area.","testData":"Search term: zzzznotaclass","expected":"[ASSUMED] No class rows are rendered and a no-results message is shown that echoes the search term (the Classes tab renders \"No classes that match your search <term>\").","actual":"-","status":"Pass","remarks":"[ASSUMED] copy — the no-results state was not reached during the 2026-08-26 capture. Capture the exact string live before automating.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"8","id":"TST_MRPT_TC_8","title":"Verify the filter panel opens with all five class statuses when \"Filter\" is clicked","req":"#3 — Verify filter","type":"Positive","priority":"Medium","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Click the \"Filter\" control.\n2. Observe the panel.","testData":"—","expected":"A panel headed \"Filter by\" opens containing exactly five checkboxes labelled \"Not started\", \"Active\", \"Ended\", \"Expired\" and \"Deleted\", ALL FIVE TICKED by default, plus a \"Clear all\" link, an \"Apply\" button and a \"Close\" control. The filter summary label reads \"All class statuses\".","actual":"-","status":"Pass","remarks":"CORRECTED 2026-09-08 — the previous expected result said the five checkboxes were UNTICKED. They are all TICKED by default, which is what makes the unfiltered summary read \"All class statuses\". Strings otherwise captured verbatim live 2026-08-26 and re-verified 2026-09-08. Note the status set includes \"Not started\", which the existing Classes-tab knowledge did not record (it listed Ended / Expired / Deleted).","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"9","id":"TST_MRPT_TC_9","title":"Verify the class list is narrowed to one status when that status filter is applied","req":"#3 — Verify filter","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Click \"Filter\".\n2. Untick \"Not started\", \"Ended\", \"Expired\" and \"Deleted\", leaving only \"Active\" ticked.\n3. Click \"Apply\".\n4. Observe the class list and the filter summary label.","testData":"Filter: Active only","expected":"The panel closes and every rendered row shows \"Active\" in its Class status column. The summary label changes from \"All class statuses\" to \"1 class status\".","actual":"-","status":"Pass","remarks":"VERIFIED live 2026-09-08 on FCN-CHZ-PDA; the [ASSUMED] on the summary label is resolved. The label is \"<N> class status(es)\" where N is the number of TICKED statuses — so leaving one ticked reads \"1 class status\" (singular). Steps corrected: because all five start ticked (TC_8), a single-status filter is reached by UNTICKING the other four, not by ticking one. This school proves exclusion properly — 21 of its 110 classes are Active, and the pre-filter list contained Deleted rows.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"10","id":"TST_MRPT_TC_10","title":"Verify the unfiltered class list is restored when \"Clear all\" is used","req":"#3 — Verify filter","type":"Edge","priority":"Medium","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Apply a filter of a single status (see TST_MRPT_TC_9) so the summary reads \"1 class status\".\n2. Click \"Filter\" to reopen the panel.\n3. Click \"Clear all\".\n4. Observe the checkboxes, the panel, the class list and the summary label.","testData":"A single applied status, then Clear all","expected":"All five status checkboxes return to TICKED, the panel closes immediately WITHOUT \"Apply\" being clicked, the class list returns to the unfiltered set and the summary label returns to \"All class statuses\".","actual":"-","status":"Pass","remarks":"CORRECTED 2026-09-08 — both [ASSUMED]s resolved, and the previous expected result was WRONG. \"Clear all\" is a RESET TO UNFILTERED, not an \"untick everything\": it re-checks all five statuses, applies immediately with no \"Apply\" click, and closes the panel. This was flagged in the original Remarks as the most likely place for a wrong expected result, and it was.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"11","id":"TST_MRPT_TC_11","title":"Verify classes of every selected status are listed when multiple status filters are applied","req":"#3 — Verify filter","type":"Edge","priority":"Low","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Click \"Filter\".\n2. Tick \"Active\" and \"Not started\".\n3. Click \"Apply\".\n4. Observe the class list.","testData":"Filter: Active + Not started","expected":"The list contains classes of BOTH statuses (an OR combination), not their intersection.","actual":"-","status":"Pass","remarks":"Requires the school to hold at least one \"Not started\" class. All six classes on VED-NEH-KVU were Active on 2026-08-26, so this needs a class whose start date is in the future.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"12","id":"TST_MRPT_TC_12","title":"Verify an empty class list is shown when the applied filter matches no class","req":"#3 — Verify filter","type":"Negative","priority":"Medium","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Click \"Filter\".\n2. Tick \"Deleted\" only.\n3. Click \"Apply\".\n4. Observe the class list area.","testData":"Filter: Deleted","expected":"[ASSUMED] No class rows are rendered and a no-results message naming the applied status is shown (the Classes tab renders \"No classes that are <status>, <label>\").","actual":"-","status":"Pass","remarks":"[ASSUMED] copy — not captured live. Depends on the school holding no soft-deleted class; on a school that does, pick a status that is genuinely absent.","comments":"-","rawStatus":"Pass","isImplemented":true,"implFiles":["schoolReports.test.js","adminSchoolReports.json"]},{"sNo":"13","id":"TST_MRPT_TC_13","title":"Verify the selection count and footer summary update when a single class checkbox is ticked","req":"#4 — Verify class selection checkbox","type":"Positive","priority":"High","preconditions":"Logged in as school-admin <REPORTS_ADMIN_USER>; school \"3 July Test School 1 (key FCN-CHZ-PDA)\" opened; \"Create report\" clicked so the class-selection step is displayed.","steps":"1. Search for \"Fixture_GradeSettings_DO_NOT_DELETE\" so the list holds a single known row.\n2. Tick that row's \"Select class\" checkbox.\n3. Observe the section heading and the bottom of the page.","testData":"Class: \"Fixture_GradeSettings_DO_NOT_DELETE\" (62k3-AXm6), 0 students","expected":"The section heading becomes \"Select classes(1)\". A footer bar appears reading \"You have selected 1 class with a total of 0 students\" and carrying a \"Cancel\" link and a \"Continue\" button.","actual":"-","status":"Pass",
